description: Resume context from a prior agent conversation by name.

input:
  name:
    type: agent
    default: null
    repeatable: true
    description: Optional agent name to resume; omitted means use the default resolver.

steps:
  - name: resolve
    hidden: true
    python: |
      from sase.scripts.agent_chat_from_name import main
      names = {{ name | tojson }}
      main(names or [])
    output: { path: text }

  - name: load_history
    hidden: true
    python: |
      import json
      from sase.history.chat import load_chat_for_resume
      history = load_chat_for_resume({{ resolve.path | tojson }})
      injected_history = (
          "%xprompts_enabled:false\n"
          "# Previous Conversation\n\n"
          f"{history}\n\n"
          "---\n\n"
          "%xprompts_enabled:true\n"
          "# New Query"
      )
      print(json.dumps({"injected_history": injected_history}))
    output: { injected_history: text }

  - name: inject
    prompt_part: |
      {{ load_history.injected_history }}
