input:
  name: { type: word, default: null }

steps:
  - name: resolve
    hidden: true
    python: |
      from sase.scripts.agent_chat_from_name import main
      name = {{ name | tojson }}
      main([name] if name else [])
    output: { path: text }

  - name: load_history
    hidden: true
    python: |
      import json
      from sase.history.chat import load_chat_for_resume
      history = load_chat_for_resume({{ resolve.path | tojson }})
      print(json.dumps({"previous_history": history}))
    output: { previous_history: text }

  - name: inject
    prompt_part: |
      %xprompts_enabled:false
      # Previous Conversation

      {{ load_history.previous_history }}

      ---

      %xprompts_enabled:true
      # New Query
