description: Resume context from a prior agent conversation by name.

input:
  name:
    type: agent
    default: null
    repeatable: true
    description: Optional agent name to resume; omitted means use the default resolver.

steps:
  - name: resolve
    hidden: true
    python: |
      from sase.scripts.agent_chat_from_name import main
      names = {{ name | tojson }}
      main(names or [])
    output: { path: text, sources_json: text }

  - name: load_history
    hidden: true
    python: |
      import json
      from sase.scripts.fork_history import main
      sources = json.loads({{ resolve.sources_json | tojson }})
      main(sources)
    output: { injected_history: text }

  - name: inject
    prompt_part: |
      {{ load_history.injected_history }}
