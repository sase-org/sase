tags: vcs

input:
  - name: cd_ref
    type: word
  - name: workflow_label
    type: word
    default: null

steps:
  - name: setup
    python: |
      import os

      from sase.workspace_provider import resolve_ref

      cd_ref = {{ cd_ref | tojson }}
      pre_allocated = os.environ.get("SASE_CD_PRE_ALLOCATED") == "1"

      if pre_allocated:
          workspace_dir = os.environ["SASE_CD_WORKSPACE_DIR"]
          project_name = "home" if cd_ref == "~" else os.path.basename(workspace_dir)
      else:
          resolved = resolve_ref(cd_ref, "cd")
          workspace_dir = resolved.primary_workspace_dir
          project_name = resolved.project_name

      print(f"_chdir={workspace_dir}")
      print(f"workspace_dir={workspace_dir}")
      print(f"project_name={project_name}")
      print("workflow_name=cd")
    output:
      workspace_dir: path
      project_name: word
      workflow_name: word

  - name: inject
    prompt_part: ""
