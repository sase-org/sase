tags: rollover, commit

environment:
  SASE_COMMIT_METHOD: create_commit

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a commit, branch, or PR / CL yourself.
      Exception: If a post-completion hook instructs you to commit, you MUST follow those instructions and commit.

  - name: check_changes
    use: shared/check_changes

  - name: _has_commit_result
    hidden: true
    python: |
      import os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      path = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      print(f"exists={'true' if path and os.path.isfile(path) else 'false'}")
    output: { exists: bool }

  - name: create
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      if result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          print("success=true")
          print(f"new_commit={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      new_commit: word

  - name: _emit_commit_id
    hidden: true
    if: "{{ create.success }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      if result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          entry_id = d.get("entry_id", "") or ""
          if entry_id:
              print(f"meta_commit_id={entry_id}")
    output:
      meta_commit_id: word

  - name: report
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      if not result_file or not os.path.isfile(result_file):
          print("{}")
      else:
          with open(result_file) as f:
              d = json.load(f)
          out: dict[str, str] = {}
          result = d.get("result", "") or ""
          message = d.get("message", "") or ""
          changespec_name = d.get("changespec_name", "") or ""
          name = d.get("name", "") or ""
          diff_path = d.get("diff_path", "") or ""
          if result:
              out["meta_new_commit"] = result
          if message:
              out["meta_commit_message"] = message
          cs = changespec_name or name
          if cs:
              out["meta_changespec"] = cs
          if diff_path:
              out["diff_path"] = diff_path
          print(json.dumps(out))
    output:
      meta_new_commit: word
      meta_commit_message: text
      meta_changespec: word
      diff_path: path
