tags: rollover, commit

environment:
  SASE_COMMIT_METHOD: create_commit

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT commit them yourself.

  - name: check_changes
    use: shared/check_changes

  - name: create
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      # If stop hook already handled the commit, read the existing result
      if result_file and os.path.isfile(result_file):
          d = json.load(open(result_file))
          print(f"success=true")
          print(f"new_commit={d.get('result', '') or ''}")
          raise SystemExit(0)
      # Create the commit ourselves (Gemini / non-stop-hook path)
      from sase.workflows.commit import CommitWorkflow
      method = os.environ.get("SASE_COMMIT_METHOD", "create_commit")
      who = {{ who | default("agent") | tojson }}
      wf = CommitWorkflow(payload={"message": f"[{who}] Agent changes"}, method=method)
      ok = wf.run()
      if ok and result_file and os.path.isfile(result_file):
          d = json.load(open(result_file))
          print(f"success=true")
          print(f"new_commit={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      new_commit: word

  - name: report
    hidden: true
    bash: |
      RESULT_FILE="${SASE_ARTIFACTS_DIR}/commit_result.json"
      [ -f "$RESULT_FILE" ] || exit 0
      eval "$(python3 -c "
      import json, shlex
      d = json.load(open('$RESULT_FILE'))
      for k in ('result', 'message'):
          print(f'{k}={shlex.quote(d.get(k, \"\") or \"\")}')
      ")"
      [ -n "$result" ] && echo "meta_new_commit=$result"
      [ -n "$message" ] && echo "meta_commit_message=$message"
    output:
      meta_new_commit: word
      meta_commit_message: line
