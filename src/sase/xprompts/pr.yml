tags: rollover

input:
  - name: name
    type: word
  - name: bug_id
    type: int
    default: 0

environment:
  SASE_COMMIT_METHOD: create_pull_request
  SASE_BUG_ID: "{{ bug_id }}"
  SASE_PR_NAME: "{{ name }}"

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a commit, branch, or PR / CL yourself.
      Exception: If a post-completion hook instructs you to commit, you MUST follow those instructions and commit.

  - name: check_changes
    use: shared/check_changes

  - name: _has_commit_result
    hidden: true
    python: |
      import os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      path = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      print(f"exists={'true' if path and os.path.isfile(path) else 'false'}")
    output: { exists: bool }

  - name: create
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      if result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          print("success=true")
          print(f"pr_url={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      pr_url: line

  - name: report
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    bash: |
      RESULT_FILE="${SASE_ARTIFACTS_DIR}/commit_result.json"
      [ -f "$RESULT_FILE" ] || exit 0
      eval "$(RESULT_FILE="$RESULT_FILE" python3 -c "
      import json, os, shlex
      with open(os.environ['RESULT_FILE']) as f:
          d = json.load(f)
      for k in ('result', 'message', 'changespec_name'):
          print(f'{k}={shlex.quote(d.get(k, \"\") or \"\")}')
      ")"
      if [ -n "$message" ]; then
        header=$(echo "$message" | head -1)
        echo "meta_pr_header=$header"
      fi
      [ -n "$result" ] && echo "meta_pr_url=$result"
      [ -n "$changespec_name" ] && echo "meta_changespec=$changespec_name"
      exit 0
    output:
      meta_pr_header: line
      meta_pr_url: line
      meta_changespec: word
