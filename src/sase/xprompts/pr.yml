tags: rollover

input:
  - name: name
    type: word
  - name: bug_id
    type: int
    default: 0

environment:
  SASE_COMMIT_METHOD: create_pull_request
  SASE_BUG_ID: "{{ bug_id }}"

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a commit, branch, or pull request yourself.

  - name: check_changes
    use: shared/check_changes

  - name: create
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      # If stop hook already handled the commit, read the existing result
      if result_file and os.path.isfile(result_file):
          d = json.load(open(result_file))
          print(f"success=true")
          print(f"pr_url={d.get('result', '') or ''}")
          raise SystemExit(0)
      # Create the PR ourselves (Gemini / non-stop-hook path)
      from sase.workflows.commit import CommitWorkflow
      method = os.environ.get("SASE_COMMIT_METHOD", "create_pull_request")
      name = {{ name | tojson }}
      who = {{ who | default("agent") | tojson }}
      wf = CommitWorkflow(
          payload={"message": f"[{who}] Agent changes", "name": name},
          method=method,
      )
      ok = wf.run()
      if ok and result_file and os.path.isfile(result_file):
          d = json.load(open(result_file))
          print(f"success=true")
          print(f"pr_url={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      pr_url: line

  - name: report
    hidden: true
    bash: |
      RESULT_FILE="${SASE_ARTIFACTS_DIR}/commit_result.json"
      [ -f "$RESULT_FILE" ] || exit 0
      eval "$(python3 -c "
      import json, sys
      d = json.load(open('$RESULT_FILE'))
      for k in ('result', 'message', 'changespec_name'):
          print(f'{k}={d.get(k, \"\") or \"\"}')
      ")"
      if [ -n "$message" ]; then
        header=$(echo "$message" | head -1)
        echo "meta_pr_header=$header"
      fi
      [ -n "$result" ] && echo "meta_pr_url=$result"
      [ -n "$changespec_name" ] && echo "meta_changespec=$changespec_name"
    output:
      meta_pr_header: line
      meta_pr_url: line
      meta_changespec: word
