tags: rollover, propose

environment:
  SASE_COMMIT_METHOD: create_proposal

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a commit, branch, or PR / CL yourself.
      Exception: If a post-completion hook instructs you to commit, you MUST follow those instructions and commit.

  - name: check_changes
    use: shared/check_changes

  - name: _has_commit_result
    hidden: true
    python: |
      import os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      path = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      print(f"exists={'true' if path and os.path.isfile(path) else 'false'}")
    output: { exists: bool }

  - name: propose
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      # If stop hook already handled the commit, read the existing result
      if result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          print("success=true")
          print(f"proposal_id={d.get('result', '') or ''}")
          raise SystemExit(0)
      # Create the proposal ourselves (fallback path)
      from sase.workflows.commit import CommitWorkflow
      method = os.environ.get("SASE_COMMIT_METHOD", "create_proposal")
      who = {{ who | default("agent") | tojson }}
      cl_name = os.environ.get("SASE_AGENT_CL_NAME", "")
      wf = CommitWorkflow(payload={"message": f"[{who}] Agent changes", "_cl_name": cl_name}, method=method)
      ok = wf.run()
      if ok and result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          print("success=true")
          print(f"proposal_id={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      proposal_id: word

  - name: _append_entry
    hidden: true
    if: "{{ propose.success }}"
    python: |
      from sase.workflows.commit_utils.post_commit import append_post_commit_entry
      r = append_post_commit_entry(mode="proposal")
      print(f"entry_id={r.entry_id or ''}")
    output:
      entry_id: word

  - name: report
    hidden: true
    if: "{{ check_changes.has_changes or _has_commit_result.exists }}"
    bash: |
      RESULT_FILE="${SASE_ARTIFACTS_DIR}/commit_result.json"
      [ -f "$RESULT_FILE" ] || exit 0
      eval "$(RESULT_FILE="$RESULT_FILE" python3 -c "
      import json, os, shlex
      with open(os.environ['RESULT_FILE']) as f:
          d = json.load(f)
      for k in ('result', 'message'):
          print(f'{k}={shlex.quote(d.get(k, \"\") or \"\")}')
      ")"
      [ -n "$message" ] && echo "meta_commit_message=$message"
    output:
      meta_commit_message: line

  - name: _emit_proposal_id
    hidden: true
    if: "{{ propose.success }}"
    python: |
      entry_id = {{ _append_entry.entry_id | default("") | tojson }}
      if entry_id:
          print(f"meta_proposal_id={entry_id}")
      else:
          # Fallback to commit result value if entry append failed
          import json, os
          artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
          result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
          if result_file and os.path.isfile(result_file):
              with open(result_file) as f:
                  d = json.load(f)
              result = d.get("result", "") or ""
              if result:
                  print(f"meta_proposal_id={result}")
    output:
      meta_proposal_id: word
