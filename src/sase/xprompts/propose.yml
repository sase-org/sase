tags: rollover, propose

environment:
  SASE_COMMIT_METHOD: create_proposal

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT commit or create a proposal yourself.

  - name: check_changes
    use: shared/check_changes

  - name: propose
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import json, os
      artifacts_dir = os.environ.get("SASE_ARTIFACTS_DIR", "")
      result_file = os.path.join(artifacts_dir, "commit_result.json") if artifacts_dir else ""
      if result_file and os.path.isfile(result_file):
          with open(result_file) as f:
              d = json.load(f)
          print("success=true")
          print(f"proposal_id={d.get('result', '') or ''}")
      else:
          print("success=false")
    output:
      success: bool
      proposal_id: word

  - name: report
    hidden: true
    if: "{{ check_changes.has_changes }}"
    bash: |
      RESULT_FILE="${SASE_ARTIFACTS_DIR}/commit_result.json"
      [ -f "$RESULT_FILE" ] || exit 0
      eval "$(RESULT_FILE="$RESULT_FILE" python3 -c "
      import json, os, shlex
      with open(os.environ['RESULT_FILE']) as f:
          d = json.load(f)
      for k in ('result', 'message'):
          print(f'{k}={shlex.quote(d.get(k, \"\") or \"\")}')
      ")"
      [ -n "$result" ] && echo "meta_proposal_id=$result"
      [ -n "$message" ] && echo "meta_commit_message=$message"
    output:
      meta_proposal_id: word
      meta_commit_message: line
