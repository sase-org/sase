input:
  - name: who
    type: line
    default: "man"
  - name: note
    type: line
    default: ""

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a git commit.

  - name: check_changes
    use: shared/check_changes

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_commit_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: commit
    if: "{{ check_changes.has_changes }}"
    bash: |
      sase_commit_workflow \
        --who "{{ who }}" \
        --note "{{ note }}" \
        --data-file "{{ save_response.data_file }}"
    output: { success: bool, entry_id: word, cl_name: word, diff_path: path, error: text }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=committed"
      echo "message=Committed changes{{ ' to ' ~ commit.cl_name if commit.cl_name else '' }} ({{ commit.entry_id | default('') }})"
      echo "meta_new_commit={{ commit.entry_id | default('') }}"
      echo "diff_path={{ commit.diff_path | default('') }}"
    output: { status: word, message: text, meta_new_commit: word, diff_path: path }
