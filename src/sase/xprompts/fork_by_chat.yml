input:
  - name: path
    type: path

steps:
  - name: load_history
    hidden: true
    python: |
      import json
      from sase.history.chat import load_chat_for_resume
      history = load_chat_for_resume({{ path | tojson }})
      print(json.dumps({"previous_history": history}))
    output: { previous_history: text }

  - name: inject
    prompt_part: |
      %xprompts_enabled:false
      # Previous Conversation

      {{ load_history.previous_history }}

      ---

      %xprompts_enabled:true
      # New Query

