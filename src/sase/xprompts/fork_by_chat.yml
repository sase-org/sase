description: Resume context from a specific chat transcript path.

input:
  - name: path
    type: path
    description: Chat transcript file to load into the next prompt.

steps:
  - name: load_history
    hidden: true
    python: |
      import json
      from sase.history.chat import load_chat_for_resume
      history = load_chat_for_resume({{ path | tojson }})
      injected_history = (
          "%xprompts_enabled:false\n"
          "# Previous Conversation\n\n"
          f"{history}\n\n"
          "---\n\n"
          "%xprompts_enabled:true\n"
          "# New Query"
      )
      print(json.dumps({"injected_history": injected_history}))
    output: { injected_history: text }

  - name: inject
    prompt_part: |
      {{ load_history.injected_history }}
