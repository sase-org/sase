input:
  - name: who
    type: line
    default: "man"
  - name: note
    type: line
    default: ""

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a git commit or pull request.

  - name: check_changes
    use: shared/check_changes

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_propose_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: commit
    if: "{{ check_changes.has_changes }}"
    bash: |
      sase_commit_workflow \
        --who "{{ who }}" \
        --note "{{ note }}" \
        --data-file "{{ save_response.data_file }}"
    output: { success: bool, entry_id: word, cl_name: word, diff_path: path, error: text }

  - name: create_pr
    if: "{{ check_changes.has_changes and commit.success | default(false) }}"
    bash: |
      # Detect default branch
      DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@')
      if [ -z "$DEFAULT_BRANCH" ]; then
        DEFAULT_BRANCH="main"
      fi

      CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)

      # Don't create PR if on default branch
      if [ "$CURRENT_BRANCH" = "$DEFAULT_BRANCH" ]; then
        echo "success=false"
        echo "error=Cannot create PR from default branch ($DEFAULT_BRANCH)"
        exit 0
      fi

      # Check for existing PR
      EXISTING_URL=$(gh pr view "$CURRENT_BRANCH" --json url --jq '.url' 2>/dev/null || echo "")
      if [ -n "$EXISTING_URL" ]; then
        echo "pr_url=$EXISTING_URL"
        echo "success=true"
        exit 0
      fi

      # Get PR title from commits
      PR_TITLE=$(git log --format='%s' "origin/$DEFAULT_BRANCH".."$CURRENT_BRANCH" 2>/dev/null | tail -1)
      if [ -z "$PR_TITLE" ]; then
        PR_TITLE="Agent changes on branch $CURRENT_BRANCH"
      fi

      PR_URL=$(gh pr create \
        --base "$DEFAULT_BRANCH" \
        --head "$CURRENT_BRANCH" \
        --title "$PR_TITLE" \
        --body "Automated PR from sase." 2>&1) || true

      if echo "$PR_URL" | grep -q "^http"; then
        echo "pr_url=$PR_URL"
        echo "success=true"
      else
        echo "pr_url="
        echo "success=false"
        echo "error=$PR_URL"
      fi
    output: { pr_url: line, success: bool, error: text }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=proposed"
      echo "message=Committed and created PR{{ ' (' ~ create_pr.pr_url ~ ')' if create_pr.pr_url else '' }}"
      echo "meta_new_commit={{ commit.entry_id | default('') }}"
      echo "diff_path={{ commit.diff_path | default('') }}"
      echo "pr_url={{ create_pr.pr_url | default('') }}"
    output: { status: word, message: text, meta_new_commit: word, diff_path: path, pr_url: line }
