input:
  - name: name

steps:
  - name: resolve
    hidden: true
    python: |
      import json
      import os
      from sase.agent_names import find_named_agent
      name = {{ name | tojson }}
      agent = find_named_agent(name)
      if agent is None:
          raise RuntimeError(f"No agent found with name: {name}")
      done_path = os.path.join(agent.artifacts_dir, "done.json")
      with open(done_path, encoding="utf-8") as f:
          done_data = json.load(f)
      response_path = done_data.get("response_path")
      if not response_path:
          raise RuntimeError(f"No response path found for agent: {name}")
      print(json.dumps({"path": response_path}))
    output: { path: text }

  - name: inject
    prompt_part: |
      #resume_by_chat:{{ resolve.path }}
