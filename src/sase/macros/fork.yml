description: Resume context from a prior agent conversation, monitor turn, or named proc by name.

input:
  name:
    type: agent
    default: null
    repeatable: true
    description: >-
      Optional agent name, named proc name/ID, or monitor turn to resume; omitted means
      use the default resolver. A bare name defaults to its whole session, while an
      exact session-member name keeps that member only.
  target:
    type: wait_target
    keyword_only: true
    default: null
    description: >-
      Choose the whole session or the current turn for each named parent. When omitted,
      bare names mean session and exact session members keep that member.

steps:
  - name: resolve
    hidden: true
    python: |
      from sase.scripts.agent_chat_from_name import main
      names = {{ name | tojson }}
      target = {{ target | tojson }}
      main(names or [], target=target)
    output: { path: text, sources_json: text }

  - name: load_history
    hidden: true
    python: |
      import json
      from sase.scripts.fork_history import main
      sources = json.loads({{ resolve.sources_json | tojson }})
      main(sources)
    output: { injected_history: text }

  - name: inject
    prompt_part: |
      {{ load_history.injected_history }}
