description: Run a structured mentor review against a PR.
tags: mentor

input:
  role:
    type: text
    description: Mentor role statement that defines the review perspective.
  focus_areas_json:
    type: text
    description: JSON array of focus areas the mentor should review.
  cl_name:
    type: word
    default: "null"
    description: Optional PR or Patch name to include in the review prompt.
  vcs_type:
    type: word
    description: Registered workspace directive prefix to use for the PR.
  schema:
    type: text
    description: JSON output schema the mentor response must satisfy.

steps:
  - name: render_focus_areas
    hidden: true
    python: |
      import json
      areas = json.loads(r'''{{ focus_areas_json }}''')
      formatted = "\n".join(
          f"### {a['focus_name']}\n{a['description']}" for a in areas
      )
      print(json.dumps({"rendered_focus_areas": formatted}))
    output: { rendered_focus_areas: text }

  - name: review
    prompt_part: |
      {% if cl_name != "null" %}#{{ vcs_type }}:{{ cl_name }}

      {% endif %}{% if diff_ref %}A diff of the file changes made by this PR can be found in the #{{ diff_ref }} file.

      {% endif %}## Role

      You are a {{ role }}.

      You will review a PR and provide structured feedback on specific focus areas.
      You must NOT make any file changes. Instead, produce structured JSON output
      describing any issues you find.

      IMPORTANT:
      - DO NOT make any comments that are outside the scope of the focus areas below.
      - Do NOT comment on code that was not modified / added by this PR.
      - Every comment MUST be actionable: include the file path, line number, and
        a clear description of what should be changed.
      - You are NOT required to make any comments. Only make comments if you find legitimate issues that are within
        scope of your focus areas.

      ## Focus Areas

      {{ render_focus_areas.rendered_focus_areas }}

      ## JSON Output Format

      #json:`{{ schema }}`

      ## Verification

      Before submitting your final JSON output, write it to a temporary file and
      run `sase comments <file>` to validate and preview it. Fix any errors the
      command reports before producing your final answer.
