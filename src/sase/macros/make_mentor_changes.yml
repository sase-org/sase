description: Apply accepted mentor review comments to a PR.
tags: make_mentor_changes

input:
  accepted_comments_json:
    type: text
    description: JSON array of accepted mentor comments to apply.
  cl_name:
    type: word
    description: PR or Patch name where the changes should be applied.
  vcs_type:
    type: word
    description: Registered workspace directive prefix to use for the target PR.

steps:
  - name: render_changes
    hidden: true
    python: |
      import json
      comments = json.loads({{ accepted_comments_json | tojson }})
      formatted = "\n\n".join(
          f"### Change {i+1}: {c['focus_name']} ({c['severity']})\n"
          f"**File**: `{c['file_path']}:{c['line_number']}`\n"
          f"{c['description']}"
          for i, c in enumerate(comments)
      )
      rendered_changes = (
          "%xprompts_enabled:false\n"
          f"{formatted}\n"
          "%xprompts_enabled:true"
      )
      print(json.dumps({"rendered_changes": rendered_changes}))
    output: { rendered_changes: text }

  - name: apply
    prompt_part: |
      #{{ vcs_type }}:{{ cl_name }}

      Apply the following code review changes to the codebase. Make each change as described,
      run any relevant tests, and commit your changes.

      {{ render_changes.rendered_changes }}
