# Shipped defaults for SASE's built-in size aliases. This file is the single
# edit point for changing what @xsmall, @small, @medium, @large, and @xlarge
# resolve to out of the box. User config (llm_provider.model_aliases.builtin)
# can override only these built-in names.
#
# Each entry carries a `target` (a concrete model, provider/model, `A | B`
# pool, or `A || B` ordered fallback) and a `description`.
schema_version: 1
aliases:
  xsmall:
    target: "claude/sonnet@medium | codex/gpt-5.5@medium | grok/grok-4.6@medium | agy/gemini-3.7-flash-high"
    description: >-
      Extra-small launch alias for the smallest direct tasks and tale follow-ups.
  small:
    target: "claude/sonnet@high | codex/gpt-5.5@high | grok/grok-4.6@high"
    description: "Small launch alias for straightforward task and phase work."
  medium:
    target: "codex/gpt-5.5@xhigh | claude/sonnet@xhigh | grok/grok-4.6@xhigh"
    description: "Medium launch alias for ordinary implementation work."
  large:
    target: "claude/opus@xhigh | codex/gpt-5.6-sol@xhigh"
    description: "Large launch alias for planning-heavy work and default launches."
  xlarge:
    target: "claude/opus@max || codex/gpt-5.6-sol@max || grok/grok-4.6@max"
    description: "Extra-large launch alias for maximum-effort work."
