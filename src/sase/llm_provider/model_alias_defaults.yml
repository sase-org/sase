# Shipped defaults for SASE's built-in size aliases. This file is the single
# edit point for changing what @xsmall, @small, @medium, @large, and @xlarge
# resolve to out of the box. User config (llm_provider.model_aliases.builtin)
# can override only these built-in names.
#
# Each entry carries a `target` (a concrete model, provider/model, `A | B`
# pool, `A || B` ordered fallback, or `(A | B) || C` last-resort) and a
# `description`.
schema_version: 1
aliases:
  xsmall:
    target:
      "claude/claude-haiku-4-5@xhigh | codex/gpt-5.6-luna@xhigh |
      agy/gemini-3.8-flash-high | muse/muse-spark-1.3-contributor@medium"
    description: >-
      Extra-small launch alias for lookup, formatting, and tiny edits with obvious
      checks.
  small:
    target:
      "claude/sonnet@high | codex/gpt-5.6-terra@high | grok/grok-4.6@low |
      muse/muse-spark-1.3-contributor@high"
    description: "Small launch alias for straightforward task and phase work."
  medium:
    target:
      "claude/sonnet@xhigh | codex/gpt-5.6-terra@xhigh | grok/grok-4.6@medium |
      muse/muse-spark-1.3-contributor@xhigh"
    description: "Medium launch alias for ordinary implementation work."
  large:
    target: "claude/opus@high | codex/gpt-5.6-sol@high | grok/grok-4.6@high"
    description: "Large launch alias for planning-heavy work and default launches."
  xlarge:
    target: "claude/opus@xhigh | codex/gpt-5.6-sol@xhigh | grok/grok-4.6@xhigh"
    description: "Extra-large launch alias for maximum-effort work."
