      beads_snooze: "z"
      beads_launch_work: "w"
      beads_open_bug: "E"
      start_bead_issue_mode: "b"
      beads_open_plan: "L"
      # Files sub-tab
      files_next: "j"
      files_prev: "k"
      files_view_selected: "enter"
      files_open_viewer: "Z"
      files_open_external: "E"
      files_open_agent: "a"
      files_filters: "f"
      files_cycle_kind: "z"
      files_copy_path: "Y"
      # PR actions
      patches_filters: "f"
      quit: "q"
      change_status: "s"
      run_workflow: "r"
      mail: "M"
      show_diff: "d"
      reword: "w"
      add_tag: "W"
      view_files: "v"
      jump_to_entry: "apostrophe"
      jump_to_entry_fast: "ctrl+o"
      jump_to_entry_forward: "ctrl+shift+o"
      jump_to_all_entries: "grave_accent"
      edit_spec: "e"
      add_axe_item: "a"
      # AXE-tab only.
      toggle_axe_description: "d"
      rename_cl: "n"
      # Patch edits
      edit_hooks: "F"
      mark_pr_origin: "unbound"
      # Proposals & sync
      accept_proposal: "A"
      rebase: "b"
      start_rewind: "unbound"
      sync: "Y"
      refresh: "R"
      artifacts_copy_reference: "y"
      # Fold / collapse (Agents: h navigates member → family → clan → tribe,
      # collapses an explicitly selected expanded panel, and jumps from a
      # collapsed panel to the last expanded panel when one exists. H compacts
      # Tools; on row focus it first retreats a selected open workflow or
      # family one fold level, then fully collapses remaining agent nodes in the
      # next group, then the selected open clan, then every remaining open
      # clan in that group, then the selected structural fallback and group.
      # On whole-panel focus it hints every expanded fold in that panel.
      # l expands or enters a selected panel; L hints the selected tribe's
      # folds, and one key toggles one fold. Z zooms agent detail or
      # isolates/restores a selected panel. Other tabs retain their fold
      # behavior.)
      hooks_or_collapse: "h"
      hooks_or_collapse_all: "H"
      expand_or_layout: "l"
      expand_all_folds: "L"
      toggle_layout: "p"
      # Marking
      toggle_mark: "m"
      clear_marks: "u"
      bulk_change_status: "S"
      save_marked_agents: "s"
      # Agent / axe
