axe:
  max_runners: 5
  zombie_timeout_seconds: 7200
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      interval: 1
      chops:
        - name: hook_checks
          description: "Process pending hooks and update completion status"
        - name: mentor_checks
          description: "Run mentor review checks on eligible changespecs"
        - name: workflow_checks
          description: "Validate workflow state transitions and rules"
        - name: pending_checks_poll
          description: "Poll for pending check results and update status"
        - name: comment_zombie_checks
          description: "Detect and clean up zombie comment threads"
        - name: suffix_transforms
          description: "Apply suffix-based transformations to changespecs"
        - name: orphan_cleanup
          description: "Remove orphaned resources with no parent changespec"
        - name: wait_checks
          description: "Monitor wait conditions and unblock ready changespecs"
    checks:
      interval: 300
      chops:
        - name: cl_submitted_checks
          description: "Verify submitted changelists pass required checks"
        - name: stale_running_cleanup
          description: "Clean up stale runners that exceeded timeout"
    comments:
      interval: 60
      chops:
        - name: comment_checks
          description: "Process and route new comments on changespecs"
    housekeeping:
      interval: 3600
      chops:
        - name: error_digest
          description: "Compile and summarize recent errors into a digest"

llm_provider:
  provider: ""

vcs_provider:
  provider: "auto"
