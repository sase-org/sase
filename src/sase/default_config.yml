  max_agent_runners: 3
  zombie_timeout_seconds: 7200
  lumberjack_log_max_bytes: 52428800
  lumberjack_log_temp_max_age_seconds: 300
  lumberjack_restart_backoff_max_seconds: 60
  verbose_lumberjack_diagnostics: false
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      description: |-
        Fast lane that advances hook, mentor, and workflow lifecycle state every few seconds

        Runs every five seconds with a 90-second per-chop timeout so completed work is noticed and new work starts
        promptly. Put latency-sensitive Patch lifecycle reconciliation here; slower remote polling, wait
        coordination, and maintenance belong in the other lanes.
      interval: 5
      chop_timeout: "90s"
      chops:
        - name: hook_checks
          script: sase_chop_hook_checks
          description: |-
            Complete finished hooks and start stale ones, with zombie detection

            Scans hook entries on every matching Patch, records completed process results, and starts stale hooks
            when a runner slot is free. Honors max_hook_runners across the tick; stale fix-hook suffixes older than
            zombie_timeout_seconds become ZOMBIE, while terminal Patches may finish hooks but cannot start new ones.
        - name: mentor_checks
          script: sase_chop_mentor_checks
          description: |-
            Start mentor workflows once all hook prerequisites are met

            Reconciles running mentors, stops mentors left behind by older commits, adds matching mentor profiles, and
            launches ready profiles after their hooks finish. Mentor launches share max_agent_runners with other agent
            workflows, and review-ineligible or terminal Patches are skipped.
        - name: workflow_checks
          script: sase_chop_workflow_checks
          description: |-
            Complete finished CRS/fix-hook workflows and start stale ones

            Reads workflow state from every matching Patch, records results for finished CRS and fix-hook agents,
            and launches stale workflows. New workflows share max_agent_runners and the current tick's agent-launch
            budget with mentors, so a full runner pool defers work instead of queueing it.
        - name: pending_checks_poll
          script: sase_chop_pending_checks_poll
          description: |-
            Poll background is_cl_submitted and critique_comments checks for results

            Scans the pending-check directory once per tick, applies completed results to matching Patches, and
            reaps output files orphaned by killed or crashed checks. This chop only consumes background results;
            pr_submitted_checks and comment_checks launch the remote checks.
        - name: comment_zombie_checks
          script: sase_chop_comment_zombie_checks
          description: |-
            Mark comment threads older than zombie_timeout as ZOMBIE

            Examines comment-entry suffix timestamps on matching Patches and writes a ZOMBIE suffix when an entry
            exceeds zombie_timeout_seconds. It performs no remote comment fetch; comment_checks starts those checks and
            pending_checks_poll applies their results.
        - name: suffix_transforms
          script: sase_chop_suffix_transforms
          description: |-
            Strip stale suffixes from older proposals and update mail-readiness markers

            Normalizes matching Patches in place by converting old proposal markers from !: to ~:, removing error
            markers from superseded stitches, and acknowledging attention markers on terminal statuses. It only
            repairs stored suffix state and never launches hooks or agents.
        - name: orphan_cleanup
          script: sase_chop_orphan_cleanup
          description: |-
            Release workspace claims orphaned by reverted PRs with dead PIDs

            Reads all Patches and workspace claims, regardless of the axe query, then releases unpinned claims tied
            to Reverted Patches when their owning PID is absent or dead. Live claims and pinned workspaces are left
            untouched.
        - name: stale_running_cleanup
          script: sase_chop_stale_running_cleanup
          description: |-
            Release workspace claims and terminalize proc rows held by dead processes

            Walks every project, including disabled projects, and releases unpinned workspace claims whose owning
            process has exited. A pinned held claim is preserved while its agent artifacts still exist; this fast-lane
            placement frees ordinary dead claims within seconds. It also terminalizes active proc rows whose supervisor
            exited without reporting.
    waits:
      description: |-
        Resolve agent wait dependencies and keep bead claims and stores in sync

        Runs every ten seconds so waiting agents resume promptly and short-lived bead claims are reconciled quickly.
        Put agent dependency, bead-claim, and bead-store coordination here; Patch lifecycle checks and general
        cleanup belong in their dedicated lanes.
      interval: 10
      chops:
        - name: bead_claim_checks
          script: sase_chop_bead_claim_checks
          description: |-
            Acquire missing bead claims for live pre-launch agents and release claims held by dead ones

            Scans pre-launch agent artifacts, backfills a missing claim for a live waiting agent, and releases a
            claimed bead when its unpromoted owner has died. Reconciled dead records are tombstoned so later ticks avoid
            reopening their stores, while a failed project read is retried safely.
        - name: epic_launch_flush
          script: sase_chop_epic_launch_flush
          run_every: "30s"
          description: |-
            Flush planner completion notifications orphaned by an unsettled epic launch

            Preserves deferrals while a matching detached epic-launch task is active, flushes unowned deferrals after
            a 90-second grace period with a resume command, and reaps unclaimed settle markers after one hour.
        - name: sidecar_auto_sync
          script: sase_chop_sidecar_auto_sync
          run_every: "30s"
          timeout: "2m"
          description: |-
            Fetch and fast-forward opted-in primary sidecar clones (plans, beads, research, custom)

            Scans every enabled project's auto_sync sidecar roles, syncing a role immediately when a publisher left a
            pending hint and otherwise backstopping it at most every five minutes. Projects with a live agent waiting
            on bead completion also hint the beads role every tick, even when that role has not opted into auto_sync,
            so waiters unblock promptly instead of relying on the runner's coarser fallback. Only a clean, attached,
            non-diverged clone with a matching remote is fetched and fast-forwarded; dirty, detached, diverged,
            mismatched, missing, or busy clones are left untouched and reported. Bounded work budget and persistent
            per-role backoff keep one unhealthy clone from stalling the rest.
        - name: wait_checks
          script: sase_chop_wait_checks
          description: |-
            Resolve agent wait dependencies and write ready.json when satisfied

            Scans waiting markers across projects and resolves named-agent, artifact, and closed-bead dependencies from
            shared agent metadata and canonical bead state. It writes ready.json only after every dependency is
            satisfied; invalid or already-ready markers are skipped without blocking other agents.
    checks:
      description: |-
        Poll slower PR-submission and workspace-claim checks on a five-minute cadence

        Runs every five minutes for checks that can tolerate delay or may touch remote PR state, reducing needless
        polling while retaining a cleanup backstop. Fast hook progression, minute-level comments, and hourly
        maintenance deliberately live elsewhere.
      interval: 300
      chops:
        - name: bead_task_triage
          script: sase_chop_bead_task_triage
          timeout: "2m"
          description: |-
            Raise one human gate for each ready or snoozed task bead, and for each due flag-typed task bead

            Scans enabled projects every five minutes and gives every live task bead exactly one pending
            gate: a TaskTriage gate while a task bead is ready and has at least its effective +1 bar in reports
            (its own task type's triage.min_plus_ones, else the global bead.task_triage.min_plus_ones), a BeadSnooze
            wake gate while it is snoozed, and a FlagTriage gate once a flag-typed task bead's date and release removal
            thresholds have both passed. A ready task bead below the +1 bar is withheld from
            triage without changing its stored status, and a gate already raised for a bead that falls below the
            bar is canceled and its notification dismissed. Deterministic gate generations in lane state prevent
            duplicate notifications, a gate of the wrong kind is replaced when its bead's status or due-ness
            changes, and a snoozed bead's notification is re-snoozed to its wake time if it ever drifts. Gates are
            canceled when their beads leave those states, while answered or missing gates can be regenerated
            safely if work remains. Gates stranded by removed projects or forgotten lane state are swept without
            touching projects that are only temporarily unreadable. A gateable bead is deferred while a detached
            launch is still in flight or a live agent is working the bead, and a pending gate is canceled when a
            live agent owns the bead.
        - name: epic_resume
          script: sase_chop_epic_resume
          timeout: "2m"
          description: |-
            Raise one human gate per epic stalled by a failed phase agent (beta, behind epic_resume_gate)

            Scans enabled projects every five minutes for epic clans with a failed member, no live member, and a
            failure old enough to have settled past bead.epic_resume.settle_seconds, then offers exactly one
            EpicResume gate per stalled epic whose single option relaunches it via sase bead work <epic_id>
            --yes-to-all as a detached leased proc. An epic with an in-flight resume launch is deferred instead of
            re-gated. Once a stall's gate is answered or dismissed, that exact failed-member set never gates again;
            only a new failure or a newer clan generation re-gates. The gate is canceled when the epic resumes or
            closes, and lane state is pruned for epics that no longer exist. Disabled by default while the
            detector soaks against real epics; enable with the epic_resume_gate feature flag.
        - name: plugins_required
          script: sase_chop_plugins_required
          timeout: "2m"
          description: |-
            Raise one human gate per project whose required plugins are missing

            Scans enabled projects every five minutes and compares each project's plugins.required list against
            installed distributions. A project with a missing or version-mismatched required set gets exactly one
            pending PluginsRequired gate offering Install and Dismiss. Install runs sase plugin install for each
            missing name from the answering surface and keeps the gate pending when that command fails, including
            when sase is not a uv tool install. Dismiss records the decision so the same missing set is not
            re-offered until it changes. The chop cancels the gate when the set becomes satisfied. Deterministic
            generations in lane state prevent duplicate notifications. Agent and non-interactive contexts still
            fail closed and never auto-install.
        - name: pr_submitted_checks
          script: sase_chop_pr_submitted_checks
          description: |-
            Start background is_cl_submitted checks for leaf PRs with a submitted parent

            Applies the axe query, finds eligible leaf Patches with PR URLs, and launches non-blocking submission
            checks whose results are collected by pending_checks_poll. A five-minute sync cache suppresses duplicate
            remote work, except that the first cycle checks eligible leaves immediately.
        - name: stale_running_cleanup
          script: sase_chop_stale_running_cleanup
          description: |-
            Backstop release of workspace claims and proc rows held by dead processes

            Runs the same all-project dead-process reconciliation as the hooks-lane cleanup, including conservative
            handling of pinned claims with agent artifacts and terminalization of orphaned active proc rows. This
            five-minute placement still frees stale workspace claims and proc rows if the fast hooks lane is disabled,
            restarting, or repeatedly failing.
    external_mirror:
      description: |-
        Mirror external tracker issues and pull requests on a fifteen-minute cadence

        Runs external_issue_mirror and external_pr_mirror once per enabled project, generously paced so remote
        polling never overruns its own tick or delays the checks lane's PR-submission and workspace-claim work.
        A five-minute per-chop timeout bounds one unhealthy pass without stalling later ticks.
      interval: 900
      chop_timeout: "5m"
      chops:
        - name: external_issue_mirror
          script: sase_chop_external_issue_mirror
          for_each:
            source: projects
            vcs: [git, gh]
          description: |-
            Mirror every external tracker issue into a task bead

            Expands to one instance per enabled project and diffs that project's tracker against local beads on
            external_ref, creating small open task beads for uncovered issues. Upstream closes and reopens update
            mirrored beads when safe; referenced, worked, parented, and already-matching beads get attributed notes
            only. A per-pass creation cap, bounded store-lock waits, and persistent exponential backoff keep one large
            backlog or one unreachable tracker from stalling the pass.
        - name: external_pr_mirror
          script: sase_chop_external_pr_mirror
          timeout: "5m"
          for_each:
            source: projects
            vcs: [git, gh]
          description: |-
            Adopt remote pull requests SASE did not create as local Patches

            Runs once per enabled git/gh project and first checks whether its provider can list pull requests. Each
            pass fetches a bounded PR inventory, writes open PRs to the active ProjectSpec, writes merged or closed PRs
            directly to the archive, advances a cursor only after clean runs, and performs a daily full repair scan.
            The SASE_PATCH marker identifies PRs created by SASE's tracked PR workflow; direct gh pr create calls are
            adopted as external.
    comments:
      description: |-
        Start background critique-comment checks for mailed PRs every minute

        Runs every minute so reviewer feedback reaches active Patches promptly without polling on every hooks tick.
        Only remote comment-check launches belong here; pending result collection and zombie marking remain in the
        faster hooks lane.
      interval: 60
      chops:
        - name: comment_checks
          script: sase_chop_comment_checks
          description: |-
            Start background critique_comments checks for all mailed PRs

            Applies the axe query and starts non-blocking critique_comments checks for mailed Patches that have an
            available workspace, then records a comment-cycle summary. The lumberjack's one-minute interval is the
            polling throttle; pending_checks_poll later consumes each background result.
    housekeeping:
      description: |-
        Run hourly error digests, managed-temp cleanup, and stale task-bead sweep

        Runs once an hour because notification batching, bounded scratch reclamation, and stale-backlog
        cleanup are useful but not latency-sensitive. Put durable maintenance that may scan substantial
        local state here, not lifecycle, dependency, or remote polling work.
      interval: 3600
      chops:
        - name: error_digest
          script: sase_chop_error_digest
          description: |-
            Send a notification digest of errors from the last hour

            Reads the AXE error log and the last successful digest timestamp, then notifies only about newer errors
            within the rolling one-hour window. The checkpoint advances to the newest notified timestamp, preventing
            duplicate digests while leaving unsent errors eligible after a notification failure.
        - name: managed_tmp_reap
          script: sase_chop_managed_tmp_reap
          description: |-
            Prune stale scratch under the managed SASE temp root

            Removes old children from known managed-temp buckets using workload-specific age limits, without following
            symlinks or deleting the stable bucket directories. Each pass removes at most 2,000 entries and de-indexes
            deleted agent-artifact directories, so a neglected root converges without blocking interactive commands.
        - name: bead_stale_cleanup
          script: sase_chop_bead_stale_cleanup
          timeout: "2m"
          description: |-
            Sweep stale sub-threshold ready task beads into one BeadStaleCleanup gate

            Reads every enabled project's ready task beads and offers those that have sat below
            their effective +1 bar (their own task type's triage.min_plus_ones, else the global
            bead.task_triage.min_plus_ones) for bead.task_triage.stale_after_days once at least
            bead.task_triage.stale_cleanup_min_beads such beads exist. One pending gate at a time
            carries at most 50 beads, oldest first; a larger backlog is reported in omitted_count and
            offered on later ticks. An unchanged roster leaves the pending gate alone. The gate is
            canceled when the backlog drops below the bar.


llm_provider:
  # Registered provider to use. One of: claude, codex, qwen, opencode, agy,
  # grok, muse, fakey. Empty auto-detects by plugin-declared priority; `grok`
  # and `muse` declare no priority and are only ever selected by naming them
  # here, by %model:<provider>/<model>, or via SASE_<PROVIDER>_PATH.
  provider: ""
  # Default reasoning-effort level for agent launches that don't request one
  # via %effort or a %model:<model>@<effort> suffix. Empty means no override.
  # Allowed: none, minimal, low, medium, high, xhigh, max.
  default_effort: ""
  # Scalar launch defaults. These use the same grammar as %model and may point
  # at one of the five built-in size aliases. Invalid values are ignored and
  # fall back to the shipped defaults below.
  default_model: "@large"
  epic_lander_model: "@large"
  big_epic_lander_model: "@xlarge"
  # Maximum prior runs shown for one alias in the Launch Control agent-history
  # panel. Values below 1 are ignored and fall back to 10.
  model_alias_history_limit: 10
  # Model aliases for launch sizes, delegated work, and reusable prompts.
  # SASE ships exactly five built-in aliases: @xsmall, @small, @medium, @large,
  # and @xlarge. Phase and tale size launches route through these aliases
  # directly, and the scalar launch defaults above choose the no-%model and
  # epic lander defaults.
  # Use `A | B` for round-robin or `A || B` for ordered fallback; do not mix
  # the operators. Prefix a pool member with a positive integer to weight it
  # (`A | 3 B` selects B three times as often as A). Weights are invalid in
  # `||` fallback chains.
  # Values may be a bare known model (opus), an explicit
  # provider/model (codex/gpt-5.6-sol or muse/muse-spark-1.2), a nested
  # provider-local path (opencode/anthropic/claude-sonnet-4-5), or an
  # @<alias> reference. An alias
  # reference may carry a trailing @<effort> that overrides its target's effort.
  # User-invented aliases live under custom and must include a description for
  # completions and Launch Control. Bucket membership is display-only: ACE
  # shows only buckets referenced by custom aliases.
  # Current shipped defaults and descriptions for every builtin alias below are
  # the single responsibility of
  # src/sase/llm_provider/model_alias_defaults.yml; the target values shown
  # here are grammar examples only, not the shipped defaults.
  # model_aliases:
  #   builtin:
  #     xsmall: "claude/sonnet@medium | codex/gpt-5.5@medium"
  #     small: "claude/sonnet@high | codex/gpt-5.5@high"
  #     medium: "codex/gpt-5.5@xhigh | claude/sonnet@xhigh | 3 grok/grok-4.6@xhigh"
  #     large: "claude/opus@xhigh | codex/gpt-5.6-sol@xhigh"
  #     xlarge: "claude/opus@max || codex/gpt-5.6-sol@max"
  #   custom:
  #     blogger:
  #       model: claude/opus
  #       description: "Agents that draft and edit blog posts."
  #       bucket: writing          # optional Launch Control grouping
  #   buckets:
  #     writing:
  #       description: "Writing and editing roles."
  retry:
    claude:
      max_retries: 3
      error_patterns:
        - "API Error: 500"
        - "API Error: 529"
        - "Internal server error"
        - "overloaded_error"
      wait_times: [60, 300, 1800]
      fallback_model: "sonnet"
    codex:
      max_retries: 3
      error_patterns:
        - "exceeded retry limit"
        - "429 Too Many Requests"
        - "Too Many Requests"
        - "rate limit"
        - "failed to connect to websocket"
        - "Selected model is at capacity"
      wait_times: [60, 300, 1800]
    # Process-version skew is provider-independent. A fresh retry inherits the
    # existing workspace so failures late in a run do not discard agent work.
    sase:
      max_retries: 1
      error_patterns:
        - "uses a format this process does not understand"
      wait_times: [0]
      preserve_workspace: true
      spawn_new_agent: true
    # Fakey ships retry defaults in its provider hook. Uncomment to override
    # them for local retry experiments.
    # fakey:
    #   max_retries: 3
    #   error_patterns: ["FAKEY-RETRYABLE"]
    #   wait_times: [0]
  # Usage-limit auto-disable policy. Positive provider-scoped matches create a
  # machine-wide temporary provider disable before retry policy runs; plain
  # transient 429s that do not match still use llm_provider.retry.
  # usage_limit:
  #   enabled: true              # false disables usage-limit classification
  #   disable_seconds: 86400     # 24h fallback when no reset hint is honored
  #   min_disable_seconds: 60    # lower bound for provider-reported reset hints
  #   max_disable_seconds: 604800 # upper bound for reset hints (7d)
  #   honor_reset_hint: true     # parse provider reset hints (clock time, absolute
  #                              # date, or duration) when possible
  #   notify: true               # notify once for each new disable window
  #   providers:
  #     claude:
  #       # User patterns are additive with provider defaults by default.
  #       patterns:
  #         - "you've hit your usage limit"
  #       # Exclusions are always additive and suppress otherwise matching text.
  #       exclude_patterns:
  #         - "usage limit approaching"
  #       # true makes patterns literal replacements; [] intentionally disables
  #       # this provider's detector without removing future built-in defaults.
  #       replace_patterns: false
  #       # null inherits the global value; an integer overrides it per provider.
  #       # A provider plugin may also ship its own non-null built-in default
  #       # here (e.g. grok's 48h), which user config below then overrides.
  #       disable_seconds: null
  #       # null inherits the global reset-hint policy; true/false overrides it.
  #       honor_reset_hint: null

commit:
  finalizer:
    enabled: true
    max_passes: 2
  message:
    # Reject `sase stitch create` messages whose subject line is not a Conventional
    # Commit (`type(scope)!: description`). Merge, revert, and fixup subjects
    # are always exempt.
    require_conventional_subject: true
    # Commit types this project accepts. A configured list replaces the
    # built-in set rather than extending it.
    allowed_types: [build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test]

vcs_provider:
  provider: "auto"
  use_project_pr_prefix: false
  pr_tags: {}

vcs_repo_completion:
  enabled: true
  cache_ttl_seconds: 600
  max_repos: 200

vcs_ref_completion:
  enabled: true

telemetry:
  enabled: true
  flush_interval_seconds: 15
  retention:
    raw_seconds: 172800
    rollup_5m_seconds: 2592000
    rollup_1h_seconds: 31536000
  health_thresholds:
    error_rate_warn: 10.0
    error_rate_critical: 25.0
    retry_rate_warn: 10.0
    retry_rate_critical: 25.0
    p95_latency_warn: 300.0
    p95_latency_critical: 600.0

sdd:
  # Controls remote freshness for bead commands in sidecar repositories.
  # background keeps the command path local and launches a TTL-gated managed
  # fetch/rebase/push worker; blocking restores pull-before-command behavior;
  # off disables command-triggered refreshes (normal post-commit push policy
  # still applies).
  bead_refresh:
    mode: background
    ttl_seconds: 120
  repo:
    # Optional sidecar SDD repo override for providers that support
    # separate_repo storage. Accepts "name" or "owner/name"; empty uses the
    # provider default (GitHub: <owner>/<repo>--sdd).
    name: ""
  # Controls `git push` after SDD commits in separate_repo storage. Accepts:
  #   true  - push synchronously; failures only warn and the local commit is
  #           preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` (default).
  # Runner-owned `%id(..., bead=...)` claim transitions are an exception: they
  # commit locally and synchronously run managed publication so reservations,
  # promotions, and releases are promptly visible regardless of this setting.
  # Failed publication preserves the local transition for periodic retry.
  push_after_commit: async

workspace:
  # Workspace root policy: "xdg-state" (default platform state dir),
  # "adjacent" (legacy opt-in `primary_<num>/` layout), or an absolute path.
  # `SASE_WORKSPACE_ROOT` overrides this when set.
  root: xdg-state
  # Explicit override for project_key namespacing under managed roots.
  # Empty string means derive from git remote or primary path.
  project_key: ""
  # Days before unclaimed managed workspaces are eligible for cleanup.
  cleanup_ttl_days: 14

bead:
  # Epic plans with at least this many authored phases use
  # llm_provider.big_epic_lander_model unless the plan sets an explicit land
  # model.
  big_epic_phase_threshold: 5
  # Volume controls for task-bead triage gates. A ready task bead earns a
  # TaskTriage gate only once independent reporters have corroborated it, and
  # the remainder that never clears that bar is swept periodically instead of
  # accumulating forever.
  task_triage:
    # +1 reports a ready task bead needs before bead_task_triage raises its
    # TaskTriage gate. Applies to untyped legacy beads and to task types that
    # declare no triage.min_plus_ones of their own; a typed bead's own bar
    # always takes precedence. 0 restores the pre-threshold behavior of
    # gating every such ready task bead.
    min_plus_ones: 1
    # Days after creation at which a still-sub-threshold ready task bead is
    # considered stale and eligible for the cleanup gate.
    stale_after_days: 7
    # Stale beads required before bead_stale_cleanup raises its gate. Below
    # this count the chop does nothing.
    stale_cleanup_min_beads: 10
  # Volume controls for the epic_resume chop, which raises an EpicResume gate
  # when a failed phase agent stalls an epic. Off by default; enable the
  # epic_resume_gate feature flag to opt in.
  epic_resume:
    # Seconds the newest clan-member failure must sit before the epic_resume
    # chop treats the epic as stalled. Guards against gating on a handoff
    # race or a fast retry.
    settle_seconds: 120
  # Controls the post-commit `git push` after `sase bead work` successfully
  # commits the sdd/beads bead-state mutation (canonical events plus
  # compatibility projections). Accepts:
  #   true  - push synchronously (default); failures only warn and the local
  #           commit is preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` so the command returns
  #           without waiting on remote network/credential latency. The push
  #           runs non-interactively; failures are written to a log file whose
  #           path is printed. `sase bead work --no-push` overrides this to skip
  #           the push for a single invocation.
  push_after_commit: true

external_mirror:
  # One shared filter surface governs which tracker issues become beads and
  # which remote pull requests become Patches. Each *_globs list accepts
  # !-prefixed exclusions: a record matches a criterion if it matches any
  # positive glob (or the criterion has no positive globs) and matches no
  # negative glob; a record is mirrored only when every criterion accepts it.
  # Matching is case-folded. Setting a criterion here replaces the shipped
  # defaults for that criterion rather than appending to them. Filters gate
  # creation only: a record a filter now excludes keeps whatever bead or
  # Patch it already has, the mirror never deletes.
  issues:
    filters:
      # Empty by default, which keeps the bead list a strict superset of the
      # issue list, which is what lets the Artifacts tab drop a separate
      # issue inventory.
      author_globs: []
      label_globs: []
      title_globs: []
      states: []
  pull_requests:
    filters:
      author_globs: []
      base_ref_globs: []
      # Excludes release-please and release-plz PRs by default; head_ref is
      # the reliable key because release-please authors as a human account on
      # some repos and titles are user-configurable.
      head_ref_globs:
        - "!release-please--*"
        - "!release-please/*"
        - "!release-plz-*"
        - "!release-plz/*"
      title_globs: []
      states: []
  # Deprecated: use issues.filters.label_globs, which wins once it is
  # non-empty. Tracker labels whose issues are never mirrored into beads.
  exclude_labels: []
  # Deprecated: use pull_requests.filters.author_globs, which wins once it is
  # non-empty. Remote PR authors whose pull requests are adopted as Patches.
  pr_authors: []

xprompt_aliases:
  c: commit
  p: propose
xprompts:
  # keep-sorted start

  bd/land_epic:
    tags: land_epic
    input:
      bead_id: word
    content: |
      You are the land agent for epic bead {{ bead_id }}: verify the epic is truly complete, integrate it with changes
      that landed since it started, then close it out.

      1. Verify. Run `sase bead show {{ bead_id }}` (children, linked plan file), review the epic bead's own notes, then
         run `sase bead show` on every child and review every child note. Confirm each note was addressed, and read the
         actual source code and the epic's commits (bead IDs appear in commit messages) to confirm the work previous
         agents reported complete really is. While reviewing child beads, collect every `PROPOSED FOLLOW-UP:` note entry.

      2. Integrate. Changes committed since this epic started could not integrate with this epic's feature while it was
         incomplete. Find them (e.g. `git log` since the first commit mentioning {{ bead_id }}, excluding the epic's own
         commits; in a PR workflow also review commits on the base branch) and update anything that should now use what
         this epic added or that duplicates or conflicts with it. This integration is part of the epic's work.

      3. Land. Unresolved issues caused by this epic remain epic work: plan and finish them before closing. For each
         genuinely distinct follow-up that is not caused by the epic, use `/sase_new_task` with details identifying the
         proposing bead; it will corroborate a duplicate, attach a causally related active-epic issue, or create a sized
         task as appropriate. Record every outcome, including why any proposal was declined, in your close note. Before
         closing, run `sase bead epic-symbols {{ bead_id }}`. Every listed `--epic-symbol` entry is keyed to this epic
         or one of its phases and goes stale the instant that bead closes. For each entry, either resolve the symbol
         (wire it up, privatize it, add a non-test pragma, or delete it per the Symvision epic-whitelist policy) or,
         only when a still-open later bead still needs the exemption, re-key the Justfile line to that open bead. Do not
         leave that judgment for the next agent. `sase bead close` refuses while any of these entries remain. Close the
         epic with `sase bead close {{ bead_id }} --note "<what you verified in steps 1-2>"`. After closing, run
         `just symvision` if available to confirm the whitelist is clean. Finally, set `status: done` in the frontmatter
         of the epic's plan file (the PLAN path shown by `sase bead show`). If the close is rejected because leftover
         `--epic-symbol` entries remain, finish that cleanup and close again. If the close is rejected because named
         phases were never completed: finish or reopen them, or record the outcome deliberately with
         `--force --reason ... --resolution canceled|superseded`. Never force merely to make the command succeed, and
         never use `--force` to advance a successful nested landing.

      If steps 1-2 uncover remaining work, use your /sase_plan skill to plan it and complete the skill's tier-aware
      validate/revalidate/propose loop. Plan only the remaining work. Do not include this epic's close, symvision pass,
      or plan-file status update as a child phase; the child epic's `parent_bead` link is the handoff that lets its land
      agent resume this interrupted landing after the child lands.

      After the current epic closes, inspect the linked `parent_bead` from `sase bead show {{ bead_id }}`. If there is
      no parent bead, finish normally. If the parent is a phase bead, verify this child plan completed the work required
      by that phase, close only that parent phase normally with `sase bead close <parent-bead> --note "<what you
      verified>"`, and leave the containing epic to its already-waiting land agent. If the parent is a plan bead, review
      the parent's previous landing note, all descendants and notes, linked plan file, and post-child drift; rerun
      descendant and linked-plan readiness checks before closing it. When the parent plan is still complete, retire any leftover `--epic-symbol`
      entries first (`sase bead epic-symbols <parent-bead>`), close it normally with
      `sase bead close <parent-bead> --note "<what you rechecked>"`, confirm with `just
      symvision`, mark its linked plan file done, and then repeat through directly parented plan ancestors
      while each remains fully complete. Stop at the first incomplete or ambiguous parent, record a note on that parent describing the blocker,
      and report it in your final response.
  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the canonical prompt archive entry for {{ file_base }} against the plan in the
      @sdd/plans/*/{{ file_base }}.md file and ensure that the following qualities are met? Use
      `sase agent prompts show {{ file_base }}` if the prompt is not already in context.

        1. ALL requirements in the prompt file have been satisfied.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the canonical prompt archive entry for {{ file_base }} and look for
      gaps / ambiguity in the requirements? Use `sase agent prompts show {{ file_base }}` if the prompt is not already in
      context. In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that prompt?
  bd/work_phase_bead:
    tags: work_phase_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for bead {{ bead_id }}? The bead is already reserved for you and assigned to your agent
      name: it was set to status=in_progress before you started reading this, either by the `sase bead work` launch
      checkpoint or by the runtime promoting an ad-hoc wait-time claim. Do not set the status by hand. Read its
      description and design file, do the work, and close only this bead with
      `sase bead close {{ bead_id }} --note "<what you verified>"`. Before closing, run
      `sase bead epic-symbols {{ bead_id }}`. If this phase still has `--epic-symbol` entries, resolve each symbol or
      re-key the Justfile line to a still-open bead (the parent epic or a later phase). `sase bead close` refuses while
      leftovers remain; they go stale the instant this phase closes and turn unrelated agents' `just check` red. Closing
      an assigned phase bead is unaffected by the parent-close descendant guard. Do NOT close the parent epic or any ancestor plan bead. Any instruction in a phase
      description or child plan to close an ancestor is preparation and evidence for that ancestor's land agent, not
      authorization for a phase worker. Do not create beads yourself: record discovered follow-up work as a
      `PROPOSED FOLLOW-UP:` entry via
      `sase bead note {{ bead_id }} 'PROPOSED FOLLOW-UP: <one-line summary — detail>'`; the epic's land agent triages
      these into task beads.
  bd/work_task:
    tags: work_task_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for task bead {{ bead_id }} by running the `sase bead show {{ bead_id }}` command,
      reviewing the command's output, doing the work, and then closing the bead by running the
      `sase bead close {{ bead_id }} --note "<what you verified>"` command?

      If you discover genuinely distinct follow-up work that is outside this task, use `/sase_new_task` with details
      identifying the current bead; it will corroborate a duplicate, attach a causally related active-epic issue, or
      create a sized task as appropriate.
  epic: |
    This is a large piece of work that should be split into phases. I'll let you decide how many phases to create, but
    keep in mind that each phase will be completed by a distinct agent instance (i.e. a distinct `claude` / `agy` /
    `codex` / `qwen` / `opencode` / `muse` command). #plan
  if_not_plan: |
    If not, use your /sase_plan skill to plan the appropriate changes.
  plan: |
    Think this through thoroughly and create a plan using your `/sase_plan` skill. Choose and author the appropriate
    tier, validate and revalidate until it passes, then submit it with `sase plan propose` (as the skill instructs)
    before making any file changes.
  prompt/approve: |
    I've edited the previous agent's reply with my decisions. Can you help me implement this? #plan
  prompt/review:
    input:
      prompt: text
    content: |
      Can you help me review the prompt I've prepared below and look for gaps / ambiguity in the requirements? In
      particular, what design decisions would you need from me if I were to ask you to implement the functionality described
      by that prompt?

      ## THE PROMPT
      {{ prompt }}
  review: |
    Can you help me fix any bugs that were introduced by this implementation? Also, look for any ways you can improve
    the implementation, but make sure any improvements you make are clear wins (not subjective).
  x:
    input: { name: word, cmd: text }
    content: "@$(sase_xcmd {{ name }} {{ cmd }})"
  # keep-sorted end
