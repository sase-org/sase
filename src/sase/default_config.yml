amd_h1_title: null
amd_agents_template: null
amd_agents_minimal_template: null
is_sase_managed: false
use_chezmoi: false
commit_hooks:
  before: ""
  after: ""
# SASE-managed projects receive <project>--plans and <project>--research
# linked repositories unless project-local configuration disables them.
default_linked_repos: true
# Linked repositories are lazy by default. Set auto_clone: true per entry when
# every launched agent needs the repository materialized in its workspace.
linked_repos: []

agent_family:
  plan_approval:
    # Per-project sticky defaults for custom members shown in the plan
    # approval options modal. Role ids map to true (default on) or false
    # (default off), overriding each role definition's default.
    default_members: {}

update:
  dev_root: "~/projects/github"

chat_install:
  timeout_seconds: 900
  restart_attempts: 3

mobile_gateway:
  bind_address: "127.0.0.1"
  port: 7629
  state_dir: ""
  allow_non_loopback: false
  command: ""
  push_provider: "disabled"
  fcm_project_id: ""
  fcm_service_account_json: ""
  fcm_credential_env: ""
  fcm_dry_run: false
  push_timeout_seconds: 5
  push_retry_limit: 1
  startup_timeout_seconds: 10

ace:
  repro_output_dir: ""
  snippets: {}
  tool_calls:
    slow_threshold_seconds: 20
  artifact_viewer:
    video:
      audio: false
      loop: false
      vo: "kitty"
      extra_mpv_args: []
  updates:
    startup_toast: true
    startup_toast_max_commits: 20
    post_update_toast: true
    post_update_toast_diffstat: true
    indicator: true
    check_ttl_minutes: 10
    incoming_commits:
      enabled: true
      max_per_repo: 7
      confirm_max_per_repo: 250
  prompt_completion:
    auto: soft
    debounce_ms: 90
    auto_file_paths: false
    auto_xprompt_menu: true
    auto_directive_menu: true
    max_auto_rows: 1
  keymaps:
    app:
      # Navigation
      next_changespec: "j"
      prev_changespec: "k"
      scroll_to_top: "g"
      scroll_to_bottom: "G"
      scroll_detail_down: "ctrl+d"
      scroll_detail_up: "ctrl+u"
      scroll_prompt_down: "ctrl+f"
      scroll_prompt_up: "ctrl+b"
      next_agent_file: "ctrl+n"
      prev_agent_file: "ctrl+p"
      # Tab switching
      next_tab: "tab"
      prev_tab: "shift+tab"
      # PR actions
      quit: "q"
      change_status: "s"
      run_workflow: "r"
      mail: "M"
      show_diff: "d"
      reword: "w"
      add_tag: "W"
      view_files: "v"
      jump_to_entry: "apostrophe"
      jump_to_entry_fast: "ctrl+o"
      jump_to_entry_forward: "ctrl+k"
      jump_to_all_entries: "grave_accent"
      edit_spec: "e"
      rename_cl: "n"
      # ChangeSpec edits
      edit_hooks: "f"
      # Proposals & sync
      accept_proposal: "A"
      rebase: "b"
      start_rewind: "R"
      sync: "Y"
      refresh: "y"
      # Fold / collapse
      hooks_or_collapse: "h"
      hooks_or_collapse_all: "H"
      expand_or_layout: "l"
      expand_all_folds: "L"
      toggle_layout: "p"
      # Marking
      toggle_mark: "m"
      clear_marks: "u"
      bulk_change_status: "S"
      save_marked_agents: "s"
      # Agent / axe
      kill_agent: "x"
      open_agent_cleanup_panel: "X"
      stop_axe_and_quit: "Q"
      start_custom_agent: "plus"
      start_agent_home: "space"
      start_agent_from_changespec: "ctrl+@"
      start_last_vcs_xprompt_in_editor: "ctrl+g"
      restore_prompt_stash: "at"
      jump_to_agent_changespec: "enter"
      edit_panel: "E"
      show_agent_run_log: "V"
      open_agent_artifacts: "a"
      # Thinking panel
      toggle_thinking: "right_square_bracket"
      toggle_thinking_reverse: "left_square_bracket"
      # Attempt history (agents tab)
      toggle_attempt_view: "D"
      # Manual unread marker (agents tab)
      toggle_agent_unread: "U"
      # Agent tag modal (agents tab)
      add_agent_tag: "N"
      # Tag-driven side panels (agents tab)
      focus_next_agent_panel: "J"
      focus_prev_agent_panel: "K"
      # Grouping mode cycle (agents tab)
      cycle_grouping_mode: "o"
      cycle_grouping_mode_reverse: "O"
      # Queries
      edit_query: "slash"
      prev_query: "circumflex_accent"
      next_query: "underscore"
      # Display / misc
      toggle_hide_reverted: "full_stop"
      toggle_hide_submitted: "x"
      show_notifications: "i"
      show_help: "question_mark"
      open_config_center: "number_sign"
      open_command_palette: "colon,semicolon"
      dismiss_toasts: "ctrl+l"
      # Workspace mode prefixes
      checkout: "C"
      start_checkout_mode: "c"
      open_tmux: "T"
      start_tmux_mode: "t"
      # Tree navigation prefixes
      start_ancestor_mode: "<"
      start_child_mode: ">"
      start_sibling_mode: "~"
      # Mode activation prefixes
      start_fold_mode: "z"
      zoom_panel: "z"
      start_leader_mode: "comma"
      start_bang_mode: "exclamation_mark"
      copy_tab_content: "percent_sign"
    modes:
      fold_mode:
        prefix: "z"
        keys:
          cycle_commits: "c"
          cycle_hooks: "h"
          cycle_mentors: "m"
          cycle_timestamps: "t"
          cycle_deltas: "d"
          toggle_commits: "C"
          toggle_hooks: "H"
          toggle_mentors: "M"
          toggle_timestamps: "T"
          toggle_deltas: "D"
          cycle_all: "z"
          toggle_all: "Z"
      copy_mode:
        prefix: "percent_sign"
        keys:
          changespecs:
            raw: "percent_sign"
            with_snapshot: "exclamation_mark"
            bug: "b"
            pr_number: "c"
            name: "n"
            spec: "p"
            snapshot: "s"
          agents:
            chat: "c"
            file_path: "E"
            name: "n"
            prompt: "p"
            snapshot: "s"
          axe:
            visible: "o"
            full: "O"
            snapshot: "s"
      leader_mode:
        prefix: "comma"
        keys:
          repeat_last: "comma"
          run_cmd: "exclamation_mark"
          runners: "R"
          revert_agent: "r"
          kill_mentors: "M"
          review_mentors: "C"
          agent_home: "h"
          agent_from_cl: "space"
          toggle_agent_panel_grouping: "g"
          jump_to_next_unread_done_agent: "j"
          jump_to_next_stopped_agent: "J"
          full_history_refresh: "y"
          mark_all_unread_done_agents_read: "u"
          kill_and_edit: "x"
          clear_comments: "c"
          open_prompt_stash: "at"
          jump_to_notification: "n"
          prompt_history: "full_stop"
          prompt_history_edit_first: "ctrl+g"
          prompt_history_cancelled: "greater_than_sign"
          agent_run_log: "A"
          models_panel: "m"
          update_sase: "U"
          capture_agents_repro: "B"
          toggle_agents_repro_checks: "T"
      bang_mode:
        prefix: "exclamation_mark"
        keys:
          run_cmd: "exclamation_mark"
          toggle_axe: "x"

axe:
  max_hook_runners: 3
  max_agent_runners: 3
  zombie_timeout_seconds: 7200
  lumberjack_log_max_bytes: 52428800
  verbose_lumberjack_diagnostics: false
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      interval: 5
      chop_timeout: "90s"
      chops:
        - name: hook_checks
          description: "Complete finished hooks and start stale ones, with zombie detection"
        - name: mentor_checks
          description: "Start mentor workflows once all hook prerequisites are met"
        - name: workflow_checks
          description: "Complete finished CRS/fix-hook workflows and start stale ones"
        - name: pending_checks_poll
          description: "Poll background is_cl_submitted and critique_comments checks for results"
        - name: comment_zombie_checks
          description: "Mark comment threads older than zombie_timeout as ZOMBIE"
        - name: suffix_transforms
          description: "Strip stale suffixes from older proposals and update mail-readiness markers"
        - name: orphan_cleanup
          description: "Release workspace claims orphaned by reverted PRs with dead PIDs"
        - name: stale_running_cleanup
          description: "Release workspace claims held by dead processes"
    waits:
      interval: 10
      chops:
        - name: wait_checks
          description: "Resolve agent wait dependencies and write ready.json when satisfied"
    checks:
      interval: 300
      chops:
        - name: cl_submitted_checks
          description: "Start background is_cl_submitted checks for leaf PRs with a submitted parent"
        - name: stale_running_cleanup
          description: "Backstop release of workspace claims held by dead processes"
    comments:
      interval: 60
      chops:
        - name: comment_checks
          description: "Start background critique_comments checks for all mailed PRs"
    housekeeping:
      interval: 3600
      chops:
        - name: error_digest
          description: "Send a notification digest of errors from the last hour"

llm_provider:
  provider: ""
  # Default reasoning-effort level for agent launches that don't request one
  # via %effort or a %model:<model>@<effort> suffix. Empty means no override.
  # Allowed: none, minimal, low, medium, high, xhigh, max.
  default_effort: ""
  # Model aliases for no-%model launches, delegated work, and reusable prompts.
  # Builtin role overrides live under builtin. Every role falls back to
  # @default, and @default falls back to the provider's requested-tier default,
  # so configuring `default` alone drives every role. Values may be a bare known
  # model (opus), an explicit provider/model (codex/gpt-5.6-sol), a nested
  # provider-local path (opencode/anthropic/claude-sonnet-4-5), or an @<alias>
  # reference. User-invented aliases live under custom and must include a
  # description for completions and the Models panel. Bucket membership is
  # display-only: ACE always supplies `coders`, and custom aliases assigned to
  # it coalesce with the generic and provider-specific coder aliases.
  # model_aliases:
  #   builtin:
  #     default: opus               # model used when a prompt has no %model directive
  #     coder: "@default"           # plan coder follow-ups (fallback for <provider>_coder)
  #     claude_coder: codex/gpt-5.6-sol # coder follow-ups from Claude-authored plans
  #     codex_coder: claude/opus    # coder follow-ups from Codex-authored plans
  #     epic_creator: "@default"    # #bd/new_epic follow-ups
  #     epic_lander: "@default"     # epic land agents
  #     phase_worker: "@default"    # bead phase agents
  #   custom:
  #     blogger:
  #       model: claude/opus
  #       description: "Agents that draft and edit blog posts."
  #       bucket: writing          # optional Models-panel grouping
  #   buckets:
  #     coders:
  #       description: "Coder defaults and provider-specific follow-ups."
  #     writing:
  #       description: "Writing and editing roles."
  retry:
    claude:
      max_retries: 3
      error_patterns:
        - "API Error: 500"
        - "API Error: 529"
        - "Internal server error"
        - "overloaded_error"
      wait_times: [60, 300, 1800]
      fallback_model: "sonnet"
    codex:
      max_retries: 3
      error_patterns:
        - "exceeded retry limit"
        - "429 Too Many Requests"
        - "Too Many Requests"
        - "rate limit"
        - "failed to connect to websocket"
        - "Selected model is at capacity"
      wait_times: [60, 300, 1800]
    # Fakey ships retry defaults in its provider hook. Uncomment to override
    # them for local retry experiments.
    # fakey:
    #   max_retries: 3
    #   error_patterns: ["FAKEY-RETRYABLE"]
    #   wait_times: [0]

commit:
  finalizer:
    enabled: true
    max_passes: 2

vcs_provider:
  provider: "auto"
  use_project_pr_prefix: false
  pr_tags: {}

vcs_repo_completion:
  enabled: true
  cache_ttl_seconds: 600
  max_repos: 200

vcs_ref_completion:
  enabled: true

telemetry:
  enabled: false
  prometheus:
    exposition_port: 9464
    pushgateway_url: "localhost:9091"
  health_thresholds:
    error_rate_warn: 10.0
    error_rate_critical: 25.0
    retry_rate_warn: 10.0
    retry_rate_critical: 25.0
    p95_latency_warn: 300.0
    p95_latency_critical: 600.0

sdd:
  # Controls remote freshness for bead commands in companion repositories.
  # background keeps the command path local and launches a TTL-gated managed
  # fetch/rebase/push worker; blocking restores pull-before-command behavior;
  # off disables command-triggered refreshes (normal post-commit push policy
  # still applies).
  bead_refresh:
    mode: background
    ttl_seconds: 120
  repo:
    # Optional companion SDD repo override for providers that support
    # separate_repo storage. Accepts "name" or "owner/name"; empty uses the
    # provider default (GitHub: <owner>/<repo>--sdd).
    name: ""
  # Controls `git push` after SDD commits in separate_repo storage. Accepts:
  #   true  - push synchronously; failures only warn and the local commit is
  #           preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` (default).
  push_after_commit: async

workspace:
  # Workspace root policy: "xdg-state" (default platform state dir),
  # "adjacent" (legacy opt-in `primary_<num>/` layout), or an absolute path.
  # `SASE_WORKSPACE_ROOT` overrides this when set.
  root: xdg-state
  # Explicit override for project_key namespacing under managed roots.
  # Empty string means derive from git remote or primary path.
  project_key: ""
  # Days before unclaimed managed workspaces are eligible for cleanup.
  cleanup_ttl_days: 14

bead:
  # Controls the post-commit `git push` after `sase bead work` successfully
  # commits the sdd/beads bead-state mutation (canonical events plus
  # compatibility projections). Accepts:
  #   true  - push synchronously (default); failures only warn and the local
  #           commit is preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` so the command returns
  #           without waiting on remote network/credential latency. The push
  #           runs non-interactively; failures are written to a log file whose
  #           path is printed. `sase bead work --no-push` overrides this to skip
  #           the push for a single invocation.
  push_after_commit: true

xprompt_aliases:
  c: commit
  p: propose
xprompts:
  # keep-sorted start

  bd/land_epic:
    tags: land_epic
    input:
      bead_id: word
    content: |
      Can you help me verify that all the work associated with the bead with ID {{ bead_id }} is complete?

      Actually read through the source code and the git commits that are associated with that bead's work (they should have
      the bead ID in the commit message) and ensure all of the work that the previous agents say is complete, is actually
      complete. Also, run `sase bead show` on every child bead and ensure that any notes on those beads have been
      addressed.

      If not, plan out the remaining work using your /sase_plan skill (make sure to include closing the bead as the
      final step of the plan) and complete it. Otherwise, close the bead using the `sase bead close` command. If
      available, run the `just pyvision` command AFTER closing the epic bead (some symbols can be ignored while an epic
      is open) to make sure we didn't leave any unused code behind.

      Finally, find the plan file associated with this work (which should be in the sdd/plans/ directory with
      `tier: epic`, in a YYYYMM
      subdirectory). If found, a `status` field should be added (or updated if it already exists) to the frontmatter of
      the plan file with a value of `done`.
  bd/new_epic:
    tags: create_epic_bead
    input:
      plan_file_path: path
      changespec: { type: word, default: null }
      bug_id: { type: int, default: null }
    content: |
      Can you help me create one bead for every phase in the {{ plan_file_path }} plan file?

      These beads should all be children of a new plan bead that you should also create. The plan bead should be linked to the
      plan file using the `sase bead create` command's `--type plan(<plan_file>)` option and `--tier epic`. Also, add
      the bead ID of the plan to a frontmatter field called `bead_id` and add `tier: epic`.

      {% if bug_id and not changespec %}
      IMPORTANT: This invocation is invalid because `bug_id` was provided without `changespec`. Do not create or update any
      beads; report that `bug_id` requires `changespec`.
      {% endif %}

      {% if changespec %}
      Attach ChangeSpec metadata to the new plan bead by passing `-c/--changespec {{ changespec }}` to
      `sase bead create`. {% if bug_id %}Because `bug_id` is also provided, pass `-b/--bug-id {{ bug_id }}` on that same
      plan-bead creation command.{% else %}Because no `bug_id` is provided, do not pass `-b/--bug-id`.{% endif %}
      {% else %}
      No ChangeSpec metadata was provided, so do not pass `-c/--changespec` or `-b/--bug-id` when creating the plan bead.
      {% endif %}

      If the plan file's frontmatter contains a top-level `model:` field, pass its value via `-m/--model <value>` on the
      epic plan bead's `sase bead create` call so the final land agent runs with that model. If no `model:` field is
      present in the frontmatter, omit `--model` entirely.

      Create the epic plan bead first. Then create the phase beads one at a time, in the exact order they appear in the
      plan file. Do not run phase bead creation commands in parallel: child bead suffixes are allocated by creation order,
      so the first phase bead you create should receive the first child ID suffix, the second phase bead should receive
      the second suffix, and so on.

      For each phase, if the plan file annotates that phase with a `model:` value (matching the simple convention from
      the plan frontmatter — e.g. a `model:` line in the phase's owner/metadata section), pass `-m/--model <value>` on
      that phase bead's `sase bead create` call. If a phase has no `model:` annotation, omit `--model` for that phase.

      Make sure that each phase bead has the appropriate dependencies set up.

      After committing the bead-creation work, run `sase bead work <epic_id> --yes` (using the new plan bead's ID) to
      mark the epic as ready to work and skip the launch confirmation prompt for this automated kickoff.
  bd/next:
    input:
      prompt: { type: text, default: "" }
    content: |
      Can you run the `sase bead ready` command to see which beads are ready to be worked, claim the next ready bead
      by marking it as in-progress, complete the work associated with it, and then close the bead (do NOT close the
      parent epic bead)? Make sure to mark the bead as in-progress before you start working. If there are no non-epic
      beads ready to work, you should terminate without doing anything. {{ prompt }}

      IMPORTANT: Do NOT create any beads of your own. You are meant to work the pre-existing ready bead that you select. If
      you decide to create a plan for this bead, make sure you explicitly mention the bead ID in the plan.
  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the @sdd/plans/*/prompts/{{ file_base }}.md file against the plan in the
      @sdd/plans/*/{{ file_base }}.md file
      and ensure that the following qualities are met?:

        1. ALL requirements in the prompt file have been satisified.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the @sdd/plans/*/prompts/{{ file_base }}.md file and look for gaps / ambiguity
      in the requirements? In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that file?
  bd/work_phase_bead:
    tags: work_phase_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for bead {{ bead_id }}? The bead has already been claimed for you (status=in_progress,
      assignee set). Read its description and design file, do the work, and close the bead. Do NOT close the parent
      epic. Do NOT create new beads.
  epic: |
    This is a large piece of work that should be split into phases. I'll let you decide how many phases to create, but
    keep in mind that each phase will be completed by a distinct agent instance (i.e. a distinct `claude` / `agy` /
    `codex` / `qwen` / `opencode` command). #plan
  if_not_plan: |
    If not, use your /sase_plan skill to plan the appropriate changes.
  plan: |
    Think this through thoroughly and create a plan using your `/sase_plan` skill. Submit your plan with the
    `sase plan propose` command (as the skill instructs) before making any file changes.
  prompt/approve: |
    I've edited the previous agent's reply with my decisions. Can you help me implement this? #plan
  prompt/review:
    input:
      prompt: text
    content: |
      Can you help me review the prompt I've prepared below and look for gaps / ambiguity in the requirements? In
      particular, what design decisions would you need from me if I were to ask you to implement the functionality described
      by that prompt?

      ## THE PROMPT
      {{ prompt }}
  review: |
    Can you help me fix any bugs that were introduced by this implementation? Also, look for any ways you can improve
    the implementation, but make sure any improvements you make are clear wins (not subjective).
  x:
    input: { name: word, cmd: text }
    content: "@$(sase_xcmd {{ name }} {{ cmd }})"
  # keep-sorted end
