axe:
  max_hook_runners: 3
  max_agent_runners: 3
  zombie_timeout_seconds: 7200
  lumberjack_log_max_bytes: 52428800
  lumberjack_log_temp_max_age_seconds: 300
  lumberjack_restart_backoff_max_seconds: 60
  verbose_lumberjack_diagnostics: false
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      description: |-
        Fast lane that advances hook, mentor, and workflow lifecycle state every few seconds

        Runs every five seconds with a 90-second per-chop timeout so completed work is noticed and new work starts
        promptly. Put latency-sensitive Patch lifecycle reconciliation here; slower remote polling, wait
        coordination, and maintenance belong in the other lanes.
      interval: 5
      chop_timeout: "90s"
      chops:
        - name: hook_checks
          script: sase_chop_hook_checks
          description: |-
            Complete finished hooks and start stale ones, with zombie detection

            Scans hook entries on every matching Patch, records completed process results, and starts stale hooks
            when a runner slot is free. Honors max_hook_runners across the tick; stale fix-hook suffixes older than
            zombie_timeout_seconds become ZOMBIE, while terminal Patches may finish hooks but cannot start new ones.
        - name: mentor_checks
          script: sase_chop_mentor_checks
          description: |-
            Start mentor workflows once all hook prerequisites are met

            Reconciles running mentors, stops mentors left behind by older commits, adds matching mentor profiles, and
            launches ready profiles after their hooks finish. Mentor launches share max_agent_runners with other agent
            workflows, and review-ineligible or terminal Patches are skipped.
        - name: workflow_checks
          script: sase_chop_workflow_checks
          description: |-
            Complete finished CRS/fix-hook workflows and start stale ones

            Reads workflow state from every matching Patch, records results for finished CRS and fix-hook agents,
            and launches stale workflows. New workflows share max_agent_runners and the current tick's agent-launch
            budget with mentors, so a full runner pool defers work instead of queueing it.
        - name: pending_checks_poll
          script: sase_chop_pending_checks_poll
          description: |-
            Poll background is_cl_submitted and critique_comments checks for results

            Scans the pending-check directory once per tick, applies completed results to matching Patches, and
            reaps output files orphaned by killed or crashed checks. This chop only consumes background results;
            pr_submitted_checks and comment_checks launch the remote checks.
        - name: comment_zombie_checks
          script: sase_chop_comment_zombie_checks
          description: |-
            Mark comment threads older than zombie_timeout as ZOMBIE

            Examines comment-entry suffix timestamps on matching Patches and writes a ZOMBIE suffix when an entry
            exceeds zombie_timeout_seconds. It performs no remote comment fetch; comment_checks starts those checks and
            pending_checks_poll applies their results.
        - name: suffix_transforms
          script: sase_chop_suffix_transforms
          description: |-
            Strip stale suffixes from older proposals and update mail-readiness markers

            Normalizes matching Patches in place by converting old proposal markers from !: to ~:, removing error
            markers from superseded stitches, and acknowledging attention markers on terminal statuses. It only
            repairs stored suffix state and never launches hooks or agents.
        - name: orphan_cleanup
          script: sase_chop_orphan_cleanup
          description: |-
            Release workspace claims orphaned by reverted PRs with dead PIDs

            Reads all Patches and workspace claims, regardless of the axe query, then releases unpinned claims tied
            to Reverted Patches when their owning PID is absent or dead. Live claims and pinned workspaces are left
            untouched.
        - name: stale_running_cleanup
          script: sase_chop_stale_running_cleanup
          description: |-
            Release workspace claims held by dead processes

            Walks every project, including disabled projects, and releases unpinned workspace claims whose owning
            process has exited. A pinned held claim is preserved while its agent artifacts still exist; this fast-lane
            placement frees ordinary dead claims within seconds.
    waits:
      description: |-
        Resolve agent wait dependencies and keep bead claims and stores in sync

        Runs every ten seconds so waiting agents resume promptly and short-lived bead claims are reconciled quickly.
        Put agent dependency, bead-claim, and bead-store coordination here; Patch lifecycle checks and general
        cleanup belong in their dedicated lanes.
      interval: 10
      chops:
        - name: bead_claim_checks
          script: sase_chop_bead_claim_checks
          description: |-
            Acquire missing bead claims for live pre-launch agents and release claims held by dead ones

            Scans pre-launch agent artifacts, backfills a missing claim for a live waiting agent, and releases a
            claimed bead when its unpromoted owner has died. Reconciled dead records are tombstoned so later ticks avoid
            reopening their stores, while a failed project read is retried safely.
        - name: bead_store_refresh
          script: sase_chop_bead_store_refresh
          run_every: "30s"
          timeout: "2m"
          description: |-
            Integrate the canonical bead store for projects with agents waiting on beads

            Finds projects with a live agent waiting on bead completion and refreshes each canonical store at most
            every 30 seconds. The two-minute timeout is protected by bounded per-project lock waits, a whole-pass work
            budget, and persistent exponential backoff so one contended store cannot stall all waiters.
        - name: epic_launch_flush
          script: sase_chop_epic_launch_flush
          run_every: "30s"
          description: |-
            Flush planner completion notifications orphaned by an unsettled epic launch

            Preserves deferrals while a matching detached epic-launch task is active, flushes unowned deferrals after
            a 90-second grace period with a resume command, and reaps unclaimed settle markers after one hour.
        - name: wait_checks
          script: sase_chop_wait_checks
          description: |-
            Resolve agent wait dependencies and write ready.json when satisfied

            Scans waiting markers across projects and resolves named-agent, artifact, and closed-bead dependencies from
            shared agent metadata and canonical bead state. It writes ready.json only after every dependency is
            satisfied; invalid or already-ready markers are skipped without blocking other agents.
    checks:
      description: |-
        Poll slower PR-submission and workspace-claim checks on a five-minute cadence

        Runs every five minutes for checks that can tolerate delay or may touch remote PR state, reducing needless
        polling while retaining a cleanup backstop. Fast hook progression, minute-level comments, and hourly
        maintenance deliberately live elsewhere.
      interval: 300
      chops:
        - name: bead_task_triage
          script: sase_chop_bead_task_triage
          timeout: "2m"
          description: |-
            Raise one human gate for each ready or snoozed task bead

            Scans enabled projects every five minutes and gives every live task bead exactly one pending gate: a
            TaskTriage gate while it is ready, a BeadSnooze wake gate while it is snoozed. Deterministic gate
            generations in lane state prevent duplicate notifications, a gate of the wrong kind is replaced when its
            bead's status changes, and a snoozed bead's notification is re-snoozed to its wake time if it ever drifts.
            Gates are canceled when their beads leave those states, while answered or missing gates can be regenerated
            safely if work remains. A ready bead with a detached launch still in flight is deferred instead of re-gated.
        - name: pr_submitted_checks
          script: sase_chop_pr_submitted_checks
          description: |-
            Start background is_cl_submitted checks for leaf PRs with a submitted parent

            Applies the axe query, finds eligible leaf Patches with PR URLs, and launches non-blocking submission
            checks whose results are collected by pending_checks_poll. A five-minute sync cache suppresses duplicate
            remote work, except that the first cycle checks eligible leaves immediately.
        - name: stale_running_cleanup
          script: sase_chop_stale_running_cleanup
          description: |-
            Backstop release of workspace claims held by dead processes

            Runs the same all-project dead-process reconciliation as the hooks-lane cleanup, including conservative
            handling of pinned claims with agent artifacts. This five-minute placement still frees stale workspace
            claims if the fast hooks lane is disabled, restarting, or repeatedly failing.
    comments:
      description: |-
        Start background critique-comment checks for mailed PRs every minute

        Runs every minute so reviewer feedback reaches active Patches promptly without polling on every hooks tick.
        Only remote comment-check launches belong here; pending result collection and zombie marking remain in the
        faster hooks lane.
      interval: 60
      chops:
        - name: comment_checks
          script: sase_chop_comment_checks
          description: |-
            Start background critique_comments checks for all mailed PRs

            Applies the axe query and starts non-blocking critique_comments checks for mailed Patches that have an
            available workspace, then records a comment-cycle summary. The lumberjack's one-minute interval is the
            polling throttle; pending_checks_poll later consumes each background result.
    housekeeping:
      description: |-
        Run hourly error digests and managed-temp cleanup

        Runs once an hour because notification batching and bounded scratch reclamation are useful but not
        latency-sensitive. Put durable maintenance that may scan substantial local state here, not lifecycle,
        dependency, or remote polling work.
      interval: 3600
      chops:
        - name: error_digest
          script: sase_chop_error_digest
          description: |-
            Send a notification digest of errors from the last hour

            Reads the AXE error log and the last successful digest timestamp, then notifies only about newer errors
            within the rolling one-hour window. The checkpoint advances to the newest notified timestamp, preventing
            duplicate digests while leaving unsent errors eligible after a notification failure.
        - name: managed_tmp_reap
          script: sase_chop_managed_tmp_reap
          description: |-
            Prune stale scratch under the managed SASE temp root

            Removes old children from known managed-temp buckets using workload-specific age limits, without following
            symlinks or deleting the stable bucket directories. Each pass removes at most 2,000 entries and de-indexes
            deleted agent-artifact directories, so a neglected root converges without blocking interactive commands.

llm_provider:
  # Registered provider to use. One of: claude, codex, qwen, opencode, agy,
  # muse, fakey. Empty auto-detects by plugin-declared priority; `muse`
  # declares no priority and is only ever selected by naming it here, by
  # %model:muse/<model>, or via SASE_MUSE_PATH.
  provider: ""
  # Default reasoning-effort level for agent launches that don't request one
  # via %effort or a %model:<model>@<effort> suffix. Empty means no override.
  # Allowed: none, minimal, low, medium, high, xhigh, max.
  default_effort: ""
  # Model aliases for no-%model launches, delegated work, and reusable prompts.
  # Builtin role overrides live under builtin. @default delegates to @smarter
  # unless configured, normal epic landers fall back to @default, and accepted
  # tale follow-ups use the tale size's @<size>_worker alias. Medium phases use
  # @smart, large phases use @smarter, and threshold-selected epic landers plus
  # extra-large phases use @smartest. `smart`, `smarter`, `cheap`, `cheaper`,
  # and `cheapest` own independent pools by default. Use `A | B` for
  # round-robin or `A || B` for ordered fallback; do not mix the operators.
  # Values may be a bare known model (opus), an explicit
  # provider/model (codex/gpt-5.6-sol or muse/muse-spark-1.2), a nested
  # provider-local path (opencode/anthropic/claude-sonnet-4-5), or an
  # @<alias> reference. An alias
  # reference may carry a trailing @<effort> that overrides its target's effort.
  # User-invented aliases live under custom and must include a description for
  # completions and the Models panel. Bucket membership is display-only: ACE
  # always supplies `worker`, and custom aliases assigned to that bucket
  # coalesce with its builtin aliases.
  # Current shipped defaults and descriptions for every builtin alias below are
  # the single responsibility of
  # src/sase/llm_provider/model_alias_defaults.yml; the target values shown
  # here are grammar examples only, not the shipped defaults.
  # model_aliases:
  #   builtin:
  #     default: "@smarter"        # no-%model launch alias
  #     epic_lander: "@default"     # epic land agents
  #     big_epic_lander: "@smartest" # threshold-selected epic land agents
  #     xsmall_worker: "@cheaper" # extra-small bead phase agents
  #     small_worker: "@cheap"    # small bead phase agents
  #     medium_worker: "@smart"   # medium bead phase agents
  #     large_worker: "@smarter"  # large bead phase agents
  #     xlarge_worker: "@smartest" # extra-large bead phase agents
  #     smart: "claude/sonnet@xhigh | codex/gpt-5.5@xhigh" # pool example
  #     smarter: "claude/opus@xhigh | codex/gpt-5.6-sol@xhigh" # pool example
  #     smartest: "claude/opus@max"                  # example maximum-effort override
  #     cheap: "claude/haiku | codex/gpt-4.1-mini"   # load-balanced pool example
  #     cheaper: "claude/haiku | codex/gpt-4.1-mini" # load-balanced pool example
  #     cheapest: "claude/haiku | codex/gpt-4.1-mini" # explicit-use pool example
  #   custom:
  #     blogger:
  #       model: claude/opus
  #       description: "Agents that draft and edit blog posts."
  #       bucket: writing          # optional Models-panel grouping
  #   buckets:
  #     worker:
  #       description: "Size-specific phase-agent roles."
  #     writing:
  #       description: "Writing and editing roles."
  retry:
    claude:
      max_retries: 3
      error_patterns:
        - "API Error: 500"
        - "API Error: 529"
        - "Internal server error"
        - "overloaded_error"
      wait_times: [60, 300, 1800]
      fallback_model: "sonnet"
    codex:
      max_retries: 3
      error_patterns:
        - "exceeded retry limit"
        - "429 Too Many Requests"
        - "Too Many Requests"
        - "rate limit"
        - "failed to connect to websocket"
        - "Selected model is at capacity"
      wait_times: [60, 300, 1800]
    # Process-version skew is provider-independent. A fresh retry inherits the
    # existing workspace so failures late in a run do not discard agent work.
    sase:
      max_retries: 1
      error_patterns:
        - "uses a format this process does not understand"
      wait_times: [0]
      preserve_workspace: true
      spawn_new_agent: true
    # Fakey ships retry defaults in its provider hook. Uncomment to override
    # them for local retry experiments.
    # fakey:
    #   max_retries: 3
    #   error_patterns: ["FAKEY-RETRYABLE"]
    #   wait_times: [0]

commit:
  finalizer:
    enabled: true
    max_passes: 2
  message:
    # Reject `sase stitch create` messages whose subject line is not a Conventional
    # Commit (`type(scope)!: description`). Merge, revert, and fixup subjects
    # are always exempt.
    require_conventional_subject: true
    # Commit types this project accepts. A configured list replaces the
    # built-in set rather than extending it.
    allowed_types: [build, chore, ci, deps, docs, feat, fix, perf, refactor, revert, style, test]

vcs_provider:
  provider: "auto"
  use_project_pr_prefix: false
  pr_tags: {}

vcs_repo_completion:
  enabled: true
  cache_ttl_seconds: 600
  max_repos: 200

vcs_ref_completion:
  enabled: true

telemetry:
  enabled: true
  flush_interval_seconds: 15
  retention:
    raw_seconds: 172800
    rollup_5m_seconds: 2592000
    rollup_1h_seconds: 31536000
  health_thresholds:
    error_rate_warn: 10.0
    error_rate_critical: 25.0
    retry_rate_warn: 10.0
    retry_rate_critical: 25.0
    p95_latency_warn: 300.0
    p95_latency_critical: 600.0

sdd:
  # Controls remote freshness for bead commands in sidecar repositories.
  # background keeps the command path local and launches a TTL-gated managed
  # fetch/rebase/push worker; blocking restores pull-before-command behavior;
  # off disables command-triggered refreshes (normal post-commit push policy
  # still applies).
  bead_refresh:
    mode: background
    ttl_seconds: 120
  repo:
    # Optional sidecar SDD repo override for providers that support
    # separate_repo storage. Accepts "name" or "owner/name"; empty uses the
    # provider default (GitHub: <owner>/<repo>--sdd).
    name: ""
  # Controls `git push` after SDD commits in separate_repo storage. Accepts:
  #   true  - push synchronously; failures only warn and the local commit is
  #           preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` (default).
  # Runner-owned `%id(..., bead=...)` claim transitions are an exception: they
  # commit locally and synchronously run managed publication so reservations,
  # promotions, and releases are promptly visible regardless of this setting.
  # Failed publication preserves the local transition for periodic retry.
  push_after_commit: async

workspace:
  # Workspace root policy: "xdg-state" (default platform state dir),
  # "adjacent" (legacy opt-in `primary_<num>/` layout), or an absolute path.
  # `SASE_WORKSPACE_ROOT` overrides this when set.
  root: xdg-state
  # Explicit override for project_key namespacing under managed roots.
  # Empty string means derive from git remote or primary path.
  project_key: ""
  # Days before unclaimed managed workspaces are eligible for cleanup.
  cleanup_ttl_days: 14

bead:
  # Epic plans with at least this many authored phases use the implicit
  # @big_epic_lander role unless the plan sets an explicit land model.
  big_epic_phase_threshold: 5
  # Controls the post-commit `git push` after `sase bead work` successfully
  # commits the sdd/beads bead-state mutation (canonical events plus
  # compatibility projections). Accepts:
  #   true  - push synchronously (default); failures only warn and the local
  #           commit is preserved so the user can push manually later.
  #   false - never push; commit locally only.
  #   async - launch a detached background `git push` so the command returns
  #           without waiting on remote network/credential latency. The push
  #           runs non-interactively; failures are written to a log file whose
  #           path is printed. `sase bead work --no-push` overrides this to skip
  #           the push for a single invocation.
  push_after_commit: true

xprompt_aliases:
  c: commit
  p: propose
xprompts:
  # keep-sorted start

  bd/land_epic:
    tags: land_epic
    input:
      bead_id: word
    content: |
      You are the land agent for epic bead {{ bead_id }}: verify the epic is truly complete, integrate it with changes
      that landed since it started, then close it out.

      1. Verify. Run `sase bead show {{ bead_id }}` (children, linked plan file), review the epic bead's own notes, then
         run `sase bead show` on every child and review every child note. Confirm each note was addressed, and read the
         actual source code and the epic's commits (bead IDs appear in commit messages) to confirm the work previous
         agents reported complete really is. While reviewing child beads, collect every `PROPOSED FOLLOW-UP:` note entry.

      2. Integrate. Changes committed since this epic started could not integrate with this epic's feature while it was
         incomplete. Find them (e.g. `git log` since the first commit mentioning {{ bead_id }}, excluding the epic's own
         commits; in a PR workflow also review commits on the base branch) and update anything that should now use what
         this epic added or that duplicates or conflicts with it. This integration is part of the epic's work.

      3. Land. Unresolved issues caused by this epic remain epic work: plan and finish them before closing. For each
         genuinely distinct follow-up that is not caused by the epic, use `/sase_new_task` with details identifying the
         proposing bead; it will corroborate a duplicate, attach a causally related active-epic issue, or create a sized
         task as appropriate. Record every outcome, including why any proposal was declined, in your close note. Close the epic with
         `sase bead close {{ bead_id }} --note "<what you verified in steps 1-2>"`. AFTER closing, run `just symvision`
         if available (epic-symbol whitelist entries for {{ bead_id }} expire at close) and remove the stale entries
         and unused code it reports. Finally, set `status: done` in the frontmatter of the epic's plan file (the PLAN
         path shown by `sase bead show`). If the close is rejected, the named phases were never completed: finish or
         reopen them, or record the outcome deliberately with
         `--force --reason ... --resolution canceled|superseded`. Never force merely to make the command succeed.

      If steps 1-2 uncover remaining work, use your /sase_plan skill to plan it and complete the skill's tier-aware
      validate/revalidate/propose loop. Make step 3 the plan's final phase (close, run symvision, mark the plan file done)
      so the agent that executes the plan finishes the landing. Otherwise do step 3 now.
  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the canonical prompt archive entry for {{ file_base }} against the plan in the
      @sdd/plans/*/{{ file_base }}.md file and ensure that the following qualities are met? Use
      `sase agent prompts show {{ file_base }}` if the prompt is not already in context.

        1. ALL requirements in the prompt file have been satisfied.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the canonical prompt archive entry for {{ file_base }} and look for
      gaps / ambiguity in the requirements? Use `sase agent prompts show {{ file_base }}` if the prompt is not already in
      context. In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that prompt?
  bd/work_phase_bead:
    tags: work_phase_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for bead {{ bead_id }}? The bead is already reserved for you and assigned to your agent
      name: it was set to status=in_progress before you started reading this, either by the `sase bead work` launch
      checkpoint or by the runtime promoting an ad-hoc wait-time claim. Do not set the status by hand. Read its
      description and design file, do the work, and close the bead with
      `sase bead close {{ bead_id }} --note "<what you verified>"`. Closing an assigned phase bead is unaffected by the
      parent-close descendant guard. Do NOT close the parent epic. Do not create beads yourself: record discovered
      follow-up work as a `PROPOSED FOLLOW-UP:` entry via
      `sase bead note {{ bead_id }} 'PROPOSED FOLLOW-UP: <one-line summary — detail>'`; the epic's land agent triages
      these into task beads.
  bd/work_task:
    tags: work_task_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for task bead {{ bead_id }} by running the `sase bead show {{ bead_id }}` command,
      reviewing the command's output, doing the work, and then closing the bead by running the
      `sase bead close {{ bead_id }} --note "<what you verified>"` command?

      If you discover genuinely distinct follow-up work that is outside this task, use `/sase_new_task` with details
      identifying the current bead; it will corroborate a duplicate, attach a causally related active-epic issue, or
      create a sized task as appropriate.
  epic: |
    This is a large piece of work that should be split into phases. I'll let you decide how many phases to create, but
    keep in mind that each phase will be completed by a distinct agent instance (i.e. a distinct `claude` / `agy` /
    `codex` / `qwen` / `opencode` / `muse` command). #plan
  if_not_plan: |
    If not, use your /sase_plan skill to plan the appropriate changes.
  plan: |
    Think this through thoroughly and create a plan using your `/sase_plan` skill. Choose and author the appropriate
    tier, validate and revalidate until it passes, then submit it with `sase plan propose` (as the skill instructs)
    before making any file changes.
  prompt/approve: |
    I've edited the previous agent's reply with my decisions. Can you help me implement this? #plan
  prompt/review:
    input:
      prompt: text
    content: |
      Can you help me review the prompt I've prepared below and look for gaps / ambiguity in the requirements? In
      particular, what design decisions would you need from me if I were to ask you to implement the functionality described
      by that prompt?

      ## THE PROMPT
      {{ prompt }}
  review: |
    Can you help me fix any bugs that were introduced by this implementation? Also, look for any ways you can improve
    the implementation, but make sure any improvements you make are clear wins (not subjective).
  x:
    input: { name: word, cmd: text }
    content: "@$(sase_xcmd {{ name }} {{ cmd }})"
  # keep-sorted end
