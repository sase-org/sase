timezone: "America/New_York"
use_chezmoi: false
precommit_command: ""

ace:
  inactive_seconds: 600
  snippets: {}
  keymaps:
    app:
      # Navigation
      next_changespec: "j"
      prev_changespec: "k"
      scroll_to_top: "g"
      scroll_to_bottom: "G"
      scroll_detail_down: "ctrl+d"
      scroll_detail_up: "ctrl+u"
      scroll_prompt_down: "ctrl+f"
      scroll_prompt_up: "ctrl+b"
      prev_changespec_history: "ctrl+o"
      next_changespec_history: "ctrl+k"
      next_agent_file: "ctrl+n"
      prev_agent_file: "ctrl+p"
      # Tab switching
      next_tab: "tab"
      prev_tab: "shift+tab"
      # CL actions
      quit: "q"
      change_status: "s"
      run_workflow: "r"
      mail: "M"
      show_diff: "d"
      reword: "w"
      add_tag: "W"
      view_files: "v"
      jump_to_entry: "apostrophe"
      jump_to_all_entries: "grave_accent"
      edit_spec: "e"
      rename_cl: "n"
      # Proposals & sync
      accept_proposal: "a"
      rebase: "b"
      start_rewind: "R"
      sync: "Y"
      refresh: "y"
      # Fold / collapse
      hooks_or_collapse: "h"
      hooks_or_collapse_all: "H"
      expand_or_layout: "l"
      expand_all_folds: "L"
      toggle_layout: "p"
      # Marking
      toggle_mark: "m"
      clear_marks: "u"
      bulk_change_status: "S"
      mark_inactive: "i"
      mark_inactive_pinned: "I"
      # Agent / axe
      pin_agent: "P"
      focus_pinned_panel: "o"
      kill_agent: "x"
      toggle_axe: "X"
      stop_axe_and_quit: "Q"
      start_custom_agent: "at"
      start_agent_from_changespec: "space"
      jump_to_agent_changespec: "enter"
      edit_panel: "E"
      # Thinking panel
      toggle_thinking: "right_square_bracket"
      toggle_thinking_reverse: "left_square_bracket"
      # File trim
      reset_file_trim: "minus"
      show_all_file_lines: "equals_sign"
      # Queries
      edit_query: "slash"
      prev_query: "circumflex_accent"
      next_query: "underscore"
      # Display / misc
      toggle_hide_reverted: "full_stop"
      toggle_hide_submitted: "x"
      show_notifications: "N"
      show_help: "question_mark"
      browse_xprompts: "number_sign"
      # Workspace mode prefixes
      checkout: "C"
      start_checkout_mode: "c"
      open_tmux: "T"
      start_tmux_mode: "t"
      # Tree navigation prefixes
      start_ancestor_mode: "<"
      start_child_mode: ">"
      start_sibling_mode: "~"
      # Mode activation prefixes
      start_fold_mode: "z"
      start_leader_mode: "comma"
      start_bang_mode: "exclamation_mark"
      copy_tab_content: "percent_sign"
    modes:
      fold_mode:
        prefix: "z"
        keys:
          cycle_commits: "c"
          cycle_hooks: "h"
          cycle_mentors: "m"
          cycle_timestamps: "t"
          toggle_commits: "C"
          toggle_hooks: "H"
          toggle_mentors: "M"
          toggle_timestamps: "T"
          cycle_all: "z"
          toggle_all: "Z"
      copy_mode:
        prefix: "percent_sign"
        keys:
          changespecs:
            raw: "percent_sign"
            with_snapshot: "exclamation_mark"
            bug: "b"
            cl_number: "c"
            name: "n"
            spec: "p"
            snapshot: "s"
          agents:
            chat: "c"
            file_path: "E"
            prompt: "p"
            snapshot: "s"
          axe:
            visible: "o"
            full: "O"
            snapshot: "s"
      leader_mode:
        prefix: "comma"
        keys:
          run_cmd: "exclamation_mark"
          runners: "r"
          kill_mentors: "M"
          review_mentors: "m"
          agent_home: "h"
          agent_from_cl: "space"
          kill_and_edit: "x"
          retry_edit: "r"
          activity_info: "i"
          clear_comments: "c"
          jump_to_notification: "n"
          task_queue: "t"
          prompt_history: "full_stop"
          prompt_history_cancelled: "greater_than_sign"
      bang_mode:
        prefix: "exclamation_mark"
        keys:
          run_cmd: "exclamation_mark"
          toggle_axe: "x"

axe:
  max_hook_runners: 3
  max_agent_runners: 3
  zombie_timeout_seconds: 7200
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      interval: 1
      chops:
        - name: hook_checks
          description: "Complete finished hooks and start stale ones, with zombie detection"
        - name: mentor_checks
          description: "Start mentor workflows once all hook prerequisites are met"
        - name: workflow_checks
          description: "Complete finished CRS/fix-hook workflows and start stale ones"
        - name: pending_checks_poll
          description: "Poll background is_cl_submitted and critique_comments checks for results"
        - name: comment_zombie_checks
          description: "Mark comment threads older than zombie_timeout as ZOMBIE"
        - name: suffix_transforms
          description: "Strip stale suffixes from older proposals and update mail-readiness markers"
        - name: orphan_cleanup
          description: "Release workspace claims orphaned by reverted CLs with dead PIDs"
    waits:
      interval: 2
      chops:
        - name: wait_checks
          description: "Resolve agent wait dependencies and write ready.json when satisfied"
    checks:
      interval: 300
      chops:
        - name: cl_submitted_checks
          description: "Start background is_cl_submitted checks for leaf CLs with a submitted parent"
        - name: stale_running_cleanup
          description: "Release workspace claims held by dead processes"
    comments:
      interval: 60
      chops:
        - name: comment_checks
          description: "Start background critique_comments checks for all mailed CLs"
    housekeeping:
      interval: 3600
      chops:
        - name: error_digest
          description: "Send a notification digest of errors from the last hour"

llm_provider:
  provider: ""
  retry:
    gemini:
      max_retries: 3
      error_patterns:
        - "An unexpected critical error occurred:"
      wait_times: [60, 300, 1800]
      fallback_model: "gemini-3-flash-preview"
    claude:
      max_retries: 3
      error_patterns:
        - "API Error: 500"
        - "API Error: 529"
        - "Internal server error"
        - "overloaded_error"
      wait_times: [60, 300, 1800]
      fallback_model: "sonnet"

vcs_provider:
  provider: "auto"
  use_project_pr_prefix: false
  pr_tags: {}

telemetry:
  enabled: false
  prometheus:
    exposition_port: 9464
    pushgateway_url: "localhost:9091"

sdd:
  version_controlled: false

xprompt_aliases:
  c: commit
  p: propose
xprompts:
  # keep-sorted start

  bd/land_epic:
    input:
      bead_id: word
    content: |
      Can you help me verify that all the work associated with the bead with ID {{ bead_id }} is complete?

      Actually read through the source code and the git commits that are associated with that bead's work (they should have
      the bead ID in the commit message) and ensure all of the work that the previous agents say is complete, is actually
      complete. Also, run `sase bead show` on every child bead and ensure that any notes on those beads have been
      addressed.

      If not, plan out the remaining work and complete it. Otherwise, close the bead using the `sase bead close` command.
      Finally, run the `just pyvision` command AFTER closing the epic bead (some symbols can be ignored while an epic is open)
      to make sure we didn't leave any unused code behind.

      Finally, find the plan file associated with this work (should be in the plans/ directory, in a YYYYMM subdirectory) and then look for a file of
      the same name in the specs/ directory. If found, a `status` field should be added (or updated if it already exists) to
      the frontmatter of the plan file with a value of `done`.
  bd/new_epic:
    input:
      plan_file_path: path
    content: |
      Can you help me create one bead for every phase in the {{ plan_file_path }} plan file?

      These beads should all be children of a new plan bead that you should also create. The plan bead should be linked to the
      plan file using the `sase bead create` command's `--type plan(<plan_file>)` option. Also, add the bead ID of the plan
      to a new frontmatter field called `bead_id` in the plan file.

      Make sure that each phase bead has the appropriate dependencies set up.
  bd/next:
    input:
      prompt: { type: text, default: "" }
    content: |
      Can you run the `sase bead ready` command to see which beads are ready to be worked, claim the next ready bead
      by marking it as in-progress, complete the work associated with it, and then close the bead (do NOT close the
      parent epic bead)? Make sure to mark the bead as in-progress before you start working. If there are no non-epic
      beads ready to work, you should terminate without doing anything. {{ prompt }}

      IMPORTANT: Do NOT create any beads of your own. You are meant to work the pre-existing ready bead that you select. If
      you decide to create a plan for this bead, make sure you explicitly mention the bead ID in the plan.
  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the @specs/**/{{ file_base }}.md file against the plan in the @plans/**/{{ file_base }}.md
      file and ensure that the following qualities are met?:

        1. ALL requirements in the prompt file have been satisified.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the @specs/**/{{ file_base }}.md file and look for gaps / ambiguity
      in the requirements? In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that file?
  epic: |
    This is a large piece of work that should be split into phases. I'll let you decide how many phases to create, but
    keep in mind that each phase will be completed by a distinct agent instance (i.e. a distinct `claude` / `gemini` /
    `codex` command). #plan
  plan: |
    Think this through thoroughly and create a plan using your `/sase_plan` skill before making any file changes.
  prompt/approve: |
    I've edited the previous agent's reply with my decisions. Can you help me implement this? #plan
  prompt/review:
    input:
      prompt: text
    content: |
      Can you help me review the prompt I've prepared below and look for gaps / ambiguity in the requirements? In
      particular, what design decisions would you need from me if I were to ask you to implement the functionality described
      by that prompt?

      ### THE PROMPT
      {{ prompt }}
  x:
    input: { name: word, cmd: text }
    content: "@$(sase_xcmd {{ name }} {{ cmd }})"
  # keep-sorted end
