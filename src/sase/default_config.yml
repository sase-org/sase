timezone: "America/New_York"
use_chezmoi: false
precommit_command: ""

chat_install:
  command: ""
  sync_workspace: true
  timeout_seconds: 900
  restart_attempts: 3

ace:
  inactive_seconds: 600
  snippets: {}
  keymaps:
    app:
      # Navigation
      next_changespec: "j"
      prev_changespec: "k"
      scroll_to_top: "g"
      scroll_to_bottom: "G"
      scroll_detail_down: "ctrl+d"
      scroll_detail_up: "ctrl+u"
      scroll_prompt_down: "ctrl+f"
      scroll_prompt_up: "ctrl+b"
      prev_changespec_history: "ctrl+o"
      next_changespec_history: "ctrl+k"
      next_agent_file: "ctrl+n"
      prev_agent_file: "ctrl+p"
      # Tab switching
      next_tab: "tab"
      prev_tab: "shift+tab"
      # CL actions
      quit: "q"
      change_status: "s"
      run_workflow: "r"
      mail: "M"
      show_diff: "d"
      reword: "w"
      add_tag: "W"
      view_files: "v"
      jump_to_entry: "apostrophe"
      jump_to_all_entries: "grave_accent"
      edit_spec: "e"
      rename_cl: "n"
      # ChangeSpec edits
      edit_hooks: "f"
      # Proposals & sync
      accept_proposal: "a"
      rebase: "b"
      start_rewind: "R"
      sync: "Y"
      refresh: "y"
      # Fold / collapse
      hooks_or_collapse: "h"
      hooks_or_collapse_all: "H"
      expand_or_layout: "l"
      expand_all_folds: "L"
      toggle_layout: "p"
      # Marking
      toggle_mark: "m"
      clear_marks: "u"
      bulk_change_status: "S"
      mark_inactive_pinned: "I"
      # Agent / axe
      kill_agent: "x"
      open_agent_cleanup_panel: "X"
      stop_axe_and_quit: "Q"
      start_custom_agent: "at"
      start_agent_from_changespec: "space"
      jump_to_agent_changespec: "enter"
      edit_panel: "E"
      show_agent_run_log: "A"
      # Thinking panel
      toggle_thinking: "right_square_bracket"
      toggle_thinking_reverse: "left_square_bracket"
      # Attempt history (agents tab)
      toggle_attempt_view: "V"
      # Agent tag modal (agents tab)
      add_agent_tag: "N"
      # Tag-driven side panels (agents tab)
      focus_next_agent_panel: "J"
      focus_prev_agent_panel: "K"
      # Grouping mode cycle (agents tab)
      cycle_grouping_mode: "o"
      cycle_grouping_mode_reverse: "O"
      # File trim
      reset_file_trim: "minus"
      show_all_file_lines: "equals_sign"
      # Queries
      edit_query: "slash"
      prev_query: "circumflex_accent"
      next_query: "underscore"
      # Display / misc
      toggle_hide_reverted: "full_stop"
      toggle_hide_submitted: "x"
      show_notifications: "i"
      show_help: "question_mark"
      browse_xprompts: "number_sign"
      open_command_palette: "colon,semicolon"
      # Workspace mode prefixes
      checkout: "C"
      start_checkout_mode: "c"
      open_tmux: "T"
      start_tmux_mode: "t"
      # Tree navigation prefixes
      start_ancestor_mode: "<"
      start_child_mode: ">"
      start_sibling_mode: "~"
      # Mode activation prefixes
      start_fold_mode: "z"
      start_leader_mode: "comma"
      start_bang_mode: "exclamation_mark"
      copy_tab_content: "percent_sign"
    modes:
      fold_mode:
        prefix: "z"
        keys:
          cycle_commits: "c"
          cycle_hooks: "h"
          cycle_mentors: "m"
          cycle_timestamps: "t"
          cycle_deltas: "d"
          toggle_commits: "C"
          toggle_hooks: "H"
          toggle_mentors: "M"
          toggle_timestamps: "T"
          toggle_deltas: "D"
          cycle_all: "z"
          toggle_all: "Z"
      copy_mode:
        prefix: "percent_sign"
        keys:
          changespecs:
            raw: "percent_sign"
            with_snapshot: "exclamation_mark"
            bug: "b"
            cl_number: "c"
            name: "n"
            spec: "p"
            snapshot: "s"
          agents:
            chat: "c"
            file_path: "E"
            name: "n"
            prompt: "p"
            snapshot: "s"
          axe:
            visible: "o"
            full: "O"
            snapshot: "s"
      leader_mode:
        prefix: "comma"
        keys:
          run_cmd: "exclamation_mark"
          runners: "r"
          kill_mentors: "M"
          review_mentors: "m"
          agent_home: "h"
          agent_from_cl: "space"
          kill_and_edit: "x"
          mark_inactive: "I"
          retry_edit: "r"
          activity_info: "i"
          clear_comments: "c"
          jump_to_notification: "n"
          task_queue: "t"
          prompt_history: "full_stop"
          prompt_history_cancelled: "greater_than_sign"
          agent_run_log: "A"
          temporary_llm_override: "P"
      bang_mode:
        prefix: "exclamation_mark"
        keys:
          run_cmd: "exclamation_mark"
          toggle_axe: "x"

axe:
  max_hook_runners: 3
  max_agent_runners: 3
  zombie_timeout_seconds: 7200
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      interval: 5
      chop_timeout: "90s"
      chops:
        - name: hook_checks
          description: "Complete finished hooks and start stale ones, with zombie detection"
        - name: mentor_checks
          description: "Start mentor workflows once all hook prerequisites are met"
        - name: workflow_checks
          description: "Complete finished CRS/fix-hook workflows and start stale ones"
        - name: pending_checks_poll
          description: "Poll background is_cl_submitted and critique_comments checks for results"
        - name: comment_zombie_checks
          description: "Mark comment threads older than zombie_timeout as ZOMBIE"
        - name: suffix_transforms
          description: "Strip stale suffixes from older proposals and update mail-readiness markers"
        - name: orphan_cleanup
          description: "Release workspace claims orphaned by reverted CLs with dead PIDs"
    waits:
      interval: 2
      chops:
        - name: wait_checks
          description: "Resolve agent wait dependencies and write ready.json when satisfied"
    checks:
      interval: 300
      chops:
        - name: cl_submitted_checks
          description: "Start background is_cl_submitted checks for leaf CLs with a submitted parent"
        - name: stale_running_cleanup
          description: "Release workspace claims held by dead processes"
    comments:
      interval: 60
      chops:
        - name: comment_checks
          description: "Start background critique_comments checks for all mailed CLs"
    housekeeping:
      interval: 3600
      chops:
        - name: error_digest
          description: "Send a notification digest of errors from the last hour"

llm_provider:
  provider: ""
  retry:
    gemini:
      max_retries: 3
      error_patterns:
        - "An unexpected critical error occurred:"
      wait_times: [60, 300, 1800]
      fallback_model: "gemini-3-flash-preview"
    claude:
      max_retries: 3
      error_patterns:
        - "API Error: 500"
        - "API Error: 529"
        - "Internal server error"
        - "overloaded_error"
      wait_times: [60, 300, 1800]
      fallback_model: "sonnet"

vcs_provider:
  provider: "auto"
  use_project_pr_prefix: false
  pr_tags: {}

telemetry:
  enabled: false
  prometheus:
    exposition_port: 9464
    pushgateway_url: "localhost:9091"
  health_thresholds:
    error_rate_warn: 10.0
    error_rate_critical: 25.0
    retry_rate_warn: 10.0
    retry_rate_critical: 25.0
    p95_latency_warn: 300.0
    p95_latency_critical: 600.0

sdd:
  version_controlled: false

xprompt_aliases:
  c: commit
  p: propose
xprompts:
  # keep-sorted start

  bd/land_epic:
    tags: land_epic
    input:
      bead_id: word
    content: |
      Can you help me verify that all the work associated with the bead with ID {{ bead_id }} is complete?

      Actually read through the source code and the git commits that are associated with that bead's work (they should have
      the bead ID in the commit message) and ensure all of the work that the previous agents say is complete, is actually
      complete. Also, run `sase bead show` on every child bead and ensure that any notes on those beads have been
      addressed.

      If not, plan out the remaining work using your /sase_plan skill and complete it. Otherwise, close the bead using
      the `sase bead close` command. If available, run the `just pyvision` command AFTER closing the epic bead (some
      symbols can be ignored while an epic is open) to make sure we didn't leave any unused code behind.

      Finally, find the plan file associated with this work (which should be in the sdd/epics/ directory, in a YYYYMM
      subdirectory). If found, a `status` field should be added (or updated if it already exists) to the frontmatter of
      the plan file with a value of `done`.
  bd/land_legend:
    tags: land_legend
    input:
      bead_id: word
    content: |
      Can you help me verify that all the work associated with the legend bead with ID {{ bead_id }} is complete? If
      not, plan out the remaining work using your /sase_plan skill and complete it. Otherwise, close the bead using the
      `sase bead close` command.

      Finally, find the plan file associated with this work (which should be in the sdd/legends/ directory, in a YYYYMM
      subdirectory). If found, a `status` field should be added (or updated if it already exists) to the frontmatter of
      the plan file with a value of `done`.
  bd/new_epic:
    tags: create_epic_bead
    input:
      plan_file_path: path
      legend_bead_id: { type: word, default: null }
      changespec: { type: word, default: null }
      bug_id: { type: int, default: null }
    content: |
      Can you help me create one bead for every phase in the {{ plan_file_path }} plan file?

      These beads should all be children of a new plan bead that you should also create. The plan bead should be linked to the
      plan file using the `sase bead create` command's `--type plan(<plan_file>)` option and `--tier epic`. If
      `legend_bead_id` was provided as an xprompt argument, or if the plan file frontmatter contains `legend_bead_id`,
      create a linked epic using `--type plan(<plan_file>,<legend_bead_id>)` instead. Also, add the bead ID of the plan
      to a frontmatter field called `bead_id`, add `tier: epic`, and preserve or add `legend_bead_id` when the epic is
      linked to a legend.

      {% if legend_bead_id %}
      Use `{{ legend_bead_id }}` as the linked legend bead ID.
      {% endif %}

      {% if bug_id and not changespec %}
      IMPORTANT: This invocation is invalid because `bug_id` was provided without `changespec`. Do not create or update any
      beads; report that `bug_id` requires `changespec`.
      {% endif %}

      {% if changespec %}
      Attach ChangeSpec metadata to the new plan bead by passing `-c/--changespec {{ changespec }}` to
      `sase bead create`. {% if bug_id %}Because `bug_id` is also provided, pass `-b/--bug-id {{ bug_id }}` on that same
      plan-bead creation command.{% else %}Because no `bug_id` is provided, do not pass `-b/--bug-id`.{% endif %}
      {% else %}
      No ChangeSpec metadata was provided, so do not pass `-c/--changespec` or `-b/--bug-id` when creating the plan bead.
      {% endif %}

      Create the epic plan bead first. Then create the phase beads one at a time, in the exact order they appear in the
      plan file. Do not run phase bead creation commands in parallel: child bead suffixes are allocated by creation order,
      so the first phase bead you create should receive the first child ID suffix, the second phase bead should receive
      the second suffix, and so on.

      Make sure that each phase bead has the appropriate dependencies set up.

      After committing the bead-creation work, run `sase bead work <epic_id> --yes` (using the new plan bead's ID) to
      mark the epic as ready to work and skip the launch confirmation prompt for this automated kickoff.
  bd/new_legend:
    tags: create_legend_bead
    input:
      plan_file_path: path
    content: |
      Can you help me create a legend bead for the {{ plan_file_path }} plan file?

      First, read the legend plan file and count how many epics it proposes. Use that count as `<epic_count>` for the
      steps below.

      Create exactly one plan bead linked to the plan file using the `sase bead create` command's `--type plan(<plan_file>)`
      option, `--tier legend`, and `--epic-count <epic_count>`. Do not create phase beads or epic beads directly.

      Add the new bead ID to the plan file frontmatter as `legend_bead_id`, add `tier: legend`, and add
      `epic_count: <epic_count>`. Then commit the bead and plan-file metadata.

      After committing the legend bead metadata, run `sase bead work <legend_bead_id> --yes` (using the new legend bead's
      ID) to launch one epic-planning agent for each proposed epic and skip the launch confirmation prompt for this
      automated kickoff.
  bd/next:
    input:
      prompt: { type: text, default: "" }
    content: |
      Can you run the `sase bead ready` command to see which beads are ready to be worked, claim the next ready bead
      by marking it as in-progress, complete the work associated with it, and then close the bead (do NOT close the
      parent epic bead)? Make sure to mark the bead as in-progress before you start working. If there are no non-epic
      beads ready to work, you should terminate without doing anything. {{ prompt }}

      IMPORTANT: Do NOT create any beads of your own. You are meant to work the pre-existing ready bead that you select. If
      you decide to create a plan for this bead, make sure you explicitly mention the bead ID in the plan.
  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the @sdd/prompts/**/{{ file_base }}.md file against the plan in the @sdd/tales/**/{{ file_base }}.md
      file and ensure that the following qualities are met?:

        1. ALL requirements in the prompt file have been satisified.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the @sdd/prompts/**/{{ file_base }}.md file and look for gaps / ambiguity
      in the requirements? In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that file?
  bd/work_phase_bead:
    tags: work_phase_bead
    input:
      bead_id: word
    content: |
      Can you complete the work for bead {{ bead_id }}? The bead has already been claimed for you
      (status=in_progress, assignee set). Read its description and design file, do the work, commit,
      and close the bead. Do NOT close the parent epic. Do NOT create new beads.
  epic: |
    This is a large piece of work that should be split into phases. I'll let you decide how many phases to create, but
    keep in mind that each phase will be completed by a distinct agent instance (i.e. a distinct `claude` / `gemini` /
    `codex` command). #plan
  legend: |
    This is a very large piece of work that should be split into multiple epics. I'll let you decide how many epics to
    create, but keep in mind that each epic will be later split into multiple phases that will each be completed by a
    distinct agent instance (i.e. a distinct `claude` / `gemini` / `codex` command). #plan
  plan: |
    Think this through thoroughly and create a plan using your `/sase_plan` skill before making any file changes.
  prompt/approve: |
    I've edited the previous agent's reply with my decisions. Can you help me implement this? #plan
  prompt/review:
    input:
      prompt: text
    content: |
      Can you help me review the prompt I've prepared below and look for gaps / ambiguity in the requirements? In
      particular, what design decisions would you need from me if I were to ask you to implement the functionality described
      by that prompt?

      ## THE PROMPT
      {{ prompt }}
  research/image: |
    Can you use GPT image to generate an infographic that illustrates the main points made in this research markdown
    file? Write the image to a new file in the same directory.
  research/more: |
    Can you help me improve this research markdown file by doing your own research and filling in any gaps missed by the
    previous agent? Preserve the existing file path unless I explicitly ask for a new file, and follow
    sdd/research/README.md conventions when present.
  research/prompt:
    input:
      prompt: text
    content: |
      Can you help me do some research on the below prompt? Investigate prior art, propose a few alternative solutions,
      and end your analysis with a recommended solution. #research

      ## THE PROMPT
      {{ prompt }}
  research: |
    Store new research in a markdown file under the sdd/research/ directory. Organize research files in YYYYMM month
    subdirectories.
  review: |
    Can you help me fix any bugs that were introduced by this implementation? Also, look for any ways you can improve
    the implementation, but make sure any improvements you make are clear wins (not subjective).
  x:
    input: { name: word, cmd: text }
    content: "@$(sase_xcmd {{ name }} {{ cmd }})"
  # keep-sorted end
