memory:
  h1_title: null
  # Project-local only: define domain terms in a repository's canonical
  # sase/sase.yml. The canonical term is the map key; it is always the first
  # effective alias.
  # glossary:
  #   Agent Clan:
  #     aliases:
  #       - agent clans
  #       - clan
  #     definition: >-
  #       A named, rootless container for agents that run in parallel.
  agents_template: null
  agents_minimal_template: null
  sase_template: null
  readme_template: null
is_sase_managed: false
use_chezmoi: false
commit_hooks:
  before: ""
  after: ""
file_hooks: []
# Project-declared plugin dependencies. A linked checkout is not an install.
# Every non-builtin <plugin>@ prefix in project config must appear here.
plugins:
  required: []
# SASE-managed projects receive <project>--plans and <project>--beads sidecars
# unless project-local configuration disables them. Research sidecars are
# config-declared only.
default_linked_repos: true
# Linked and sidecar repositories are lazy by default. Set auto_clone: true per
# entry when every launched agent needs the repository materialized.
# Sidecars are keyed by role: the reserved plans/beads/agents roles live under
# builtin, and every other document sidecar lives under custom.
repos:
  linked: []
  sidecar:
    builtin: {}
    custom: {}

# Host-wide cap on concurrently occupied runner slots. A running sase
# agent holds one slot while any of its shells is live: a standalone
# agent, a serial family (root, serial child, monitor, or --next
# follow-up), or each live parallel family member. Roots and parallel
# members wait at the gate; serial family members ride the family's
# slot and do not wait. Workflow Python/bash steps and axe runners are
# excluded; axe Patch runners use their separate axe.max_* limits.
max_running_agents: 10

# Maximum number of `sase pipe` hops in one family chain. The original agent
# is depth 0; each successful pipe increments depth by one and is refused
# when the next link would exceed this bound. This is a config field, not a
# feature flag: users choose the number permanently to stop runaway self-piping.
max_agent_pipe_chain: 8

runner_slots:
  # Lower priority numbers start first; the default is 10. Only priorities
  # above the default defer, scaled per step and bounded by the maximum.
  deference_seconds_per_step: 3
  deference_max_seconds: 60

procs:
  # Maximum number of finished procs kept in ~/.sase/procs. Running procs are
  # never pruned.
  history_limit: 100

markdown:
  # Column width SASE wraps generated Markdown prose at: plan files, bead notes
  # and pages, memory shims, generated skills, prompt archives, and the default
  # `--wrap` for `sase bead show` and `sase plan show`. The prettier CLI cannot
  # read this value, so repos whose Markdown SASE writes into need their own
  # prettier config to match.
  print_width: 88

artifacts:
  capture:
    # Maximum byte-copying automatic captures per agent run. Version-control-
    # backed reference rows cost no bytes, are not counted, and are never capped.
    max_stored_per_agent: 50
    # Bounded number of commits searched per file when looking for a durable
    # commit that holds its exact content.
    max_history_scan: 20
    # Files above this size are hashed and recorded but are not copied into the
    # workspace-local prompt-artifact pool.
    max_file_size_bytes: 104857600
    # Opportunistic GC removes already-published terminal-run artifacts after
    # the workspace-local prompt-artifact pool grows beyond this budget.
    pool_max_bytes: 1073741824
  retention:
    # Retention removes nothing until this is true. Explicit artifacts, artifacts
    # referenced by a bead, plan, or Patch, and the newest capture of every
    # label are kept regardless of the settings below.
    enabled: false
    # Automatic captures kept per label; older generations are trashed first.
    # 0 disables the generation predicate.
    keep_per_label: 3
    # Trash automatic captures created more than this many days ago.
    # 0 disables the age predicate.
    max_age_days: 90
    # Days a trashed artifact stays restorable before purging removes it.
    trash_grace_days: 14

update:
  dev_root: "~/projects/github"

chat_install:
  timeout_seconds: 900
  restart_attempts: 3

telegram:
  commands: {}

mobile_gateway:
  bind_address: "127.0.0.1"
  port: 7629
  state_dir: ""
  allow_non_loopback: false
  command: ""
  push_provider: "disabled"
  fcm_project_id: ""
  fcm_service_account_json: ""
  fcm_credential_env: ""
  fcm_dry_run: false
  push_timeout_seconds: 5
  push_retry_limit: 1
  startup_timeout_seconds: 10

ace:
  repro_output_dir: ""
  # Press d on the AXE tab to toggle this state for the current session.
  axe_description_expanded: true
  snippets: {}
  # Config file that receives new ace.snippets entries. Empty string uses the
  # user's sase.yml (chezmoi source when chezmoi is enabled).
  snippet_config_path: ""
  artifacts:
    # Press . on an Artifacts pane to toggle this state for the current session.
    relations_expanded: false
    stitches:
      # Relative date windows re-anchor whenever the pane refreshes. Queries
      # without an explicit positive limit:N are uncapped.
      default_query: "sidecar:false merges:hide since:24h"
  current_project:
    # Show the +<project> chip in the top bar. The current project is derived
    # from the VCS xprompt MRU store; launching an agent is what moves it.
    indicator: true
    # Seed project filters that have no value yet. Never overrides an explicit
    # choice, and never re-scopes a surface that is already open.
    seed_filters: true
    # Also seed the Agents-tab search query. Off by default because that query
    # also drives unread jumps and prospective clans, not just the visible list.
    seed_agents_query: false
  # Per-tribe ACE TUI identity display. Keys are bare tribe names (no "@").
  # The special "default" entry styles the reserved untagged identity.
  # Empty icon strings disable an inherited default icon, while empty color
  # strings restore the gold ACE fallback. Colors apply only to structured
  # tribe identities, not semantic chrome. Manual panel folds last only for
  # the panel's current lifetime; initially_expanded applies whenever the
  # panel appears. Every configured tribe requires a description, shown in
  # the Agents-tab metadata panel when that tribe's panel is selected.
  tribes:
    default:
      icon: "⌂"
      color: "#87D7FF"
      description: "Agents with no assigned tribe. Presentation-only: never written to the tribe store."
    epic:
      icon: "▲"
      color: "#AF87FF"
      description: "Epic phase-worker clans from sase bead work, one member per phase of an approved plan."
    chop:
      icon: "†"
      color: "#FFAF5F"
      initially_expanded: false
      description: "Scheduled AXE chop automation; starts collapsed so routine background work stays quiet."
    pinned:
      icon: "◆"
      description: "Agents promoted by hand to keep them close; the value the tribe modal seeds by default."
    review:
      icon: "◉"
      description: "Mentor, CRS, and hook review runners that AXE groups here, plus reviews you tag yourself."
  # Per-tab notification indicator styling. Keys are notification-panel tab
  # keys: the synthetic "hitl", "errors", "general", "snoozed", and "muted"
  # tabs, a gate-declared panel name such as "beads", or a notification tag.
  # An empty color string restores the built-in default for that tab.
  notification_tabs:
    hitl:
      color: "#FF8700"
      icon: "⚑"
    errors:
      color: "#FF5F5F"
      icon: "✖"
    beads:
      color: "#AF87FF"
      icon: "◈"
    general:
      color: "#FFD700"
      icon: "✉"
    snoozed:
      color: "#6C6C6C"
      icon: "☾"
    muted:
      color: "#5FAFAF"
      icon: "⊘"
  # Maximum per-tab counts rendered in the top-bar indicator before the
  # remainder collapses into a single dim "+N" chip.
  notification_indicator_max_counts: 4
  tool_calls:
    slow_threshold_seconds: 20
  artifact_file_viewer:
    video:
      audio: false
      loop: false
      vo: "kitty"
      extra_mpv_args: []
  updates:
    startup_toast: true
    startup_toast_max_commits: 20
    post_update_toast: true
    post_update_toast_diffstat: true
    post_update_toast_commits: true
    post_update_toast_max_commits: 5
    agent_cli_history: true
    agent_cli_history_max_rows: 8
    indicator: true
    # Prebuild matching Rust dev artifacts in the background when an editable
    # sase-core checkout is behind; confirmed updates fall back to the normal
    # build path on every miss.
    prebuild_rust: true
    check_interval_minutes: 10
    check_ttl_minutes: 10
    recompute_interval_minutes: 60
    incoming_commits:
      enabled: true
      max_per_repo: 7
      confirm_max_per_repo: 250
  agents_sync:
    check_interval_minutes: 10
    recompute_interval_minutes: 30
    indicator: true
  prompt_completion:
    auto: soft
    debounce_ms: 90
    auto_file_paths: false
    auto_xprompt_menu: true
    auto_directive_menu: true
    auto_artifact_menu: true
    max_auto_rows: 1
    history_word_count: 10000
    common_placeholder_count: 100
    word_min_length: 5
    word_ranking: smart
    word_ranking_signals: true
    placeholder_ranking: smart
    placeholder_ranking_signals: true
  prompt_spellcheck:
    highlight: true
    max_remembered_words: 5000
  prompt_inputs:
    collect_raw_placeholders: true
    xprompt_placeholder_args: true
  keymaps:
    # Shared branch-driven plan/custom gate modal bindings.
    gate:
      next_control: "j"
      previous_control: "k"
      toggle_option: "space"
      submit_primary: "enter"
      submit_branch: "ctrl+s"
      open_inputs: "i"
      next_input: "tab"
      previous_input: "shift+tab"
    # Focused Admin Center Statistics-pane bindings. These keys are inactive
    # everywhere else, even when they overlap app-level actions.
    statistics:
      prev_view: "left_square_bracket"
      next_view: "right_square_bracket"
      select_view: "0"
      jump_to_entry: "apostrophe"
      cycle_range: "t"
      cycle_range_reverse: "T"
      custom_range: "c"
      cycle_group: "g"
      cycle_project_filter: "p"
      cycle_project_filter_reverse: "P"
      focus_xprompt: "x"
      clear_xprompt_focus: "X"
      scroll_down: "ctrl+d"
      scroll_up: "ctrl+u"
      refresh: "r"
      help: "question_mark"
    # Focused Glossary-panel bindings. These keys are inactive everywhere
    # else, even when they overlap app-level actions.
    glossary:
      next_term: "j"
      prev_term: "k"
      first_term: "g"
      last_term: "G"
      scroll_definition_down: "ctrl+d"
      scroll_definition_up: "ctrl+u"
      filter_terms: "slash"
      toggle_definition_filter: "full_stop"
      next_relation: "tab"
      prev_relation: "shift+tab"
      follow_relation: "enter,l"
      travel_back: "backspace,h"
      next_project: "p"
      prev_project: "P"
      add_term: "a"
      delete_term: "d"
      open_source: "o"
      open_viewer: "Z"
      copy_definition: "y"
      copy_source_path: "Y"
      refresh: "r"
      help: "question_mark"
    # Focused Memory-panel bindings. These keys are inactive everywhere
    # else, even when they overlap app-level actions.
    memory:
      next_note: "j"
      prev_note: "k"
      first_note: "g"
      last_note: "G"
      scroll_body_down: "ctrl+d"
      scroll_body_up: "ctrl+u"
      filter_notes: "slash"
      toggle_body_filter: "full_stop"
      next_link: "tab"
      prev_link: "shift+tab"
      follow_link: "enter,l"
      travel_back: "backspace,h"
      next_scope: "p"
      prev_scope: "P"
      pick_scope: "ctrl+p"
      add_note: "a"
      edit_note: "e"
      delete_note: "d"
      publish: "I"
      open_source: "o"
      open_viewer: "Z"
      copy_body: "y"
      copy_source_path: "Y"
      refresh: "r"
      help: "question_mark"
    # Focused Admin Center Projects-tab bindings. These keys are inactive
    # everywhere else, even when they overlap app-level actions.
    projects:
      next_option: "j,down,ctrl+n"
      prev_option: "k,up,ctrl+p"
      focus_filter: "slash"
      cycle_subtab: "right_square_bracket"
      cycle_subtab_reverse: "left_square_bracket"
      toggle_project_mark: "m"
      clear_project_marks: "u"
      edit_project_spec: "e"
      edit_project_aliases: "A"
      enable_project: "a"
      disable_project: "d"
      delete_project: "ctrl+d"
      force_current_state_change: "F"
      default_project_action: "enter"
      reload: "R"
      show_project_repos: "r"
      show_project_workspaces: "w"
      jump_to_entry: "apostrophe"
      pick_project: "p"
      clear_project_filter: "escape"
      set_current_project: "c"
    app:
      # Navigation
      next_patch: "j"
      prev_patch: "k"
      scroll_to_top: "g"
      scroll_to_bottom: "G"
      scroll_detail_down: "ctrl+d"
      scroll_detail_up: "ctrl+u"
      scroll_prompt_down: "ctrl+f"
      scroll_prompt_up: "ctrl+b"
      next_agent_metadata_section: "ctrl+j"
      prev_agent_metadata_section: "ctrl+k"
      next_agent_file: "ctrl+n"
      prev_agent_file: "ctrl+p"
      # Tab switching
      next_tab: "tab"
      prev_tab: "shift+tab"
      cycle_artifacts_subtab: "right_square_bracket"
      cycle_artifacts_subtab_reverse: "left_square_bracket"
      # Artifacts split
      cycle_artifacts_split: "right_curly_bracket"
      cycle_artifacts_split_reverse: "left_curly_bracket"
      files_next_version: "right_parenthesis"
      files_prev_version: "left_parenthesis"
      pick_artifacts_project: "p"
      # Stitches sub-tab
      stitches_next: "j"
      stitches_prev: "k"
      stitches_view_selected: "enter"
      stitches_filters: "f"
      stitches_toggle_sdd: "d"
      stitches_cycle_merges: "z"
      stitches_toggle_all_projects: "a"
      stitches_fetch: "F"
      # Plans sub-tab
      plans_next: "j"
      plans_prev: "k"
      plans_view_selected: "enter"
      plans_filters: "f"
      plans_approve: "A"
      plans_reject: "X"
      plans_open_bead: "L"
      # Beads sub-tab
      beads_next: "j"
      beads_prev: "k"
      beads_view_selected: "enter"
      beads_filters: "f"
      beads_expand: "l"
      beads_collapse: "h"
      beads_cycle_status: "s"
      beads_edit: "e"
      beads_add_note: "N"
      beads_create: "n"
