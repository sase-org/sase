      start_custom_agent: "plus"
      start_agent_home: "space"
      start_agent_from_patch: "ctrl+@"
      start_last_vcs_xprompt_in_editor: "ctrl+g"
      restore_prompt_stash: "at"
      jump_to_agent_patch: "enter"
      edit_panel: "E"
      show_agent_run_log: "V"
      open_artifact_files: "a"
      # Thinking panel
      toggle_thinking: "right_square_bracket"
      toggle_thinking_reverse: "left_square_bracket"
      # Attempt history (agents tab)
      toggle_attempt_view: "D"
      # Manual unread marker (agents tab)
      toggle_agent_unread: "U"
      # Agent tribe modal (agents tab)
      edit_agent_tribe: "N"
      # Tribe-driven side panels (agents tab)
      focus_next_agent_panel: "J"
      focus_prev_agent_panel: "K"
      # Grouping mode cycle: o/O on every surface with a grouping mode. The
      # Artifacts open-externally verb (beads_open_bug, files_open_external)
      # shares E. Bang-mode !o still owns mark_pr_origin.
      cycle_grouping_mode: "o"
      cycle_grouping_mode_reverse: "O"
      # Queries
      search_forward: "slash"
      edit_query: "slash"
      search_reverse: "ctrl+r"
      open_saved_query_picker: "asterisk"
      start_saved_query_mode: "0"
      prev_query: "circumflex_accent"
      next_query: "underscore"
      # Display / misc
      show_help: "question_mark"
      # Agents/Axe only; Artifacts uses toggle_relation_panel on the same key.
      toggle_hide_reverted: "full_stop"
      toggle_hide_submitted: "x"
      patches_toggle_reverted: "X"
      show_notifications: "i"
      open_config_center: "number_sign"
      open_command_palette: "colon,semicolon"
      dismiss_toasts: "ctrl+l"
      # Workspace mode prefixes
      checkout: "C"
      start_checkout_mode: "c"
      open_tmux: "T"
      start_tmux_mode: "t"
      # Tree navigation prefixes
      start_ancestor_mode: "<"
      start_child_mode: ">"
      start_sibling_mode: "~"
      # Shares `.` with toggle_hide_reverted; disambiguated by tab availability
      # (the same arrangement `x` already uses for kill_agent/toggle_hide_submitted).
      toggle_relation_panel: "full_stop"
      # Mode activation prefixes
      start_fold_mode: "z"
      zoom_panel: "Z"
      isolate_panels: "="
      collapse_panel_folds: "-"
      start_leader_mode: "comma"
      start_bang_mode: "exclamation_mark"
      copy_tab_content: "percent_sign"
