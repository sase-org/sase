ace:
  inactive_seconds: 600

axe:
  max_hook_runners: 3
  max_agent_runners: 3
  max_agent_retries: 3
  zombie_timeout_seconds: 7200
  query: ""
  chop_script_dirs: []
  lumberjacks:
    hooks:
      interval: 1
      chops:
        - name: hook_checks
          description: "Complete finished hooks and start stale ones, with zombie detection"
        - name: mentor_checks
          description: "Start mentor workflows once all hook prerequisites are met"
        - name: workflow_checks
          description: "Complete finished CRS/fix-hook workflows and start stale ones"
        - name: pending_checks_poll
          description: "Poll background is_cl_submitted and critique_comments checks for results"
        - name: comment_zombie_checks
          description: "Mark comment threads older than zombie_timeout as ZOMBIE"
        - name: suffix_transforms
          description: "Strip stale suffixes from older proposals and update mail-readiness markers"
        - name: orphan_cleanup
          description: "Release workspace claims orphaned by reverted CLs with dead PIDs"
        - name: wait_checks
          description: "Resolve agent wait dependencies and write ready.json when satisfied"
    spec_writer:
      interval: 1
      chops:
        - name: spec_writer
          description: "Process queued project spec file write requests"
    checks:
      interval: 300
      chops:
        - name: cl_submitted_checks
          description: "Start background is_cl_submitted checks for leaf CLs with a submitted parent"
        - name: stale_running_cleanup
          description: "Release workspace claims held by dead processes"
    comments:
      interval: 60
      chops:
        - name: comment_checks
          description: "Start background critique_comments checks for all mailed CLs"
    housekeeping:
      interval: 3600
      chops:
        - name: error_digest
          description: "Send a notification digest of errors from the last hour"

llm_provider:
  provider: ""

vcs_provider:
  provider: "auto"
