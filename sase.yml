precommit_command: "just fix"

sdd:
  version_controlled: true

vcs_provider:
  default_hooks:
    # keep-sorted start
    - "just lint"
    - "just test"
    # keep-sorted end

xprompts:
  # keep-sorted start

  docs: |
    Can you help me review the documentation in the README.md file and in the markdown files contained in the docs/
    directory? Namely:

    - Ensure that all documentation is up to date and accurate.
    - Look for gaps in the documentation. For example, should we add a new section to the README.md file? Should new docs/
      markdown files be created?
    - Review git commits since the last documentation update to identify any important changes worth documenting.

    When you have completed the review, please improve the documentation as needed.
  prompt_research: |
    Can you help me do some research on the below prompt? Investigate prior art, propose a few alternative solutions, and end your analysis with a recommended solution. #sase/research
  remember: |
    Can you update / create the appropriate AGENTS.md file so you never forget about this again?
  research: |
    Store your research in a new markdown file in the research/ directory.
  # keep-sorted end

mentor_profiles:
  - profile_name: gotchas
    mentors:
      - mentor_name: gotchas
        role: "repo-specific gotcha detector that catches commonly forgotten follow-up changes"
        focus_areas:
          # keep-sorted start
          - focus_name: config_schema_sync
            description: >
              When new config fields are added or changed (in default_config.yml, sase.yml, or code), check that
              config/sase.schema.json is updated to match. Missing schema updates break yaml-language-server LSP
              validation in editors. This is the single most common gotcha in this repo.
          - focus_name: cross_repo_impact
            description: >
              When renaming files, changing config structure, or modifying shared interfaces, check whether plugin repos
              (../sase-github, ../sase-google, ../sase-telegram, ../sase-nvim) or chezmoi configs
              (~/.local/share/chezmoi/home/dot_config/sase/) need corresponding updates. Also check importlib.resources
              paths, error messages, docstrings, and docs/ for stale references.
          - focus_name: keymap_config_sync
            description: >
              When keymaps or leader mode keys are changed in code (e.g. in src/sase/ace/tui/keymaps/), check that
              src/sase/default_config.yml is updated to reflect the new defaults. Hardcoded defaults in code and the
              config file must stay in sync.
          - focus_name: nvim_syntax_sync
            description: >
              When ChangeSpec display format, status names, tag names, or other TUI-visible tokens change, check whether
              ../sase-nvim syntax highlighting files need a corresponding update.
          - focus_name: workflow_schema_sync
            description: >
              When xprompt workflow step types or their fields are added or changed, check that
              src/sase/xprompts/workflow.schema.json is updated accordingly.
          # keep-sorted end
    file_globs:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"

  - profile_name: complete
    mentors:
      - mentor_name: complete
        role: "completeness and correctness reviewer who ensures code changes are fully implemented and free of bugs"
        focus_areas:
          # keep-sorted start
          - focus_name: bugs
            description: >
              Check for logic errors, off-by-one mistakes, incorrect assumptions, race conditions, null/None handling
              issues, and other bugs that would cause incorrect behavior at runtime. Focus on defects that are realistic
              given the code change—don't flag speculative issues that require exotic conditions to trigger.
          - focus_name: functional_completeness
            description: >
              Check that the code change fully implements the intended behavior—no partial implementations, missing
              branches, TODO stubs, or incomplete handling of stated requirements. Compare the change against its stated
              goal (PR description, commit message, or surrounding context) and flag anything left unfinished.
          # keep-sorted end
    file_globs:
      - "src/**/*.py"
