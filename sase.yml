sdd:
  version_controlled: true

vcs_provider:
  default_hooks:
    - "just lint"
    - "just pyvision"
    - "just test"

xprompts:
  bd/review/prompt:
    input:
      file_base: word
    content: |
      Can you help me review the prompt I've prepared in the @prompts/{{ file_base }}.md file and look for gaps / ambiguity
      in the requirements? In particular, what design decisions would you need from me if I were to ask you to implement the
      functionality described in that file?

  bd/review/plan:
    input:
      file_base: word
    content: |
      Can you review the requirements in the @prompts/{{ file_base }}.md file against the plan in the @plans/{{ file_base }}.md
      file and ensure that the following qualities are met?:

        1. ALL requirements in the prompt file have been satisified.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.

  docs: |
    Can you help me review the documentation in the README.md file and in the markdown files contained in the docs/
    directory? Namely:

    - Ensure that all documentation is up to date and accurate.
    - Look for gaps in the documentation. For example, should we add a new section to the README.md file? Should new docs/
      markdown files be created?
    - Review git commits since the last documentation update to identify any important changes worth documenting.

    When you have completed the review, please improve the documentation as needed.
