xprompts:
  bd/next:
    input:
      prompt: { type: text, default: "" }
    content: |
      Can you run the `tools/sase_bd ready` command to see which beads are ready to be worked, claim the next ready bead by
      marking it as in-progress, complete the work associated with it, and then close the bead (do NOT close the parent epic
      bead)? Make sure to mark the bead as in-progress before you start planning. {{ prompt }}

      IMPORTANT: Do NOT create any beads of your own. You are meant to work the pre-existing ready bead that you select. If
      you decide to create a plan for this bead, make sure you explicitly mention the bead ID in the plan.

  bd/new_epic:
    input:
      plan_file_path: path
    content: |
      Can you help me create one bead for every phase in the {{ plan_file_path }} plan file?

      These beads should all be children of a new epic bead (make sure this bead has a type of "epic" and not, for example,
      "feature") that you should also create. The epic bead should be linked to the plan file using the `tools/sase_bd create`
      command's `--design` option. Also, add the bead ID of the epic to a new frontmatter field called `bead_id` in the plan
      file.

      Make sure that each phase bead has the appropriate dependencies set up.

  bd/land_epic:
    input:
      bead_id: word
    content: |
      Can you help me verify that all the work associated with the bead with ID {{ bead_id }} is complete?

      Actually read through the source code and the git commits that are associated with that bead's work (they should have
      the bead ID in the commit message) and ensure all of the work that the previous agents say is complete, is actually
      complete. Also, run `tools/sase_bd show` on every child bead and ensure that any notes on those beads have been
      addressed.

      If not, plan out the remaining work and complete it. Otherwise, close the bead using the `tools/sase_bd close` command.
      Finally, run the `just pyvision` command AFTER closing the epic bead (some symbols can be ignored while an epic is open)
      to make sure we didn't leave any unused code behind.

      Finally, find the plan file associated with this work (should be in the plans/ directory) and then look for a file of
      the same name in the prompts/ directory. If found, a `status` field should be added (or updated if it already exists) to
      the frontmatter of the plan file with a value of `done`.

  bd/review:
    input:
      file_base: word
    content: |
      Can you review the requirements in the @prompts/{{ file_base }}.md file against the plan in the @plans/{{ file_base }}.md
      file and ensure that the following qualities are met?:

        1. ALL requirements in the prompt file have been satisified.
        2. Each phase of the plan is sufficiently detailed.
        3. ALL necessary design decisions have been made and documented in the plan.

      If there are any deficiencies in the current plan, you should update the plan file to properly address them.

  docs:
    content: |
      Can you help me review the documentation in the README.md file and in the markdown files contained in the docs/
      directory? Namely:

      - Ensure that all documentation is up to date and accurate.
      - Look for gaps in the documentation. For example, should we add a new section to the README.md file? Should new docs/
        markdown files be created?
      - Review git commits since the last documentation update to identify any important changes worth documenting.

      When you have completed the review, please improve the documentation as needed.
