[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sase"
version = "0.2.0"
description = "Structured Agentic Software Engineering"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Bryan Bugyi" }]
maintainers = [{ name = "Bryan Bugyi" }]
keywords = [
    "agentic software engineering",
    "automation",
    "coding agents",
    "developer tools",
    "workflow orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = [
    "jinja2",
    "jsonschema",
    "langchain-core",
    "pillow",
    "pluggy",
    "prometheus_client",
    "pyinstrument",
    "pyyaml",
    "plotext",
    "rich",
    "sase-core-rs>=0.1.1,<0.2.0",
    "schedule",
    "textual[syntax]>=0.45.0",
]

[project.urls]
Homepage = "https://sase.sh/"
Documentation = "https://sase.sh/"
Repository = "https://github.com/sase-org/sase"
Issues = "https://github.com/sase-org/sase/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "hypothesis",
    "inline-snapshot",
    "tox",
    "build",
    "twine",
]
visual = [
    "cairosvg>=2.7,<3",
]
terminal-smoke = [
    "pexpect>=4.9,<5",
    "pyte>=0.8,<1",
]
docs = [
    "mkdocs-material>=9.7,<10",
    "mkdocs-rss-plugin>=1.18,<2",
]
docs-pdf = [
    "mkdocs-material>=9.7,<10",
    "mkdocs-rss-plugin>=1.18,<2",
    "mkdocs-exporter>=6.2,<7",
    "pypdf>=5,<7",
]

[project.scripts]
sase = "sase.main.entry:main"
sase_bug = "sase.scripts:sase_bug"
sase_git_commit = "sase.scripts:sase_git_commit"
sase_git_fix = "sase.scripts:sase_git_fix"
sase_json_workflow = "sase.scripts:sase_json_workflow"
sase_migrate_statuses = "sase.scripts:sase_migrate_statuses"
sase_chop_hook_checks = "sase.scripts:sase_chop_hook_checks"
sase_chop_mentor_checks = "sase.scripts:sase_chop_mentor_checks"
sase_chop_workflow_checks = "sase.scripts:sase_chop_workflow_checks"
sase_chop_pending_checks_poll = "sase.scripts:sase_chop_pending_checks_poll"
sase_chop_comment_zombie_checks = "sase.scripts:sase_chop_comment_zombie_checks"
sase_chop_suffix_transforms = "sase.scripts:sase_chop_suffix_transforms"
sase_chop_orphan_cleanup = "sase.scripts:sase_chop_orphan_cleanup"
sase_chop_stale_running_cleanup = "sase.scripts:sase_chop_stale_running_cleanup"
sase_chop_pushgateway_cleanup = "sase.scripts:sase_chop_pushgateway_cleanup"
sase_chop_wait_checks = "sase.scripts:sase_chop_wait_checks"
sase_chop_cl_submitted_checks = "sase.scripts:sase_chop_cl_submitted_checks"
sase_chop_comment_checks = "sase.scripts:sase_chop_comment_checks"
sase_chop_error_digest = "sase.scripts:sase_chop_error_digest"
sase_chop_memory_episodes = "sase.scripts:sase_chop_memory_episodes"
sase_xcmd = "sase.scripts:sase_xcmd"
agent_chat_from_name = "sase.scripts:agent_chat_from_name"

[project.entry-points."sase_llm"]
claude = "sase.llm_provider.claude:ClaudeCodeProvider"
codex = "sase.llm_provider.codex:CodexProvider"
gemini = "sase.llm_provider.gemini:GeminiProvider"
opencode = "sase.llm_provider.opencode:OpenCodeProvider"
qwen = "sase.llm_provider.qwen:QwenProvider"

[project.entry-points."sase_vcs"]
bare_git = "sase.vcs_provider.plugins.bare_git:BareGitPlugin"

[project.entry-points."sase_workspace"]
bare_git = "sase.workspace_provider.plugins.bare_git_workspace:BareGitWorkspacePlugin"
cd = "sase.workspace_provider.plugins.cd_workspace:CdWorkspacePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/sase"]

# Without an explicit sdist file list, hatchling packs the whole repo
# (including ~161 MB of sdd/research PNGs), which exceeds PyPI's 100 MB
# per-file upload limit.
[tool.hatch.build.targets.sdist]
only-include = ["src/sase"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "F401",  # imported but unused
    "F821",  # undefined name
    "B007",  # unused loop control variable
]

# --- Mypy ---
[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
ignore_missing_imports = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "schedule.*",
    "rapidfuzz.*",
    "textual",
    "textual.*",
    "sase.ace.tui.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sase.llm_provider._hookspec",
    "sase.vcs_provider._hookspec",
    "sase.workspace_provider._hookspec",
]
disable_error_code = ["empty-body"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--durations=20",
    "-m",
    "not slow and not visual",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "terminal_smoke: marks optional real-terminal TUI smoke tests",
    "visual: marks visual regression tests",
    "real_clipboard: test exercises the real clipboard command resolution (opts out of the clipboard guard)",
]

# --- Coverage ---
[tool.coverage.run]
source_pkgs = ["sase"]
branch = true
parallel = true
omit = [
    "*/test/*",
    "*/tests/*",
    "**/test_*.py",
    "**/conftest.py",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "raise AssertionError",
    "def __repr__",
]
