[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sase"
version = "0.1.0"
description = "Structured Agentic Software Engineering"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jinja2",
    "jsonschema",
    "langchain-core",
    "pluggy",
    "prometheus_client",
    "pyyaml",
    "rich",
    "schedule",
    "textual[syntax]>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "hypothesis",
    "inline-snapshot",
    "tox",
    "build",
    "twine",
]

[project.scripts]
sase = "sase.main.entry:main"
sase_bug = "sase.scripts:sase_bug"
sase_git_commit = "sase.scripts:sase_git_commit"
sase_commit_stop_hook = "sase.scripts:sase_commit_stop_hook"
sase_git_fix = "sase.scripts:sase_git_fix"
sase_json_workflow = "sase.scripts:sase_json_workflow"
sase_migrate_statuses = "sase.scripts:sase_migrate_statuses"
sase_chop_hook_checks = "sase.scripts:sase_chop_hook_checks"
sase_chop_mentor_checks = "sase.scripts:sase_chop_mentor_checks"
sase_chop_workflow_checks = "sase.scripts:sase_chop_workflow_checks"
sase_chop_pending_checks_poll = "sase.scripts:sase_chop_pending_checks_poll"
sase_chop_comment_zombie_checks = "sase.scripts:sase_chop_comment_zombie_checks"
sase_chop_suffix_transforms = "sase.scripts:sase_chop_suffix_transforms"
sase_chop_orphan_cleanup = "sase.scripts:sase_chop_orphan_cleanup"
sase_chop_stale_running_cleanup = "sase.scripts:sase_chop_stale_running_cleanup"
sase_chop_wait_checks = "sase.scripts:sase_chop_wait_checks"
sase_chop_cl_submitted_checks = "sase.scripts:sase_chop_cl_submitted_checks"
sase_chop_comment_checks = "sase.scripts:sase_chop_comment_checks"
sase_chop_error_digest = "sase.scripts:sase_chop_error_digest"
sase_xcmd = "sase.scripts:sase_xcmd"

[project.entry-points."sase_vcs"]
bare_git = "sase.vcs_provider.plugins.bare_git:BareGitPlugin"

[project.entry-points."sase_workspace"]
bare_git = "sase.workspace_provider.plugins.bare_git_workspace:BareGitWorkspacePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/sase"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "F401",  # imported but unused
    "F821",  # undefined name
    "B007",  # unused loop control variable
]

# --- Mypy ---
[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
ignore_missing_imports = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "schedule.*",
    "rapidfuzz.*",
    "textual",
    "textual.*",
    "sase.ace.tui.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sase.vcs_provider._hookspec", "sase.workspace_provider._hookspec"]
disable_error_code = ["empty-body"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=src/sase",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=45",
    "-v",
]
asyncio_mode = "auto"

# --- Coverage ---
[tool.coverage.run]
source_pkgs = ["sase"]
branch = true
parallel = true
omit = [
    "*/test/*",
    "*/tests/*",
    "**/test_*.py",
    "**/conftest.py",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "raise AssertionError",
    "def __repr__",
]
