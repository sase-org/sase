[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sase"
version = "0.1.0"
description = "Structured Agentic Software Engineering"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jinja2",
    "jsonschema",
    "langgraph",
    "langchain-core",
    "pyyaml",
    "rich",
    "schedule",
    "textual>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "tox",
    "build",
    "twine",
]

[project.scripts]
sase = "sase.main.entry:main"
tmux_sase = "sase.scripts.tmux_sase:main"
sase_hg_amend = "sase.scripts:sase_hg_amend"
sase_hg_archive = "sase.scripts:sase_hg_archive"
sase_hg_branch_bug = "sase.scripts:sase_hg_branch_bug"
sase_hg_clean = "sase.scripts:sase_hg_clean"
sase_hg_get_workspace = "sase.scripts:sase_hg_get_workspace"
sase_hg_lint = "sase.scripts:sase_hg_lint"
sase_hg_patch = "sase.scripts:sase_hg_patch"
sase_hg_presubmit = "sase.scripts:sase_hg_presubmit"
sase_hg_prune = "sase.scripts:sase_hg_prune"
sase_hg_rebase = "sase.scripts:sase_hg_rebase"
sase_hg_rename = "sase.scripts:sase_hg_rename"
sase_hg_reword = "sase.scripts:sase_hg_reword"
sase_hg_sync = "sase.scripts:sase_hg_sync"
sase_hg_unamend = "sase.scripts:sase_hg_unamend"
sase_hg_update = "sase.scripts:sase_hg_update"
sase_hg_upload = "sase.scripts:sase_hg_upload"
sase_cl_workflow = "sase.scripts:sase_cl_workflow"
sase_commit_workflow = "sase.scripts:sase_commit_workflow"
sase_propose_workflow = "sase.scripts:sase_propose_workflow"
sase_json_workflow = "sase.scripts:sase_json_workflow"
sase_split_setup = "sase.scripts:sase_split_setup"
sase_split_prepare_execute = "sase.scripts:sase_split_prepare_execute"
sase_hg_rewind = "sase.scripts:sase_hg_rewind"
sase_metahook_scuba = "sase.scripts:sase_metahook_scuba"
sase_metahook_hg_presubmit_tap = "sase.scripts:sase_metahook_hg_presubmit_tap"
sase_migrate_statuses = "sase.scripts:sase_migrate_statuses"

[tool.hatch.build.targets.wheel]
packages = ["src/sase"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "F401",  # imported but unused
    "F821",  # undefined name
    "B007",  # unused loop control variable
]

# --- Mypy ---
[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
ignore_missing_imports = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "schedule.*",
    "rapidfuzz.*",
    "textual",
    "textual.*",
    "sase.ace.tui.*",
]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=sase",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "--cov-fail-under=48",
    "-v",
]
asyncio_mode = "auto"

# --- Coverage ---
[tool.coverage.run]
source_pkgs = ["sase"]
branch = true
omit = [
    "*/test/*",
    "*/tests/*",
    "**/test_*.py",
    "**/conftest.py",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "raise AssertionError",
    "def __repr__",
]
