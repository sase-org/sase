[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "sase"
version = "0.11.1"
description = "Structured Agentic Software Engineering"
dynamic = ["readme"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bryan Bugyi" }]
maintainers = [{ name = "Bryan Bugyi" }]
keywords = [
    "agentic software engineering",
    "automation",
    "coding agents",
    "developer tools",
    "workflow orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = [
    "jinja2",
    "jsonschema",
    "packaging",
    "pillow",
    "pluggy",
    "pyinstrument",
    "pyyaml",
    "rich",
    "ruamel.yaml>=0.18,<1.0",
    "sase-core-rs>=0.11.2,<0.12.0",
    "schedule",
    "textual[syntax]>=0.45.0",
]

[project.urls]
Homepage = "https://sase.sh/"
Documentation = "https://sase.sh/"
Repository = "https://github.com/sase-org/sase"
Issues = "https://github.com/sase-org/sase/issues"

[project.optional-dependencies]
dev = [
    "symvision>=0.1.0,<0.2.0",
    "toobig>=0.1.0,<0.2.0",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "hypothesis",
    "inline-snapshot",
    "tox",
    "build",
    "twine",
]
visual = [
    # Exact pins: the SVG generator, rasterizer, and PNG comparison stack define
    # the golden corpus. A bump is an intentional regenerate-and-review event.
    "linkify-it-py==2.1.0",
    "markdown-it-py==4.0.0",
    "mdit-py-plugins==0.5.0",
    "pillow==12.2.0",
    "pygments==2.19.2",
    "resvg_py==0.3.3",
    "rich==14.3.3",
    "textual==8.0.1",
    "tree-sitter==0.25.2",
    "tree-sitter-bash==0.25.1",
    "tree-sitter-css==0.25.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-html==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-json==0.24.8",
    "tree-sitter-markdown==0.5.1",
    "tree-sitter-python==0.25.0",
    "tree-sitter-regex==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-sql==0.3.11",
    "tree-sitter-toml==0.7.0",
    "tree-sitter-xml==0.7.0",
    "tree-sitter-yaml==0.7.2",
]
terminal-smoke = [
    "pexpect>=4.9,<5",
    "pyte>=0.8,<1",
]
docs = [
    "mkdocs-material>=9.7,<10",
    "mkdocs-rss-plugin>=1.18,<2",
]
docs-pdf = [
    "mkdocs-material>=9.7,<10",
    "mkdocs-rss-plugin>=1.18,<2",
    "mkdocs-exporter>=6.2,<7",
    "pypdf>=5,<7",
]

[project.scripts]
agent_chat_from_name = "sase.scripts:agent_chat_from_name"
fakey = "sase.fakey.cli:main"
sase = "sase.main.entry:main"
sase_bug = "sase.scripts:sase_bug"
sase_chop_bead_claim_checks = "sase.scripts.sase_chop_bead_claim_checks:main"
sase_chop_bead_store_refresh = "sase.scripts.sase_chop_bead_store_refresh:main"
sase_chop_comment_checks = "sase.scripts.sase_chop_comment_checks:main"
sase_chop_comment_zombie_checks = "sase.scripts.sase_chop_comment_zombie_checks:main"
sase_chop_epic_launch_flush = "sase.scripts.sase_chop_epic_launch_flush:main"
sase_chop_error_digest = "sase.scripts.sase_chop_error_digest:main"
sase_chop_hook_checks = "sase.scripts.sase_chop_hook_checks:main"
sase_chop_managed_tmp_reap = "sase.scripts.sase_chop_managed_tmp_reap:main"
sase_chop_mentor_checks = "sase.scripts.sase_chop_mentor_checks:main"
sase_chop_orphan_cleanup = "sase.scripts.sase_chop_orphan_cleanup:main"
sase_chop_pending_checks_poll = "sase.scripts.sase_chop_pending_checks_poll:main"
sase_chop_pr_submitted_checks = "sase.scripts.sase_chop_pr_submitted_checks:main"
sase_chop_refresh_docs = "sase.scripts.sase_chop_refresh_docs:main"
sase_chop_stale_running_cleanup = "sase.scripts.sase_chop_stale_running_cleanup:main"
sase_chop_suffix_transforms = "sase.scripts.sase_chop_suffix_transforms:main"
sase_chop_wait_checks = "sase.scripts.sase_chop_wait_checks:main"
sase_chop_workflow_checks = "sase.scripts.sase_chop_workflow_checks:main"
sase_clan_summary_epic = "sase.scripts.sase_clan_summary_epic:main"
sase_clan_summary_plan = "sase.scripts.sase_clan_summary_plan:main"
sase_git_commit = "sase.scripts:sase_git_commit"
sase_git_fix = "sase.scripts:sase_git_fix"
sase_json_workflow = "sase.scripts:sase_json_workflow"
sase_migrate_statuses = "sase.scripts:sase_migrate_statuses"
sase_xcmd = "sase.scripts:sase_xcmd"

[project.entry-points."sase_llm"]
agy = "sase.llm_provider.agy:AgyProvider"
claude = "sase.llm_provider.claude:ClaudeCodeProvider"
codex = "sase.llm_provider.codex:CodexProvider"
fakey = "sase.llm_provider.fakey:FakeyProvider"
opencode = "sase.llm_provider.opencode:OpenCodeProvider"
qwen = "sase.llm_provider.qwen:QwenProvider"

[project.entry-points."sase_vcs"]
bare_git = "sase.vcs_provider.plugins.bare_git:BareGitPlugin"

[project.entry-points."sase_workspace"]
bare_git = "sase.workspace_provider.plugins.bare_git_workspace:BareGitWorkspacePlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/sase"]

# Without an explicit sdist file list, hatchling packs the whole repo
# (including ~161 MB of sdd/research PNGs), which exceeds PyPI's 100 MB
# per-file upload limit.
[tool.hatch.build.targets.sdist]
only-include = ["src/sase"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI does not provide GitHub's controls for animated images, so use a still
# for the one GIF that remains animated in the GitHub README.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'docs/images/blog/sase_ace_multi_model_fanout\.gif'
replacement = 'docs/images/blog/sase_ace_multi_model_fanout_still.png'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="((?:docs|demos)/[^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/sase-org/sase/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(demos/[^"]+)"'
replacement = 'href="https://github.com/sase-org/sase/blob/master/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((INSTALL\.md|LICENSE|CONTRIBUTING\.md|docs/acknowledgements\.md)\)'
replacement = '](https://github.com/sase-org/sase/blob/master/\1)'

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "F401",  # imported but unused
    "F821",  # undefined name
    "B007",  # unused loop control variable
]

# --- Mypy ---
[tool.mypy]
files = ["src"]
mypy_path = ["src"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
ignore_missing_imports = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "schedule.*",
    "rapidfuzz.*",
    "ruamel.*",
    "textual",
    "textual.*",
    "sase.ace.tui.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sase.llm_provider._hookspec",
    "sase.vcs_provider._hookspec",
    "sase.workspace_provider._hookspec",
]
disable_error_code = ["empty-body"]

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--durations=20",
    "-m",
    "not slow and not visual",
]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "1"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "terminal_smoke: marks optional real-terminal TUI smoke tests",
    "visual: marks visual regression tests",
    "plan_chain_golden: marks plan/questions lifecycle golden-equivalence tests",
    "real_clipboard: test exercises the real clipboard command resolution (opts out of the clipboard guard)",
]

# --- Coverage ---
[tool.coverage.run]
source_pkgs = ["sase"]
branch = true
parallel = true
omit = [
    "*/test/*",
    "*/tests/*",
    "**/test_*.py",
    "**/conftest.py",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "@abstractmethod",
    "raise NotImplementedError",
    "raise AssertionError",
    "def __repr__",
]
