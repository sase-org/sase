commit_hooks:
  before: "just fix"
is_sase_managed: true
memory:
  h1_title: "Structured Agentic Software Engineering (SASE) - Agent Instructions"

vcs_provider:
  default_hooks:
    # keep-sorted start
    - "just lint"
    - "just test"
    # keep-sorted end

repos:
  linked:
    - name: sase-core
      path: ../sase-core
      description: Shared Rust core backend for SASE domain behavior and cross-frontend APIs.
      auto_clone: true
    - name: sase-github
      path: ../sase-github
      description: GitHub VCS and workspace provider plugin for repository, issue, and PR workflows.
    - name: sase-telegram
      path: ../sase-telegram
      description: Telegram integration plugin for chat-driven SASE workflows and notifications.
    - name: sase-nvim
      path: ../sase-nvim
      description: Neovim integration plugin for SASE syntax, completion, and editor support.
    # No auto_clone: unlike sase-core, nothing here builds a native extension
    # from this checkout, and tools/setup_required_plugins already installs
    # the published PyPI distribution (sase-research-artifacts>=0.2.0) without
    # needing a persistent local checkout. Auto-cloning would only add clone
    # overhead to every ephemeral workspace for the rare agent that needs to
    # develop against this plugin's own source.
    - name: sase-research-artifacts
      path: ../sase-research-artifacts
      description: >-
        Installable artifact-reference plugin that provides the `@research` document
        provider, `research-highlights` file-hook template, and `#research*` xprompts.
  sidecar:
    builtin:
      plans:
        auto_clone: true
        ref:
          use: builtin@plan
      beads:
        auto_clone: true
      agents:
        description: Hidden sidecar that stores commit-associated sase agent data for this project.
    custom:
      research:
        description: >-
          Durable SASE research reports and generated media used by research workflows.
        ref:
          use: sase-research-artifacts@research

plugins:
  required:
    - sase-github>=0.2.5
    - sase-research-artifacts>=0.2.0

bead:
  task_types:
    - schema_version: 1
      task_type: flag
      label: Feature flag
      summary: >-
        A SASE feature flag's removal bead: the dossier for one temporary boolean route.
      when_to_use: >-
        Agents never create this type with `sase bead create` or `/sase_new_task`. Run
        `sase flag new <key>`, which creates this bead, validates its fields, and prints
        the registry entry to paste. One bead per registered flag; close it only in the
        change that deletes the flag's disabled branch and its registry entry.
      glyph: "⚑"
      accent_color: "#FF875F"
      agent_creatable: false
      fields:
        - name: key
          label: Key
          type: string
          required: true
          role: [data, template]
          help: The snake_case registry key, e.g. prettier_enabled
          pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$"
        - name: kind
          label: Kind
          type: enum
          required: true
          role: [data, template]
          values: [beta, sunset]
          help:
            beta is off by default; sunset is on by default and guards a doomed branch
        - name: when_enabled
          label: "On"
          type: string
          required: true
          role: [template]
          help: What the code does with this flag enabled
        - name: when_disabled
          label: "Off"
          type: string
          required: true
          role: [template]
          help:
            What the code does with this flag disabled; this branch is deleted at
            removal
        - name: remove_when
          label: Remove when
          type: string
          required: true
          role: [template]
          help: What must be true before the disabled branch can be deleted
        - name: remove_by_date
          label: Remove by date
          type: date
          required: true
          role: [data]
          help: Calendar removal threshold, YYYY-MM-DD
        - name: remove_by_release
          label: Remove by release
          type: string
          required: true
          role: [data]
          help: Release removal threshold, e.g. 0.18.0
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      body_template: |
        ## Feature flag `{{ key }}` · {{ kind }}

        - **On:** {{ when_enabled }}
        - **Off:** {{ when_disabled }}

        **Remove when:** {{ remove_when }}

        Removal deletes the **Off** branch and makes the **On** branch unconditional.
      triage:
        min_plus_ones: 0
