commit_hooks:
  before: "just fix"
is_sase_managed: true
memory:
  h1_title: "Structured Agentic Software Engineering (SASE) - Agent Instructions"
  glossary:
    Agent Clan:
      definition: >-
        An agent clan is a named, rootless container for agents that run in parallel.
        Every member is named inside the clan's hood (`<clan>.<suffix>`) and declares
        `%clan:<clan>`; the clan name is reserved and is never itself an agent.
    Agent Family:
      definition: >-
        An agent family is a sase agent whose agent shells run as a strictly sequential
        chain. Its shells use `<family>--<suffix>` names. The first `%id(parent,
        suffix)` attachment renames the original shell with its own suffix and reserves
        the bare family name as the sase agent container, so a family always has at
        least two shells.
    Agent Hood:
      aliases:
        - hood
        - agent neighborhood
      definition: >-
        An agent hood is a group of agents that are all named with the same `<name>.`
        prefix. For example, agents named `foo.bar`, `foo.baz`, and `foo.bar.1` are all
        apart of the same `foo` agent hood. The agent `foo`, if it exists, is also
        considered part of the `foo` agent hood.
    Agent Instruction File:
      aliases:
        - agents.md file
      definition: >-
        An agent instruction file is a `.md` file that an agent CLI reads automatically
        when working in a directory that contains it. For example, the `AGENTS.md` file
        is the name of the agent instruction file that is supported by codex. sase
        supports one agent instruction file per supported agent CLI (ex: `CLAUDE.md` for
        claude, `GEMINI.md` for antigravity, etc...). The `sase init` command, which is
        run automatically as a sase post-commit hook, initializes the top-level agent
        instruction files using memories in the sase/memory/ directory and ensures that
        all agent instruction files in the same directory contain the same contents.
    Agent Neighbor:
      definition: >-
        An agent neighbor is any agent that is in the same agent hood as another agent.
        For example, agents named `foo`, `foo.baz`, and `foo.bar.1` are all neighbors of
        each other because they are all in the same `foo` agent hood.
    Agent Shell:
      definition: >-
        An agent shell is one concrete LLM/provider run. It holds a workspace claim
        while active and is the execution row shown by `sase agent list`.
    Agent Tribe:
      definition: >-
        An agent tribe is a user-facing label for related agents across clans and
        families. Assign a tribe at launch with `%id(tribe=<tribe>)` or
        `#tribe:<tribe>` for an auto-named agent, `%id(<id>, tribe=<tribe>)` for an
        explicitly named agent, or `%clan(<clan>, tribe=<tribe>)` for a clan. Tribes can
        also be managed after launch with `sase agent tribe` and are displayed with an
        `@` prefix.
    Artifact Reference:
      aliases:
        - ref
      definition: >-
        An artifact reference (ref) is a typed `@<kind>:<argument>` citation in an agent
        prompt. Builtin kinds are `@stitch`, `@patch`, `@bead`, `@agent`, and the
        special `@file`; artifact repos add document kinds such as `@plan` and
        `@research` through a project's `ref:` config, written inline or with
        `use: <provider>` from an installed provider plugin. Every ref expands to prompt
        text, is recorded against the agent that used it, and publishes as a
        `[@kind:arg][N]` link.
    Patch:
      definition: >-
        A Patch is SASE's local unit of change. Every PR created or managed by SASE is
        associated with exactly one Patch, but a Patch may exist without a PR,
        represented by an absent `PR:` field. Active Patches live in ProjectSpec
        `<key>.sase` (directory key `<key>`; see Project, Repo, and Workspace); terminal
        ones (Submitted, Archived, Reverted) live in `<key>-archive.sase`. Sections:
        NAME, DESCRIPTION, PARENT, PR, STATUS, STITCHES, HOOKS, COMMENTS, MENTORS.
        Status lifecycle: WIP -> Draft -> Ready -> Mailed -> Submitted.
    Proc:
      aliases:
        - procs
        - background task
        - background tasks
      definition: >-
        A Proc is a durable background process SASE records, supervises, and can stream
        or kill. Procs live in `~/.sase/procs/procs.jsonl` with combined output logs and
        are surfaced by `sase proc` and ACE's Procs tab. Historical proc rows may use
        `command`, `tui`, or `detached` kind values, but those names are compatibility
        labels rather than permanent semantic categories. Distinct from a task bead,
        which is a work item, and from an asyncio task.
    Proc Shell:
      definition: >-
        A proc shell is a named supervised proc belonging to a sase agent, with durable
        output and lifecycle state. A family-attached proc shell is a monitor and may
        carry timeout, workspace-claim, and follow-up policy.
    Sase Agent:
      aliases:
        - agent
      definition: >-
        A sase agent is an agent family or a single agent that does not belong to a
        family. It owns an ordered sequence of sase shells, and its name never ends in
        `--<suffix>` because that suffix is reserved for agent shells. A one-shell agent
        may share its shell name, while a family uses the bare name for its container.
    Sase Project:
      aliases:
        - project
      definition: >-
        A sase project is a named unit of work registered with SASE. A project is
        created only when a new VCS xprompt argument resolves to a valid project:
        `#git:<name>` accepts any valid project name, while `#gh:<org>/<repo>` requires
        an existing GitHub repository. Its ProjectSpec is
        `~/.sase/projects/<key>/<key>.sase`, where the directory key `<key>` is `<name>`
        for `#git` projects but `gh_<org>__<repo>` for `#gh` projects (ex:
        `gh_sase-org__sase`); the user-facing name is the spec's `PROJECT_NAME:` (ex:
        `sase`) or, if unset, the key. Projects have exactly two user-facing states,
        enabled and disabled; missing `PROJECT_STATE:` means enabled, and only an
        explicit disable changes that. The system-managed `home` project remains hidden.
    Sase Repo:
      aliases:
        - repo
      definition: >-
        A sase repo is any repository SASE knows: a project's primary repo, an artifact
        sidecar repo such as `<project>--plans` or `<project>--research`, or a repo
        declared through `repos.linked`.
    Sase Shell:
      aliases:
        - shell
      definition: >-
        A sase shell is one executing member of a sase agent, either an agent shell or a
        proc shell. A sase agent is a sequence of sase shells.
    Sase Workspace:
      aliases:
        - workspace
      definition: >-
        A sase workspace is a numbered clone of a project's primary repo, managed by the
        workspace store and tracked in that project's `registry.json`. Each SASE agent
        claims exactly one workspace until completion. Workspace directories are not
        repos. Linked-repo clones materialized for a workspace are repo checkouts, not
        additional workspaces.
    Stitch:
      definition: >-
        A stitch is the lightweight ordered change record inside a Patch's `STITCHES:`
        section. Every VCS commit made through the tracked workflow has an associated
        numeric stitch, but a stitch need not have a commit: proposals retain
        numeric-plus-letter IDs such as `(2a)`. The `sase commit` command and real
        Git/Mercurial commits are still called commits.
    Xprompt:
      definition: >-
        Triggered with `#foo` in agent prompts. Defined in a sase/xprompts/ directory
        (.md or .yml file) or in ~/.config/sase/sase.yml (`xprompts` field).
    Xprompt Memory:
      aliases:
        - memory file
      definition: >-
        A flat SASE memory note exposed as a namespaced xprompt: `sase/memory/foo.md`
        expands with `#memory/foo`, and the `memory/` prefix is required.
    Xprompt Part:
      definition: >-
        .md file -> single `prompt_part` step with the file's content.
    Xprompt Swarm:
      definition: >-
        An xprompt whose body contains top-level `---` segment separators outside fenced
        blocks and fans out into one agent per segment at launch. Literal user prompts
        can also use `---`, but those are generic multi-agent prompts rather than
        xprompt swarms.
    Xprompt Workflow:
      definition: >-
        .yml file -> multiple steps (`prompt_part`, `python`, `bash`, etc.).

vcs_provider:
  default_hooks:
    # keep-sorted start
    - "just lint"
    - "just test"
    # keep-sorted end

repos:
  linked:
    - name: sase-core
      path: ../sase-core
      description: Shared Rust core backend for SASE domain behavior and cross-frontend APIs.
      auto_clone: true
    - name: sase-github
      path: ../sase-github
      description: GitHub VCS and workspace provider plugin for repository, issue, and PR workflows.
    - name: sase-telegram
      path: ../sase-telegram
      description: Telegram integration plugin for chat-driven SASE workflows and notifications.
    - name: sase-nvim
      path: ../sase-nvim
      description: Neovim integration plugin for SASE syntax, completion, and editor support.
    - name: sase-research-artifacts
      path: ../sase-research-artifacts
      description: >-
        Installable artifact-reference plugin that provides the `@research` document
        provider, `research-highlights` file-hook template, and `#research*` xprompts.
  sidecar:
    builtin:
      plans:
        auto_clone: true
        ref:
          use: plan
      beads:
        auto_clone: true
      agents:
        description: Hidden sidecar that stores commit-associated sase agent data for this project.
    custom:
      research:
        description: >-
          Durable SASE research reports and generated media used by research workflows.
        ref:
          use: research
