description: Launch an improvement audit agent when a project has enough new commits.
hidden: true

input:
  project:
    type: line
    default: "sase"
    description: SASE project key whose recent improvement-audit marker should be checked.
  gh_ref:
    type: line
    default: "sase"
    description: GitHub ref or workspace selector to pass to the launched audit agent.
  threshold:
    type: int
    default: 200
    description: Minimum commit count since the marker required before launching an audit.

steps:
  - name: count_recent_improvement_audit_commits
    hidden: true
    python: |
      import subprocess
      from pathlib import Path

      from sase.project_aliases import resolve_project_alias_ref

      # "{{ project }}" may be a PROJECT_NAME/alias; markers must live under
      # the canonical project dir so they never mint a phantom project dir.
      project_key = resolve_project_alias_ref("{{ project }}")
      marker = Path.home() / ".sase" / "projects" / project_key / "recent_improvement_audit_marker"
      head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
      head_short = subprocess.check_output(["git", "rev-parse", "--short=12", "HEAD"], text=True).strip()
      threshold = {{ threshold }}

      if marker.exists():
          parts = marker.read_text().strip().split()
          last_sha = parts[0]
          last_ts = parts[1] if len(parts) > 1 else None
          check = subprocess.run(["git", "cat-file", "-t", last_sha], capture_output=True)
          if check.returncode == 0:
              result = subprocess.check_output(
                  ["git", "rev-list", "--count", f"{last_sha}..HEAD"], text=True
              )
              count = int(result.strip())
              base_kind = "sha"
              base_ref = last_sha
              base_context = f"marker SHA {last_sha}"
              range_desc = f"{last_sha}..{head}"
          elif last_ts:
              result = subprocess.check_output(
                  ["git", "rev-list", "--count", f"--after={last_ts}", "HEAD"], text=True
              )
              count = int(result.strip())
              base_kind = "timestamp"
              base_ref = last_ts
              base_context = f"marker SHA missing; using marker timestamp {last_ts}"
              range_desc = f"commits after unix timestamp {last_ts} through {head}"
          else:
              count = 999  # Old-format marker with no timestamp, force an audit
              base_kind = "forced"
              base_ref = last_sha
              base_context = f"old marker SHA {last_sha} has no timestamp"
              range_desc = f"forced audit through {head}"
      else:
          count = 999  # First run, force an audit
          base_kind = "first-run"
          base_ref = "none"
          base_context = "no marker file exists"
          range_desc = f"first audit through {head}"

      print(f"count={count}")
      print(f"head={head}")
      print(f"head_short={head_short}")
      print(f"base_kind={base_kind}")
      print(f"base_ref={base_ref}")
      print(f"base_context={base_context}")
      print(f"range_desc={range_desc}")
      print(f"marker={marker}")
      print(f"threshold={threshold}")
      print(f"should_launch={str(count >= threshold).lower()}")
      if count < threshold:
          print("reason=below_threshold")
    output:
      count: int
      head: line
      head_short: word
      base_kind: word
      base_ref: line
      base_context: line
      range_desc: line
      marker: line
      threshold: int
      should_launch: bool

  - name: launch_improvement_audit_agent
    hidden: true
    if: "{{ count_recent_improvement_audit_commits.count >= threshold }}"
    python: |
      import re
      import textwrap

      from sase.agent.launcher import launch_agent_from_cwd

      project = "{{ project }}"
      gh_ref = "{{ gh_ref }}"
      head = "{{ count_recent_improvement_audit_commits.head }}"
      head_short = "{{ count_recent_improvement_audit_commits.head_short }}"
      safe_project = re.sub(r"[^A-Za-z0-9_.]+", "_", project).strip("_") or "repo"
      safe_pr_project = re.sub(r"[^A-Za-z0-9_]+", "_", project).strip("_") or "repo"
      pr_name = f"recent_improvement_audit_{safe_pr_project}_{head_short}"
      name_prefix = f"audit_improvements.{safe_project}.{head_short}"

      prompt = textwrap.dedent(f"""
      %name:{name_prefix}
      %w(runners=0)
      #gh:{gh_ref} %g:chop #pr({pr_name})

      Audit recent commits in {project} for objective improvements.

      Review scope:
      - Marker file: {{ count_recent_improvement_audit_commits.marker }}
      - Base selection: {{ count_recent_improvement_audit_commits.base_context }}
      - Commit range: {{ count_recent_improvement_audit_commits.range_desc }}
      - Current HEAD: {head}
      - Commit count since marker: {{ count_recent_improvement_audit_commits.count }}

      Inspect every commit in this since-last-run range for improvements that are clear, objective wins, such as a
      small correctness-preserving simplification, a plainly better error path, targeted test coverage for changed
      behavior, or an obvious performance fix with low risk.

      Only make changes when the value is objective and narrowly scoped. Do not perform style churn, speculative
      refactors, preference changes, broad rewrites, renames, formatting-only edits, or subjective cleanup. If no
      objectively valuable change is found, leave the worktree untouched and report that outcome.

      When you change files, run the focused checks appropriate to the affected code.
      """).strip()

      launch_agent_from_cwd(prompt)
      print("launched=1")
      print(f"launched_agent_name={name_prefix}")
      print(f"pr_name={pr_name}")
    output:
      launched: int

  - name: update_recent_improvement_audit_marker
    hidden: true
    if:
      "{{ count_recent_improvement_audit_commits.count >= threshold and launch_improvement_audit_agent.launched > 0 }}"
    python: |
      import subprocess
      from pathlib import Path

      from sase.project_aliases import resolve_project_alias_ref

      head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
      ts = subprocess.check_output(["git", "log", "-1", "--format=%ct", "HEAD"], text=True).strip()
      project_key = resolve_project_alias_ref("{{ project }}")
      marker = Path.home() / ".sase" / "projects" / project_key / "recent_improvement_audit_marker"
      marker.parent.mkdir(parents=True, exist_ok=True)
      marker.write_text(f"{head} {ts}")
      print("updated=true")
      print(f"marker={marker}")
      print(f"head={head}")
    output: { updated: bool }
