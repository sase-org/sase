INHERIT: mkdocs.yml

exclude_docs: |
  blog/
  series/

nav:
  - Home: index.md
  - The Basics:
      - ACE TUI: ace.md
      - AXE Automation: axe.md
      - Spec-Driven Development: sdd.md
      - XPrompts: xprompt.md
  - Beyond the Basics:
      - Architecture: architecture.md
      - ChangeSpecs: change_spec.md
      - Beads: beads.md
      - Workflows: workflow_spec.md
      - Workspaces: workspace.md
      - Mentors: mentors.md
  - The Nitty Gritty:
      - Commit Workflows: commit_workflows.md
      - Notifications: notifications.md
      - Mobile Gateway: mobile_gateway.md
      - Mobile MVP Runbook: mobile_mvp_runbook.md
      - Performance Runbook: perf_runbook.md
      - Telemetry: telemetry.md
      - Agent Revival Log: troubleshooting/agent-revival.md
  - Integrations:
      - Integration APIs: integrations.md
      - Plugins: plugins.md
      - LLM Providers: llms.md
      - VCS Providers: vcs.md
      - Rust Backend: rust_backend.md
  - Reference:
      - CLI Reference: cli.md
      - Development: development.md
      - Configuration: configuration.md
      - Query Language: query_language.md
      - ProjectSpec: project_spec.md
      - Agent Attachments: agent_images.md
      - Acknowledgements: acknowledgements.md

extra:
  pdf_handbook:
    build_date: !ENV [SASE_PDF_BUILD_DATE, ""]
    build_ref: !ENV [GITHUB_REF_NAME, ""]
    build_run: !ENV [GITHUB_RUN_ID, ""]
    build_sha: !ENV [GITHUB_SHA, ""]

plugins:
  - search
  - exporter:
      formats:
        pdf:
          enabled: true
          concurrency: 4
          stylesheets:
            - docs/stylesheets/pdf.css
          scripts:
            - docs/javascripts/pdf-numbering.js
          covers:
            front: docs/templates/pdf/front.html.j2
          browser:
            timeout: 120000
            args:
              - --no-sandbox
          aggregator:
            enabled: true
            output: downloads/sase-handbook.pdf
            covers: limits
