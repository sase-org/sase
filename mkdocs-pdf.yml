INHERIT: mkdocs.yml

# The handbook is a curated Guide edition. Keep these rules directory based so
# new tutorial, concept, and guide pages join automatically.
exclude_docs: |
  **/*.md
  !index.md
  !start/**
  !concepts/**
  !guides/**
  !blog/posts/structured-agentic-software-engineering.md
  blog/index.md

theme:
  # Keep PDF generation independent of rotating remote Google Font assets.
  # Browser fetch failures are fatal because the PDF build runs in strict mode.
  font: false

extra:
  # Material's analytics partial is disabled for generated PDF builds.
  analytics: false
  pdf_handbook:
    build_date: !ENV [SASE_PDF_BUILD_DATE, ""]
    build_ref: !ENV [GITHUB_REF_NAME, ""]
    build_run: !ENV [GITHUB_RUN_ID, ""]
    build_sha: !ENV [GITHUB_SHA, ""]

plugins:
  - search
  - exporter:
      formats:
        pdf:
          enabled: true
          concurrency: 4
          url: https://sase.sh/
          stylesheets:
            - docs/stylesheets/pdf.css
          scripts:
            - docs/javascripts/pdf-numbering.js
          covers:
            front: docs/templates/pdf/front.html.j2
          browser:
            timeout: 120000
            args:
              - --no-sandbox
          aggregator:
            enabled: true
            output: downloads/sase-handbook.pdf
            covers: limits
