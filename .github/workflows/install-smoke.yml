name: Install smoke

# Phase sase-1le.3 (applicability): prove the documented install command
# installs the documented product. The command itself is single-sourced
# from tools/render_applicability (--install-command), so this workflow
# never drifts from the docs. While sase>=0.18 is unreleased the install
# step fails loudly with a resolver error instead of silently installing
# 0.1.0; that red run is the signal that product and docs disagree.

on:
  schedule:
    - cron: '26 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: Documented install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Run the documented install command
        run: eval "$(python3 tools/render_applicability --install-command)"

      - name: Assert the installed version meets the documented floor
        run: python3 tools/render_applicability --check-installed

      - name: Smoke the CLI entry points
        # Isolated home so doctor does not inherit this checkout's required
        # plugins. Full `sase doctor -j` exits 1 on ERROR, and a CI runner
        # has no LLM provider; pin the provider check and accept that
        # expected diagnostic, matching publish.yml's install-smoke.
        run: |
          set -euo pipefail
          sase --help
          sase version -j
          sase core health --json
          doctor_json="$(mktemp)"
          doctor_status=0
          clean_home="$(mktemp -d)"
          SASE_HOME="$clean_home" HOME="$clean_home" \
            sase doctor -C llm.default -j > "$doctor_json" || doctor_status=$?
          cat "$doctor_json"
          python3 - "$doctor_json" "$doctor_status" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          doctor_status = int(sys.argv[2])
          with open(path, encoding="utf-8") as fp:
              payload = json.load(fp)

          checks = payload.get("checks", [])
          summary = checks[0].get("summary", "") if checks else ""
          expected_missing_provider = (
              payload.get("status") == "ERROR"
              and "no usable default LLM provider executable was found" in summary
          )

          if doctor_status == 0 and payload.get("status") == "OK":
              print("Provider readiness smoke passed.")
          elif doctor_status == 1 and expected_missing_provider:
              print("Provider readiness smoke produced the expected CI diagnostic.")
          else:
              print(
                  "Unexpected provider readiness result: "
                  f"exit={doctor_status}, status={payload.get('status')!r}, summary={summary!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
