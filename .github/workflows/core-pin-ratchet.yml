name: Core Pin Ratchet

# Proposes a bump to sase-core-revision.txt (the pinned sase-core revision
# Master Gate and CI build the Rust core from) whenever sase-core's remote
# HEAD has moved past it. Runs on a schedule rather than on push, so this
# workflow itself can never redden a commit's gate; the opened PR runs the
# normal per-ref CI, so a pinned revision that would break sase never merges
# silently.
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

concurrency:
  group: core-pin-ratchet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
      - name: Propose a core pin bump
        env:
          GH_TOKEN: ${{ secrets.SASE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/ratchet_core_revision --check || status=$?
          if [ "$status" -eq 0 ]; then
            echo "sase-core-revision.txt already matches sase-core HEAD."
            exit 0
          fi
          if [ "$status" -ne 2 ]; then
            exit "$status"
          fi

          apply_status=0
          python3 tools/ratchet_core_revision || apply_status=$?
          if [ "$apply_status" -ne 0 ] && [ "$apply_status" -ne 2 ]; then
            exit "$apply_status"
          fi
          new_sha="$(tr -d '[:space:]' < sase-core-revision.txt)"
          # Fixed branch name: at most one ratchet PR is ever open at a time.
          # A later run reuses and force-pushes this same branch instead of
          # opening a second PR next to a still-open one.
          branch="core-pin-ratchet"
          title="chore(core-pin): bump pinned sase-core revision to ${new_sha:0:12}"
          body="Automated ratchet: \`sase-core-revision.txt\` now tracks sase-core's newest remote HEAD (\`${new_sha}\`). Master Gate and CI on this PR prove the pinned revision still builds and passes the fast suite before merge."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add sase-core-revision.txt
          git commit -m "$title"
          git push --force origin "$branch"

          existing_pr="$(gh pr list --repo "${{ github.repository }}" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
          else
            gh pr create \
              --title "$title" \
              --body "$body" \
              --base master \
              --head "$branch"
          fi
