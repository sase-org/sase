name: Release

# Exact-candidate release train (phases sase-1n6.2, sase-1n6.4, sase-1n6.6).
# One build at the tag, sealed into a candidate manifest stashed on the draft
# GitHub release, then exercised on Linux and macOS, qualified against the
# published core, published from the retained bytes with digest-checked
# resume, and confirmed from PyPI before un-drafting.
#
# Modes (workflow_dispatch input `mode`):
# - `release`: dispatched at a `v*` tag. Builds, seals, stashes on the draft
#   release, exercises, qualifies, publishes the missing files, confirms from
#   PyPI, and un-drafts.
# - `resume`: dispatched at a `v*` tag whose sealed generation already carries
#   passing evidence. Runs only `publish` and `confirm`; it never rebuilds or
#   reruns qualification, and it refuses without passing evidence.
# - `rehearse`: dispatched at a branch (normally `master`). Builds, seals,
#   exercises and qualifies, but stores everything as workflow artifacts,
#   never touches a GitHub release, and runs `publish` as a verify-only plan.
#
# Qualification runs `qualify-prepare` (validated manifest fields),
# `qualify-ci` (reusable CI at the identity SHA against the published core),
# and `qualify` (the authoritative verdict from completed scoped jobs and
# attempt-aware evidence). The final verdict is written and uploaded before
# the verdict step fails, so red observations persist. `publish` depends on
# the `qualify` verdict and `exercise`, never on the `qualify-ci` aggregate:
# its status condition passes through required verdicts even when an advisory
# ancestor failed, since default success-propagation would silently skip
# publication. Two concurrent resumes for one tag serialize through the
# `publish-<ref>` concurrency group. `confirm` never un-drafts before every
# check passes, and `resume` refuses without passing evidence.
#
# The exercise legs install the same sealed bytes the manifest binds: the
# build artifact in both modes (the stash upload is a mechanical copy of
# exactly those bytes, and `publish` re-verifies the stashed digests before
# any upload). Digests are verified against the sealed manifest before any
# install runs.
#
# A workflow dispatched at a tag runs that tag's own workflow files: a tag cut
# before release.yml existed can never run it, and a release.yml fix reaches
# only later tags. Rehearse at `master`. A candidate broken by its own
# release.yml is burned, never patched in place.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Train mode
        type: choice
        required: true
        default: rehearse
        options:
          - release
          - resume
          - rehearse
      core_version:
        description: Rehearse-only core override, sealed as `override`
        type: string
        required: false
        default: ""
      rebuild:
        description: Allow a second sealed generation at the same tag
        type: boolean
        required: false
        default: false
      probe:
        description: Rehearse-only fault injection for the exercise legs
        type: choice
        required: false
        default: none
        options:
          - none
          - break-macos
      probe_core_version:
        description: Rehearse-only probe core version, tested but never sealed
        type: string
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.assert.outputs.version }}
      sha: ${{ steps.assert.outputs.sha }}
      tree: ${{ steps.assert.outputs.tree }}
      mode: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert source and version identity
        id: assert
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF}"
          checkout_sha="${GITHUB_SHA}"
          if [ "${MODE}" = "rehearse" ]; then
            case "${ref}" in
              refs/heads/*) ;;
              *) echo "::error::rehearse mode requires a branch ref, got ${ref}"; exit 1 ;;
            esac
            head_sha="$(git rev-parse HEAD)"
            if [ "${head_sha}" != "${checkout_sha}" ]; then
              echo "::error::ref SHA ${head_sha} != checkout SHA ${checkout_sha}"
              exit 1
            fi
            sha="${head_sha}"
          else
            case "${ref}" in
              refs/tags/v*) ;;
              *) echo "::error::${MODE} mode requires a refs/tags/v* ref, got ${ref}"; exit 1 ;;
            esac
            tag_name="${ref#refs/tags/}"
            peeled="$(git rev-list -n 1 "${tag_name}^{commit}")"
            if [ "${peeled}" != "${checkout_sha}" ]; then
              echo "::error::tag ${tag_name} peels to ${peeled} != GITHUB_SHA ${checkout_sha}"
              exit 1
            fi
            sha="${peeled}"
          fi
          py_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          init_version="$(python3 -c 'import ast; print(ast.literal_eval(open("src/sase/__init__.py").read().split("__version__")[1].split("=")[1].split("#")[0].strip()))')"
          if [ "${py_version}" != "${init_version}" ]; then
            echo "::error::pyproject.toml ${py_version} != __version__ ${init_version}"
            exit 1
          fi
          if [ "${MODE}" != "rehearse" ]; then
            want="v${py_version}"
            have="${ref#refs/tags/}"
            if [ "${want}" != "${have}" ]; then
              echo "::error::tag ${have} != version v${py_version}"
              exit 1
            fi
          fi
          tree="$(git rev-parse "HEAD^{tree}")"
          echo "version=${py_version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    if: ${{ inputs.mode == 'release' || inputs.mode == 'rehearse' }}
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.seal.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build once and check the dist set
        run: |
          set -euo pipefail
          rm -rf dist/
          uv build
          uvx twine check dist/*
          wheels="$(ls dist/*.whl 2>/dev/null | wc -l)"
          sdists="$(ls dist/*.tar.gz 2>/dev/null | wc -l)"
          if [ "${wheels}" != "1" ] || [ "${sdists}" != "1" ]; then
            echo "::error::dist set must be exactly one wheel plus one sdist"
            ls dist/
            exit 1
          fi
      - name: Resolve the exact core pin
        id: core
        env:
          MODE: ${{ inputs.mode }}
          CORE_OVERRIDE: ${{ inputs.core_version }}
        run: |
          set -euo pipefail
          if [ -n "${CORE_OVERRIDE}" ] && [ "${MODE}" != "rehearse" ]; then
            echo "::error::core_version override is rehearse-only"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*"sase-core-rs==[^"]+"' pyproject.toml; then
            core_pin="$(grep -Eo 'sase-core-rs==[0-9][0-9.]*' pyproject.toml | head -n 1)"
            core_source="pyproject"
          elif [ -n "${CORE_OVERRIDE}" ]; then
            core_pin="sase-core-rs==${CORE_OVERRIDE}"
            core_source="override"
          else
            locked="$(python3 -c 'import tomllib; print([p["version"] for p in tomllib.load(open("uv.lock","rb"))["package"] if p["name"] == "sase-core-rs"][0])')"
            core_pin="sase-core-rs==${locked}"
            core_source="uv.lock"
          fi
          echo "core_pin=${core_pin}" >> "$GITHUB_OUTPUT"
          echo "core_version=${core_pin#sase-core-rs==}" >> "$GITHUB_OUTPUT"
          echo "core_source=${core_source}" >> "$GITHUB_OUTPUT"
      - name: Fetch the core file list and digests
        run: |
          set -euo pipefail
          uv run --no-project --with packaging \
            python tools/release_candidate core-files \
            --version '${{ steps.core.outputs.core_version }}' \
            --lock uv.lock \
            --out core-files.json
      - name: Read the core completeness set at the pin's tag
        run: |
          set -euo pipefail
          uv run --no-project --with packaging \
            python tools/release_candidate core-suffixes \
            --url 'https://raw.githubusercontent.com/sase-org/sase-core/v${{ steps.core.outputs.core_version }}/.github/workflows/release-plz.yml' \
            --out core-suffixes.json
      - name: Seal the candidate manifest
        id: seal
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - > dists.json <<'EOF'
          import hashlib
          import json
          import os
          from pathlib import Path
          mode = os.environ["MODE"]
          tag = os.environ["TAG"]
          dists = []
          for path in sorted(Path("dist").iterdir()):
            name = path.name
            if name.endswith(".whl"):
              packagetype = "bdist_wheel"
            elif name.endswith(".tar.gz"):
              packagetype = "sdist"
            else:
              continue
            if mode == "release":
              asset = f"gh-release:{tag}/{name}"
            else:
              asset = f"file:dist/{name}"
            dists.append(
              {
                "filename": name,
                "packagetype": packagetype,
                "size": path.stat().st_size,
                "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                "asset": asset,
              }
            )
          print(json.dumps(dists))
          EOF
          uv run --no-project --with packaging \
            python tools/release_candidate seal \
            --repository '${{ github.repository }}' \
            --version '${{ needs.identity.outputs.version }}' \
            --tag '${{ github.ref }}' \
            --sha '${{ needs.identity.outputs.sha }}' \
            --tree '${{ needs.identity.outputs.tree }}' \
            --generation 1 \
            --builder-revision '${{ github.workflow_ref }}' \
            --builder-run-id '${{ github.run_id }}' \
            --builder-attempt '${{ github.run_attempt }}' \
            --core-source-pin "$(grep -Eo 'sase-core-rs[^"]*' pyproject.toml | head -n 1)" \
            --core-version '${{ steps.core.outputs.core_version }}' \
            --core-files core-files.json \
            --expected-core-suffixes core-suffixes.json \
            --dists dists.json \
            --out candidate-manifest.json
          uv run --no-project --with packaging \
            python tools/release_candidate verify \
            --manifest candidate-manifest.json
          echo "manifest=candidate-manifest.json" >> "$GITHUB_OUTPUT"
      - name: Upload the candidate build
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build
          path: |
            dist/
            candidate-manifest.json
            core-files.json

  stash:
    needs:
      - identity
      - build
    if: ${{ inputs.mode == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REBUILD: ${{ inputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - name: Download built dists and manifest
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: candidate/
      - name: Stash on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          state="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          if [ "${state}" != "true" ]; then
            echo "::error::release ${TAG} is missing or is not a draft"
            exit 1
          fi
          sealed="$(gh release view "${TAG}" --json assets --jq '[.assets[].name | select(startswith("candidate-gen"))] | length')"
          if [ "${sealed}" != "0" ] && [ "${REBUILD}" != "true" ]; then
            echo "::error::${TAG} already has a sealed generation; pass rebuild: true for a new one"
            exit 1
          fi
          gh release upload "${TAG}" candidate/* --clobber

  exercise-legs:
    needs:
      - identity
      - build
    if: ${{ inputs.mode == 'release' || inputs.mode == 'rehearse' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        artifact: [wheel, sdist]
    env:
      UV_NO_CACHE: '1'
    steps:
      - name: Refuse probes outside rehearse
        run: |
          set -euo pipefail
          if [ "${{ inputs.probe }}" != "none" ] \
            && [ "${{ inputs.mode }}" != "rehearse" ]; then
            echo "::error::probe '${{ inputs.probe }}' is rehearse-only"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Ensure tmux for the TUI frame
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          command -v tmux || brew install tmux
      - name: Download the sealed build
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: candidate/
      - name: Resolve the leg dist and manifest fields
        id: leg
        run: |
          set -euo pipefail
          python3 - > leg.env <<'EOF'
          import json

          manifest = json.load(open("candidate/candidate-manifest.json"))
          want = "bdist_wheel" if "${{ matrix.artifact }}" == "wheel" else "sdist"
          names = [
              d["filename"] for d in manifest["dists"] if d["packagetype"] == want
          ]
          assert len(names) == 1, manifest["dists"]
          print(f"dist={names[0]}")
          print(f"version={manifest['version']}")
          print(f"core_version={manifest['core_version']}")
          print(f"candidate_id={manifest['candidate_id']}")
          print(f"generation={manifest['generation']}")
          EOF
          cat leg.env >> "$GITHUB_OUTPUT"
      - name: Verify digests before install
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.load(open("candidate/candidate-manifest.json"))
          expected = {d["filename"]: d["sha256"] for d in manifest["dists"]}
          target = Path("candidate/dist") / "${{ steps.leg.outputs.dist }}"
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          if digest != expected[target.name]:
              print(f"::error::digest mismatch for {target.name}")
              raise SystemExit(1)
          print(f"digest OK for {target.name}")
          EOF
      - name: Prepare the isolated leg environment
        run: |
          set -euo pipefail
          EX_HOME="$RUNNER_TEMP/ex-home"
          mkdir -p "$EX_HOME" "$RUNNER_TEMP/ex-tool-dir" "$RUNNER_TEMP/ex-tool-bin"
          {
            echo "HOME=$EX_HOME"
            echo "SASE_HOME=$EX_HOME"
            echo "XDG_CONFIG_HOME=$EX_HOME/.config"
            echo "XDG_DATA_HOME=$EX_HOME/.local/share"
            echo "XDG_CACHE_HOME=$EX_HOME/.cache"
            echo "UV_TOOL_DIR=$RUNNER_TEMP/ex-tool-dir"
            echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/ex-tool-bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ex-tool-bin" >> "$GITHUB_PATH"
      - name: Resolve the previous installable PyPI release
        if: matrix.artifact == 'wheel'
        id: prev
        run: |
          set -euo pipefail
          # N-1 is the newest still-installable PyPI release at or below the
          # candidate: strictly older at real tags, the released same-version
          # bytes in version-equals-last-release rehearsals. Retention deletes
          # old cores, so a newest-older release whose own dependency closure
          # is gone (UPGRADE_NMINUS1_UNAVAILABLE) is skipped, not forced.
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import urllib.request

          version = "${{ steps.leg.outputs.version }}"
          with urllib.request.urlopen(
              "https://pypi.org/pypi/sase/json", timeout=30
          ) as response:
              releases = json.loads(response.read().decode("utf-8"))["releases"]

          def key(value: str) -> tuple[int, ...]:
              return tuple(int(p) for p in value.split(".") if p.isdigit())

          mine = key(version)
          candidates = sorted(
              (v for v in releases if v.replace(".", "").isdigit() and key(v) <= mine),
              key=key,
              reverse=True,
          )
          picked = ""
          for candidate in candidates:
              proc = subprocess.run(
                  [
                      "uv",
                      "pip",
                      "install",
                      "--dry-run",
                      "--system",
                      "--python",
                      "3.12",
                      f"sase=={candidate}",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if proc.returncode == 0:
                  picked = candidate
                  break
              print(f"sase=={candidate} no longer resolves; skipping")
          if not picked:
              print(
                  "::error::UPGRADE_NO_INSTALLABLE_PREVIOUS no installable "
                  f"PyPI release at or below {version}"
              )
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fp:
              fp.write(f"previous_version={picked}\n")
          print(f"previous installable release: {picked}")
          EOF
      - name: Run the exercise leg
        run: |
          set -euo pipefail
          prev_args=""
          if [ "${{ matrix.artifact }}" = "wheel" ]; then
            prev_args="--previous-version ${{ steps.prev.outputs.previous_version }}"
          fi
          # shellcheck disable=SC2086
          python3 tools/exercise_release run-leg \
            --os '${{ matrix.os }}' \
            --artifact '${{ matrix.artifact }}' \
            --dist 'candidate/dist/${{ steps.leg.outputs.dist }}' \
            --candidate-version '${{ steps.leg.outputs.version }}' \
            --core-version '${{ steps.leg.outputs.core_version }}' \
            --candidate-id '${{ steps.leg.outputs.candidate_id }}' \
            --generation '${{ steps.leg.outputs.generation }}' \
            --run-id '${{ github.run_id }}' \
            --attempt '${{ github.run_attempt }}' \
            $prev_args \
            --apply-probe '${{ inputs.probe }}' \
            --work-dir 'exercise-work' \
            --out 'exercise-${{ matrix.os }}-${{ matrix.artifact }}.json'
      - name: Upload the leg evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-${{ matrix.os }}-${{ matrix.artifact }}
          path: exercise-${{ matrix.os }}-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 30

  exercise:
    needs:
      - identity
      - exercise-legs
    if: ${{ always() && (inputs.mode == 'release' || inputs.mode == 'rehearse') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.merge.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - name: Download the sealed build
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: candidate/
      - name: Download the leg evidence
        uses: actions/download-artifact@v4
        with:
          pattern: exercise-*
          merge-multiple: true
          path: exercise-legs/
      - name: Merge the legs into one exercise observation
        id: merge
        run: |
          set -euo pipefail
          # Array length under `set -u` breaks old bash: relax it for the glob.
          set +u
          shopt -s nullglob
          legs=(exercise-legs/exercise-*.json)
          if [ "${#legs[@]}" -eq 0 ]; then
            legs=(exercise-legs/exercise-missing.json)
          fi
          set -u
          generation="$(python3 -c 'import json; print(json.load(open("candidate/candidate-manifest.json"))["generation"])')"
          candidate_id="$(python3 -c 'import json; print(json.load(open("candidate/candidate-manifest.json"))["candidate_id"])')"
          asset="candidate-gen${generation}-exercise-run${{ github.run_id }}-attempt${{ github.run_attempt }}.json"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          set +e
          result="$(python3 tools/exercise_release merge "${legs[@]}" \
            --candidate-id "${candidate_id}" \
            --generation "${generation}" \
            --run-id '${{ github.run_id }}' \
            --attempt '${{ github.run_attempt }}' \
            --out exercise-extra.json)"
          merge_status=$?
          set -e
          echo "${result}"
          verdict="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["verdict"])' "${result}")"
          reason="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["reason"])' "${result}")"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          python3 tools/release_candidate observe \
            --manifest candidate/candidate-manifest.json \
            --kind exercise \
            --run-id '${{ github.run_id }}' \
            --attempt '${{ github.run_attempt }}' \
            --verdict "${verdict}" \
            --reason "${reason}" \
            --extra exercise-extra.json \
            --out "${asset}"
          if [ "${merge_status}" -ne 0 ]; then
            echo "::error::exercise red: ${reason}"
            exit 1
          fi
      - name: Stash the exercise observation on the draft release
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" '${{ steps.merge.outputs.asset }}' --clobber
      - name: Upload the exercise observation artifact
        if: inputs.mode == 'rehearse'
        uses: actions/upload-artifact@v4
        with:
          name: exercise-observation
          path: ${{ steps.merge.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

  # Validates the sealed manifest from the current run's candidate-build
  # artifact and exposes the exact build identity the qualifier must bind.
  # The tested core is the probe version in rehearse probe runs, otherwise
  # the intended sealed version. Probes are refused outside rehearse.
  qualify-prepare:
    needs:
      - identity
      - build
    if: ${{ inputs.mode == 'release' || inputs.mode == 'rehearse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.bind.outputs.sha }}
      candidate-id: ${{ steps.bind.outputs.candidate-id }}
      generation: ${{ steps.bind.outputs.generation }}
      core-version: ${{ steps.bind.outputs.core-version }}
      tested-core-version: ${{ steps.bind.outputs.tested-core-version }}
      inventory-digest: ${{ steps.bind.outputs.inventory-digest }}
      probe-core-version: ${{ steps.bind.outputs.probe-core-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - name: Download the sealed candidate build
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: candidate/
      - name: Bind the sealed candidate identity
        id: bind
        env:
          MODE: ${{ inputs.mode }}
          REPOSITORY: ${{ github.repository }}
          IDENTITY_SHA: ${{ needs.identity.outputs.sha }}
          PROBE_CORE_VERSION: ${{ inputs.probe_core_version }}
        run: |
          set -euo pipefail
          manifest="candidate/candidate-manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::sealed candidate-manifest.json is missing from candidate-build"
            exit 1
          fi
          probe="${PROBE_CORE_VERSION:-}"
          if [ -n "$probe" ] && [ "$MODE" != "rehearse" ]; then
            echo "::error::probe_core_version is rehearse-only"
            exit 1
          fi
          core_version="$(python3 -c 'import json; print(json.load(open("'"$manifest"'"))["core_version"])')"
          python3 tools/write_qualification_evidence \
            --bind-manifest "$manifest" \
            --expected-core-version "$core_version" \
            --github-output "$GITHUB_OUTPUT"
          python3 - "$manifest" "$IDENTITY_SHA" "$REPOSITORY" "$probe" >> "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest_path, identity_sha, repository, probe = sys.argv[1:5]
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          if manifest.get("sha") != identity_sha:
              print(
                  f"::error::sealed sha {manifest.get('sha')!r} != identity {identity_sha!r}"
              )
              raise SystemExit(1)
          if manifest.get("repository") != repository:
              print(
                  f"::error::sealed repository {manifest.get('repository')!r} "
                  f"!= run repository {repository!r}"
              )
              raise SystemExit(1)
          core_version = manifest.get("core_version") or ""
          if not core_version:
              print("::error::sealed manifest carries no core_version")
              raise SystemExit(1)
          digest = hashlib.sha256(
              Path(".github/release-qualification.json").read_bytes()
          ).hexdigest()
          tested = probe or core_version
          print(f"sha={identity_sha}")
          print(f"core-version={core_version}")
          print(f"tested-core-version={tested}")
          print(f"inventory-digest={digest}")
          print(f"probe-core-version={probe}")
          PY

  # Runs reusable CI at the exact identity SHA against the published core
  # from the sealed manifest. Local reusable calls use this workflow's own
  # revision; the requested ref reaches every checkout. Qualification pins
  # qualify-<sha> without cancelling; the outer release group stays
  # distinct. Resume never reaches this job.
  qualify-ci:
    needs: qualify-prepare
    if: ${{ inputs.mode == 'release' || inputs.mode == 'rehearse' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.qualify-prepare.outputs.sha }}
      core-source: published
      core-version: ${{ needs.qualify-prepare.outputs.core-version }}
      manifest-artifact: candidate-build
      probe-core-version: ${{ needs.qualify-prepare.outputs.probe-core-version }}
      caller-job: qualify-ci
    secrets: inherit

  # Determines promotion readiness from the completed qualify-ci jobs and
  # their attempt-aware evidence. Reads attempt-scoped jobs plus run-scoped
  # artifacts with paginated Actions API requests under the exact qualify-ci
  # call scope (never suffix matching), then evaluates with the shared
  # release_candidate qualify clause. Missing, skipped, cancelled, unreadable
  # or failed evidence is a typed red outcome, never a skip. The observation
  # is written under its canonical asset filename and uploaded first; only
  # the final verdict step fails the job, so red observations persist.
  # Release mode attaches the observation to the draft with this job's
  # narrowly scoped write permission; rehearse uses artifacts.
  qualify:
    needs:
      - qualify-prepare
      - qualify-ci
    if: ${{ always() && (inputs.mode == 'release' || inputs.mode == 'rehearse') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      verdict: ${{ steps.evaluate.outputs.verdict }}
      observation: ${{ steps.evaluate.outputs.observation }}
      token: ${{ steps.evaluate.outputs.token }}
      run-id: ${{ steps.evaluate.outputs.run-id }}
      attempt: ${{ steps.evaluate.outputs.attempt }}
      candidate-id: ${{ steps.evaluate.outputs.candidate-id }}
      generation: ${{ steps.evaluate.outputs.generation }}
      intended-core-version: ${{ steps.evaluate.outputs.intended-core-version }}
      tested-core-version: ${{ steps.evaluate.outputs.tested-core-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify-prepare.outputs.sha }}
          fetch-depth: 1
      - name: Download the sealed candidate build
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: candidate/
      - name: Evaluate the qualification evidence
        id: evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_ID: ${{ needs.qualify-prepare.outputs.candidate-id }}
          GENERATION: ${{ needs.qualify-prepare.outputs.generation }}
          INTENDED_CORE: ${{ needs.qualify-prepare.outputs.core-version }}
          TESTED_CORE: ${{ needs.qualify-prepare.outputs.tested-core-version }}
        run: |
          set -euo pipefail
          repo="${REPOSITORY}"
          run="${RUN_ID}"
          attempt="${RUN_ATTEMPT}"
          mkdir -p jobs-pages artifacts-pages evidence qualify-work zips
          fetch_ok=1
          if ! python3 tools/collect_qualification_jobs fetch-evidence \
              --repo "$repo" \
              --run-id "$run" \
              --attempts "$attempt" \
              --jobs-dir jobs-pages \
              --artifacts-file "artifacts-pages/run.json" \
              --evidence-root evidence \
              --zips-dir zips; then
            echo "::error::failed to fetch qualify-ci facts for run ${run}; the evaluator records a typed red observation"
            fetch_ok=0
          fi
          collect_args=(
            --inventory .github/release-qualification.json
            --manifest candidate/candidate-manifest.json
            --run-id "$run"
            --caller-job qualify-ci
            --evidence-root evidence
            --out qualify-work/jobs.json
          )
          for n in $(seq 1 "$attempt"); do
            collect_args+=(
              --attempt-jobs "${n}=jobs-pages/attempt-${n}.json"
              --attempt-artifacts "${n}=artifacts-pages/run.json"
            )
          done
          if [ "$fetch_ok" = "1" ]; then
            if ! python3 tools/collect_qualification_jobs "${collect_args[@]}"; then
              echo "::error::collect_qualification_jobs refused; the evaluator records the jobs file as typed red"
              fetch_ok=0
            fi
          fi
          if [ "$fetch_ok" != "1" ]; then
            printf 'qualification fact fetch failed; see the job log\n' > qualify-work/jobs.json
          fi
          generation="$(python3 -c 'import json; print(json.load(open("candidate/candidate-manifest.json"))["generation"])')"
          asset="candidate-gen${generation}-qualification-run${run}-attempt${attempt}.json"
          set +e
          result="$(python3 tools/release_candidate qualify \
            --manifest candidate/candidate-manifest.json \
            --jobs qualify-work/jobs.json \
            --evidence-dir evidence \
            --run-id "$run" \
            --attempt "$attempt" \
            --out "$asset")"
          status=$?
          set -e
          printf '%s\n' "$result" > qualify-work/result.json
          verdict=red
          if [ "$status" -eq 0 ]; then
            verdict=pass
          fi
          observed="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["asset"])' "$asset" || true)"
          if [ "$observed" != "$asset" ]; then
            echo "::error::qualification observation asset ${observed:-<missing>} disagrees with its canonical filename ${asset}"
            exit 1
          fi
          reason="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("reason", ""))' "$asset" || true)"
          {
            echo "status=${status}"
            echo "verdict=${verdict}"
            echo "observation=${asset}"
            echo "token=${reason}"
            echo "run-id=${run}"
            echo "attempt=${attempt}"
            echo "candidate-id=${CANDIDATE_ID}"
            echo "generation=${GENERATION}"
            echo "intended-core-version=${INTENDED_CORE}"
            echo "tested-core-version=${TESTED_CORE}"
          } >> "$GITHUB_OUTPUT"
          echo "verdict=${verdict} status=${status} asset=${asset} reason=${reason}"
          exit 0
      - name: Upload the qualification observation
        if: ${{ always() && inputs.mode == 'rehearse' }}
        uses: actions/upload-artifact@v4
        with:
          # Attempt-scoped names keep the earlier red observation when a
          # failed-only rerun later appends its own green one.
          name: qualification-observation-run-${{ steps.evaluate.outputs.run-id }}-attempt-${{ steps.evaluate.outputs.attempt }}
          path: ${{ steps.evaluate.outputs.observation }}
          if-no-files-found: error
          retention-days: 30
      - name: Attach the qualification observation to the draft
        if: ${{ always() && inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.evaluate.outputs.observation }}
        run: |
          set -euo pipefail
          if [ -z "${ASSET:-}" ] || [ ! -f "$ASSET" ]; then
            echo "::error::qualification observation was not written; refusing to attach"
            exit 1
          fi
          # The uploaded file keeps its canonical envelope filename, so the
          # draft asset name always agrees with the observation it carries.
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qFx "$ASSET"; then
            gh release download "${TAG}" -p "$ASSET" -D /tmp/qualify-existing
            if cmp -s "/tmp/qualify-existing/${ASSET}" "$ASSET"; then
              echo "identical qualification observation is already attached; skipping upload"
            else
              echo "::error::conflicting qualification observation is already attached as ${ASSET}"
              exit 1
            fi
          else
            gh release upload "${TAG}" "$ASSET"
          fi
      - name: Fail the verdict when qualification is red
        if: always()
        env:
          STATUS: ${{ steps.evaluate.outputs.status }}
          VERDICT: ${{ steps.evaluate.outputs.verdict }}
          TOKEN: ${{ steps.evaluate.outputs.token }}
          INTENDED_CORE: ${{ needs.qualify-prepare.outputs.core-version }}
          TESTED_CORE: ${{ needs.qualify-prepare.outputs.tested-core-version }}
          PROBE: ${{ needs.qualify-prepare.outputs.probe-core-version }}
        run: |
          set -euo pipefail
          {
            echo "## Qualification: ${VERDICT}"
            echo ""
            echo "Intended core: \`${INTENDED_CORE}\`; tested core: \`${TESTED_CORE}\`."
            if [ -n "${TOKEN}" ]; then
              echo "Token: \`${TOKEN}\`."
            fi
            echo "Observation: \`${{ steps.evaluate.outputs.observation }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PROBE" ]; then
            echo "::error::probe core ${TESTED_CORE} is rehearse-only and never qualifies the intended ${INTENDED_CORE}"
            exit 1
          fi
          if [ "$VERDICT" != "pass" ]; then
            if [ -n "$TOKEN" ]; then
              echo "::error::${TOKEN}"
            else
              echo "::error::qualification is red (evaluator status ${STATUS})"
            fi
            exit 1
          fi
          echo "qualification passed"

  # Publishes the sealed dists from the retained bytes after digest
  # checks, uploading only the files missing from PyPI. In `release` and
  # `resume` modes it uploads through the PyPI trusted publisher and records
  # a `publication` observation on the draft release. In `rehearse` mode it
  # runs steps 1-3 only as a verify-only plan with no environment and no
  # upload: a rehearsal at master whose version equals the last release must
  # report PUBLISH_CONFLICT for every file (the different-hash refusal).
  # A red qualify or exercise verdict refuses here, so a break-macos probe
  # shows publish refused and confirm skipped.
  publish:
    needs:
      - identity
      - build
      - qualify
      - exercise
    if: ${{ always() && (inputs.mode == 'release' || inputs.mode == 'resume' || inputs.mode == 'rehearse') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    environment: ${{ inputs.mode != 'rehearse' && 'pypi' || '' }}
    outputs:
      observation: ${{ steps.record.outputs.observation }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - name: Refuse probes outside rehearse
        run: |
          set -euo pipefail
          if [ "${{ inputs.probe }}" != "none" ] \
            && [ "${{ inputs.mode }}" != "rehearse" ]; then
            echo "::error::probe '${{ inputs.probe }}' is rehearse-only"
            exit 1
          fi
          if [ -n "${{ inputs.probe_core_version }}" ] \
            && [ "${{ inputs.mode }}" != "rehearse" ]; then
            echo "::error::probe_core_version is rehearse-only"
            exit 1
          fi
      - name: Stage the sealed dists from the build artifact
        if: ${{ inputs.mode == 'release' || inputs.mode == 'rehearse' }}
        uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: publish-work/build
      - name: Stage the sealed dists from the draft release
        if: ${{ inputs.mode == 'resume' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p publish-work/staged
          gh release download "${TAG}" \
            --dir publish-work/staged \
            --pattern 'sase-*.whl' \
            --pattern 'sase-*.tar.gz' \
            --pattern 'candidate-manifest.json' \
            --clobber
      - name: Normalize the manifest and staged paths
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "resume" ]; then
            echo "manifest=publish-work/staged/candidate-manifest.json" >> "$GITHUB_OUTPUT"
            echo "staged=publish-work/staged" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=publish-work/build/candidate-manifest.json" >> "$GITHUB_OUTPUT"
            echo "staged=publish-work/build/dist" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-verify every digest against the sealed manifest
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("${{ steps.paths.outputs.manifest }}").read_text())
          staged = Path("${{ steps.paths.outputs.staged }}")
          for dist in manifest["dists"]:
              target = staged / dist["filename"]
              if not target.is_file():
                  print(f"::error::PUBLISH_MISSING_ASSET {dist['filename']!r} is not staged")
                  raise SystemExit(1)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if digest != dist["sha256"]:
                  print(f"::error::PUBLISH_STASH_MISMATCH {dist['filename']!r}")
                  raise SystemExit(1)
              if target.stat().st_size != dist["size"]:
                  print(f"::error::PUBLISH_STASH_MISMATCH {dist['filename']!r} size")
                  raise SystemExit(1)
          print("staged digests match the sealed manifest")
          EOF
      - name: Collect the generation evidence observations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p publish-work/observations
          if [ "${{ inputs.mode }}" = "rehearse" ]; then
            echo "evidence comes from the workflow artifacts (see next step)"
          else
            generation="$(python3 -c 'import json; print(json.load(open("${{ steps.paths.outputs.manifest }}"))["generation"])')"
            gh release download "${TAG}" \
              --dir publish-work/observations \
              --pattern "candidate-gen${generation}-qualification-*.json" \
              --pattern "candidate-gen${generation}-exercise-*.json" \
              --clobber
          fi
      - name: Download the evidence observation artifacts
        if: ${{ inputs.mode == 'rehearse' }}
        uses: actions/download-artifact@v4
        with:
          pattern: '*observation*'
          merge-multiple: true
          path: publish-work/observations
      - name: Run the promotion predicate for this candidate
        id: gate
        run: |
          set -euo pipefail
          python3 - > publish-work/observations.json <<'EOF'
          import json
          from pathlib import Path

          items = []
          for path in sorted(Path("publish-work/observations").glob("*.json")):
              try:
                  payload = json.loads(path.read_text())
              except json.JSONDecodeError:
                  continue
              if isinstance(payload, dict) and payload.get("kind") in (
                  "qualification", "exercise", "veto",
              ):
                  items.append(payload)
          print(json.dumps(items))
          EOF
          if [ "${{ inputs.mode }}" = "resume" ]; then
            kinds="$(python3 -c 'import json; print(sorted({o["kind"] for o in json.load(open("publish-work/observations.json"))}))')"
            case "${kinds}" in
              *qualification*exercise* | *exercise*qualification*) ;;
              *)
                echo "::error::resume requires passing qualification and exercise evidence for this generation"
                exit 1
                ;;
            esac
          fi
          set +e
          result="$(uv run --no-project --with packaging \
            python tools/release_candidate evaluate \
            --manifest '${{ steps.paths.outputs.manifest }}' \
            --observations publish-work/observations.json)"
          status=$?
          set -e
          printf '%s\n' "${result}"
          if [ "${status}" -ne 0 ]; then
            token="$(printf '%s\n' "${result}" | python3 -c 'import json,sys; print("; ".join(c["name"] + ": " + c["detail"] for c in json.load(sys.stdin)["clauses"] if not c["ok"]))')"
            echo "::error::${token}"
            exit 1
          fi
      - name: Fetch the PyPI file list for the version
        id: pypi
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("${{ steps.paths.outputs.manifest }}"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://pypi.org/pypi/sase/${version}/json" -o publish-work/pypi.json; then
            echo "fetched PyPI JSON for sase==${version}"
          else
            echo "sase==${version} is not on PyPI yet; planning a full upload"
            echo '{"urls": []}' > publish-work/pypi.json
          fi
      - name: Compute the digest-checked upload plan
        id: plan
        run: |
          set -euo pipefail
          # A PUBLISH_CONFLICT refusal here is the expected different-hash
          # proof in rehearse-at-master runs; a PUBLISH_MISSING_ASSET or
          # PUBLISH_STASH_MISMATCH refusal means the retained bytes moved.
          set +e
          result="$(uv run --no-project --with packaging \
            python tools/release_candidate publish-plan \
            --manifest '${{ steps.paths.outputs.manifest }}' \
            --pypi-json publish-work/pypi.json \
            --staged-dir '${{ steps.paths.outputs.staged }}' \
            --out publish-work/publish-plan.json)"
          status=$?
          set -e
          printf '%s\n' "${result}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::${result##*REFUSED }"
            exit 1
          fi
          echo "plan=publish-work/publish-plan.json" >> "$GITHUB_OUTPUT"
          python3 - publish-work/publish-plan.json <<'EOF'
          import json
          import sys

          plan = json.load(open(sys.argv[1]))
          for entry in plan["files"]:
              print(f"{entry['action']}: {entry['filename']}")
          EOF
      - name: Copy only the planned uploads
        if: ${{ inputs.mode == 'release' || inputs.mode == 'resume' }}
        run: |
          set -euo pipefail
          rm -rf publish-work/upload-only
          mkdir -p publish-work/upload-only
          python3 - publish-work/publish-plan.json '${{ steps.paths.outputs.staged }}' <<'EOF'
          import json
          import shutil
          import sys
          from pathlib import Path

          plan = json.load(open(sys.argv[1]))
          staged = Path(sys.argv[2])
          for entry in plan["files"]:
              if entry["action"] == "upload":
                  shutil.copy2(staged / entry["filename"], Path("publish-work/upload-only"))
          EOF
          if [ -z "$(ls -A publish-work/upload-only)" ]; then
            echo "every sealed file is already present on PyPI; nothing to upload"
          else
            ls publish-work/upload-only
          fi
      - name: Publish the missing files to PyPI
        if: ${{ inputs.mode == 'release' || inputs.mode == 'resume' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-work/upload-only/
          skip-existing: false
      - name: Record the publication observation
        id: record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          generation="$(python3 -c 'import json; print(json.load(open("${{ steps.paths.outputs.manifest }}"))["generation"])')"
          asset="candidate-gen${generation}-publication-run${{ github.run_id }}-attempt${{ github.run_attempt }}.json"
          echo "observation=${asset}" >> "$GITHUB_OUTPUT"
          python3 - > publish-work/publication-extra.json <<'EOF'
          import json

          plan = json.load(open("publish-work/publish-plan.json"))
          print(json.dumps({"publication": plan}))
          EOF
          uv run --no-project --with packaging \
            python tools/release_candidate observe \
            --manifest '${{ steps.paths.outputs.manifest }}' \
            --kind publication \
            --run-id '${{ github.run_id }}' \
            --attempt '${{ github.run_attempt }}' \
            --verdict pass \
            --reason "digest-checked publish for sase==$(python3 -c 'import json; print(json.load(open("${{ steps.paths.outputs.manifest }}"))["version"])')" \
            --extra publish-work/publication-extra.json \
            --out "${asset}"
          if [ "${{ inputs.mode }}" = "rehearse" ]; then
            echo "rehearse mode: verify-only plan, no upload and no draft attach"
          else
            gh release upload "${TAG}" "${asset}" --clobber
          fi
      - name: Upload the publication observation artifact
        if: ${{ inputs.mode == 'rehearse' }}
        uses: actions/upload-artifact@v4
        with:
          name: publication-observation-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.record.outputs.observation }}
          if-no-files-found: error
          retention-days: 30

  # Installs sase==<version> from public PyPI on Linux and macOS and proves
  # the exact install: version -j reports the manifest's core and core
  # health passes. Evidence feeds the `confirm` finalizer, which never
  # un-drafts before every check passes.
  confirm-install:
    needs:
      - identity
      - publish
    if: ${{ inputs.mode == 'release' || inputs.mode == 'resume' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v4
      - name: Download the sealed manifest from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p confirm-work
          gh release download "${TAG}" \
            --dir confirm-work \
            --pattern 'candidate-manifest.json' \
            --clobber
      - name: Install the released version from public PyPI
        run: |
          set -euo pipefail
          CONFIRM_HOME="$RUNNER_TEMP/confirm-home"
          mkdir -p "$CONFIRM_HOME" "$RUNNER_TEMP/confirm-tool-dir" "$RUNNER_TEMP/confirm-tool-bin"
          {
            echo "HOME=$CONFIRM_HOME"
            echo "SASE_HOME=$CONFIRM_HOME"
            echo "XDG_CONFIG_HOME=$CONFIRM_HOME/.config"
            echo "XDG_DATA_HOME=$CONFIRM_HOME/.local/share"
            echo "XDG_CACHE_HOME=$CONFIRM_HOME/.cache"
            echo "UV_TOOL_DIR=$RUNNER_TEMP/confirm-tool-dir"
            echo "UV_TOOL_BIN_DIR=$RUNNER_TEMP/confirm-tool-bin"
            echo "UV_NO_CACHE=1"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/confirm-tool-bin" >> "$GITHUB_PATH"
          version="$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["version"])')"
          uv tool install --python 3.12 --refresh "sase==${version}"
      - name: Prove the exact install reports the manifest core
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          import subprocess

          manifest = json.load(open("confirm-work/candidate-manifest.json"))
          payload = json.loads(
              subprocess.run(
                  ["sase", "version", "-j"],
                  check=True, capture_output=True, text=True,
              ).stdout
          )
          packages = payload.get("packages", {})
          core = packages.get("sase-core-rs") or payload.get("core_version")
          if core != manifest["core_version"]:
              print(
                  f"::error::installed core {core!r} != "
                  f"manifest core {manifest['core_version']!r}"
              )
              raise SystemExit(1)
          print(f"exact install reports the manifest core {core}")
          EOF
          sase core health --json
      - name: Upload the install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirm-install-${{ matrix.os }}
          path: confirm-work/candidate-manifest.json
          if-no-files-found: error
          retention-days: 30

  # Confirms every manifest file on PyPI with a matching SHA-256, re-proves
  # the exact install evidence, runs the family canary with the exact rule,
  # then un-drafts and records a `confirmation` observation. A missing file
  # is PUBLISH_PARTIAL (retried through the bounded CDN wait); a mismatch or
  # an extra file is PUBLISH_CONFLICT and refuses at once, never un-drafting.
  confirm:
    needs:
      - identity
      - publish
      - confirm-install
    if: ${{ inputs.mode == 'release' || inputs.mode == 'resume' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 1
      - name: Download the sealed manifest from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p confirm-work
          gh release download "${TAG}" \
            --dir confirm-work \
            --pattern 'candidate-manifest.json' \
            --clobber
      - name: Poll PyPI until every file confirms or the wait ends
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["version"])')"
          attempts=60
          delay=30
          for n in $(seq 1 "${attempts}"); do
            if curl -fsS "https://pypi.org/pypi/sase/${version}/json" -o confirm-work/pypi.json; then
              set +e
              report="$(uv run --no-project --with packaging \
                python tools/release_candidate confirm \
                --manifest confirm-work/candidate-manifest.json \
                --pypi-json confirm-work/pypi.json \
                --out confirm-work/confirmation-report.json)"
              status=$?
              set -e
              if [ "${status}" -eq 0 ]; then
                printf '%s\n' "${report}"
                echo "every sealed file is confirmed on PyPI"
                exit 0
              fi
              if printf '%s\n' "${report}" | grep -q PUBLISH_CONFLICT; then
                printf '%s\n' "${report}"
                echo "::error::PUBLISH_CONFLICT: refusing without un-drafting"
                exit 1
              fi
              echo "attempt ${n}/${attempts}: PUBLISH_PARTIAL, waiting ${delay}s for CDN lag"
            else
              echo "attempt ${n}/${attempts}: sase==${version} not on PyPI yet, waiting ${delay}s"
            fi
            sleep "${delay}"
          done
          echo "::error::PUBLISH_PARTIAL: sase==${version} did not confirm within the bounded wait"
          exit 1
      - name: Require the Linux and macOS install evidence
        uses: actions/download-artifact@v4
        with:
          pattern: confirm-install-*
          merge-multiple: true
          path: confirm-work/install-evidence
      - name: Run the family canary with the exact rule
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["version"])')"
          CANARY_HOME="$RUNNER_TEMP/canary-home"
          mkdir -p "$CANARY_HOME" "$RUNNER_TEMP/canary-tool-dir" "$RUNNER_TEMP/canary-tool-bin"
          export HOME="$CANARY_HOME" SASE_HOME="$CANARY_HOME"
          export UV_TOOL_DIR="$RUNNER_TEMP/canary-tool-dir" UV_TOOL_BIN_DIR="$RUNNER_TEMP/canary-tool-bin"
          export UV_NO_CACHE=1
          uv tool install --python 3.12 --refresh "sase==${version}"
          "$RUNNER_TEMP/canary-tool-bin/sase" version -j
          "$RUNNER_TEMP/canary-tool-bin/sase" core health --json
          uv run --no-project --with packaging tools/check_family_install \
            --sase-exe "$RUNNER_TEMP/canary-tool-bin/sase" \
            --mode exact \
            --expect "sase==${version}" \
            --step assert-exact-versions \
            --write-result confirm-work/family-canary.json
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::draft tag ${TAG} != v${version}; refusing to un-draft"
            exit 1
          fi
          gh release edit "${TAG}" --draft=false --latest
      - name: Record the confirmation observation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          generation="$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["generation"])')"
          asset="candidate-gen${generation}-confirmation-run${{ github.run_id }}-attempt${{ github.run_attempt }}.json"
          cp confirm-work/candidate-manifest.json confirm-work/confirmation-manifest.json
          uv run --no-project --with packaging \
            python tools/release_candidate observe \
            --manifest confirm-work/confirmation-manifest.json \
            --kind confirmation \
            --run-id '${{ github.run_id }}' \
            --attempt '${{ github.run_attempt }}' \
            --verdict pass \
            --reason "sase==$(python3 -c 'import json; print(json.load(open("confirm-work/candidate-manifest.json"))["version"])') confirmed on PyPI with an exact install and family canary" \
            --extra confirm-work/confirmation-report.json \
            --out "${asset}"
          gh release upload "${TAG}" "${asset}" --clobber
