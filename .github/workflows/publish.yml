name: Publish to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # for trusted publishing
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Install built sase wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          # Install the freshly built wheel; PyPI resolves the
          # `sase-core-rs` runtime dependency.
          uv pip install --python /tmp/smoke-venv/bin/python dist/sase-*.whl
      - name: Default-backend import smoke (Rust extension loadable)
        run: |
          /tmp/smoke-venv/bin/python -c "import sase_core_rs; print('sase_core_rs:', sase_core_rs.__file__)"
          /tmp/smoke-venv/bin/python -c "from sase.core.query_facade import parse_query; print(parse_query('status:Ready'))"
          /tmp/smoke-venv/bin/python -c "from sase.core.backend import is_rust_available; assert is_rust_available(), 'Rust extension imported but is_rust_available() returned False'"
      - name: Explicit Python-mode smoke (no Rust required)
        env:
          SASE_CORE_BACKEND: python
        run: |
          /tmp/smoke-venv/bin/python -c "from sase.core.query_facade import parse_query; print(parse_query('status:Ready'))"
  publish:
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
