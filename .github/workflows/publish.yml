name: Publish to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # for trusted publishing
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Install built sase wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          # Install the freshly built wheel; PyPI resolves the
          # `sase-core-rs` runtime dependency.
          uv pip install --python /tmp/smoke-venv/bin/python dist/sase-*.whl
      - name: Default-backend health check (Rust extension loadable)
        run: /tmp/smoke-venv/bin/sase core health --json
      - name: Explicit Python-mode health check (no Rust required)
        env:
          SASE_CORE_BACKEND: python
        run: /tmp/smoke-venv/bin/sase core health --json
  publish:
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
