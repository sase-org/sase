name: Publish to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # for trusted publishing
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Install built sase wheel into a fresh venv
        run: |
          uv venv --python 3.12 /tmp/smoke-venv
          # Install the freshly built wheel; PyPI resolves the
          # `sase-core-rs` runtime dependency.
          uv pip install --python /tmp/smoke-venv/bin/python dist/sase-*.whl
      - name: Default-backend health check (Rust extension loadable)
        run: /tmp/smoke-venv/bin/sase core health --json
      - name: Explicit Python-mode health check (no Rust required)
        env:
          SASE_CORE_BACKEND: python
        run: /tmp/smoke-venv/bin/sase core health --json
      # Phase 6G: surface platform / extension version details when a
      # release smoke step above fails so the build log is enough to
      # diagnose a missing-wheel or ABI-mismatch issue without a manual
      # reproduction step.
      - name: Report extension diagnostics on failure
        if: failure()
        run: |
          echo "::group::sase core health --json (default backend)"
          /tmp/smoke-venv/bin/sase core health --json || true
          echo "::endgroup::"
          echo "::group::sase core health --json (SASE_CORE_BACKEND=python)"
          SASE_CORE_BACKEND=python /tmp/smoke-venv/bin/sase core health --json || true
          echo "::endgroup::"
          echo "::group::installed packages"
          /tmp/smoke-venv/bin/python -m pip list || true
          echo "::endgroup::"
          echo "::group::python / platform"
          /tmp/smoke-venv/bin/python -c "import platform, sys; print(sys.version); print(platform.platform()); print(platform.machine())"
          echo "::endgroup::"
          echo "::group::sase_core_rs module probe"
          /tmp/smoke-venv/bin/python -c "import sase_core_rs; print(sase_core_rs.__file__); print(getattr(sase_core_rs, '__version__', '<no __version__>'))" || true
          echo "::endgroup::"
  publish:
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
