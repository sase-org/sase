name: Publish

# Release creation and release-PR metadata only. The exact-candidate train
# (handover phase sase-1n6.9) owns building, exercising, publishing, and
# confirming through release.yml: recovering an old version is now
# `release.yml -f mode=resume` at its tag, never a job here. The release
# steward dispatches this workflow bare (`gh workflow run publish.yml`) in
# metadata mode to refresh release-please after a stale head or pin change.

on:
  schedule:
    # Keep release-please from churning the release branch on every master push.
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release1
        name: Release Please
        continue-on-error: true
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Back off before release-please retry 2
        if: ${{ steps.release1.outcome == 'failure' }}
        run: sleep 60
      - uses: googleapis/release-please-action@v5
        id: release2
        name: Release Please (retry 2)
        if: ${{ steps.release1.outcome == 'failure' }}
        continue-on-error: true
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Back off before release-please retry 3
        if: ${{ steps.release2.outcome == 'failure' }}
        run: sleep 60
      - uses: googleapis/release-please-action@v5
        id: release3
        name: Release Please (retry 3)
        if: ${{ steps.release2.outcome == 'failure' }}
        with:
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-metadata:
    needs: release
    # release-please updates the pending release PR's pyproject.toml on
    # scheduled/manual generation runs, but never touches uv.lock or the
    # published sase-core-rs floor. Reconcile release metadata on that branch so
    # release-please regeneration remains idempotent instead of leaving
    # stray follow-up diffs. Run regardless of the release job's own retry
    # outcome so a transient release-please failure doesn't also skip this
    # reconciliation.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for a pending release-please branch
        id: check_branch
        env:
          GH_TOKEN: ${{ secrets.SASE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/branches/release-please--branches--master" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.check_branch.outputs.exists == 'true' }}
        with:
          ref: release-please--branches--master
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
      - uses: astral-sh/setup-uv@v4
        if: ${{ steps.check_branch.outputs.exists == 'true' }}
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python
        if: ${{ steps.check_branch.outputs.exists == 'true' }}
        run: uv python install 3.12
      - name: Reconcile release metadata
        if: ${{ steps.check_branch.outputs.exists == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SASE_RELEASE_TOKEN }}
          UV_DEFAULT_INDEX: https://pypi.org/simple/
        run: |
          set -euo pipefail
          ratchet_status=0
          python tools/ratchet_core_pin --allow-transitive-lock-refresh || ratchet_status=$?
          if [ "$ratchet_status" -eq 2 ]; then
            echo "sase-core-rs ratchet applied dependency metadata changes."
          elif [ "$ratchet_status" -ne 0 ]; then
            exit "$ratchet_status"
          fi
          uv lock
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "release metadata already matches the pending release branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: sync release metadata"
          git push origin HEAD:release-please--branches--master
