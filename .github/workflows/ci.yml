name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  SASE_CORE_DIR: ${{ github.workspace }}/sase-core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Cache Go binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-v4-linux-amd64-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install Go tools (keep-sorted)
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: |
          CGO_ENABLED=0 go install github.com/google/keep-sorted@latest
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Lint
        run: just lint
      - name: Pyvision (unused symbol check)
        run: just pyvision
      - name: Pylimit (file line count check)
        run: just pylimit

  fmt-md-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Install prettier
        run: npm install -g prettier
      - name: Check Markdown formatting
        run: just fmt-md-check

  # Test matrix runs every shipped operation through the Rust binding.
  # Coverage is collected from the 3.12 leg.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just install
      - name: Run tests
        run: just test-cov
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Build and verify package
        run: just build-check

  # Bead backend gate for the `sase bead` Rust migration. This job keeps the
  # focused Python bead contract, Rust bead/parity tests, cross-repo facade
  # tests, and a small benchmark smoke together so stale bindings are caught
  # before the broad matrix hides the cause.
  bead-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Run Rust bead checks
        run: just rust-check
      - name: Run Python bead parity and CLI tests
        run: |
          .venv/bin/pytest \
            tests/test_bead \
            tests/test_core_facade/test_bead_read.py \
            tests/test_core_facade/test_bead_mutation.py
      - name: Run bead performance smoke
        run: just bead-perf-smoke
      - name: Upload bead performance smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bead-perf-smoke
          path: plans/202605/perf_artifacts/bead_perf_smoke.json

  # Phase 7E regression floor (sase-1e.5). Runs the stable subset of
  # Phase 7B core-operation benchmarks against the recorded
  # tests/perf/baselines/phase7_regression_floor.json and fails on a
  # regression. Slow/manual end-to-end TUI/home-tree measurements stay
  # outside this gate (see plans/202604/rust_backend_phase7_phase7e_handoff.md).
  phase7-perf-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Run Phase 7E regression floor
        run: just phase7-perf-check
      - name: Upload floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-perf-floor-report
          path: plans/202604/perf_artifacts/rust_backend_phase7_floor_check.json

  # Phase 9 launch regression floor (sase-1r.9). Keeps the Rust-backed
  # launch path from drifting back toward the Phase 1 parent-side sleep
  # baseline while still using fake subprocesses/no LLM CLIs.
  launch-perf-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Run launch regression floor
        run: just launch-perf-check
      - name: Upload launch floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-perf-floor-report
          path: plans/202605/perf_artifacts/agent_launch_regression_check.json

  # Install smoke verifies that a fresh `sase` install resolves the
  # required `sase-core-rs` runtime dependency and that representative parser
  # and launch bindings work. Calls `sase core health` so the smoke matches
  # the CLI a user would run.
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Health check (Rust extension loadable)
        run: .venv/bin/sase core health --json
