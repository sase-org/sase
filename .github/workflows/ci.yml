name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Install beads (bd)
        run: |
          BD_VERSION=$(curl -s https://api.github.com/repos/steveyegge/beads/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -L -o /tmp/bd.tar.gz "https://github.com/steveyegge/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/bd.tar.gz -C /usr/local/bin bd
          sudo chmod +x /usr/local/bin/bd
      - name: Initialize beads database
        run: |
          rm -f .beads/metadata.json
          bd init --from-jsonl --skip-hooks --quiet --force
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Lint
        run: just lint
      - name: Pyvision (unused symbol check)
        run: just pyvision
      - name: Pylimit (file line count check)
        run: just pylimit

  fmt-md-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install prettier
        run: npm install -g prettier
      - name: Check Markdown formatting
        run: just fmt-md-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just install
      - name: Run tests
        run: just test
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Build and verify package
        run: just build-check
