name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  SASE_CORE_DIR: ${{ github.workspace }}/sase-core

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Cache Go binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-bin-v4-linux-amd64-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install Go tools (keep-sorted)
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: |
          CGO_ENABLED=0 go install github.com/google/keep-sorted@latest
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Lint
        run: just lint
      - name: Pyvision (unused symbol check)
        run: just pyvision
      - name: Pylimit (file line count check)
        run: just pylimit

  fmt-md-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Install prettier
        run: npm install -g prettier
      - name: Check Markdown formatting
        run: just fmt-md-check

  # Phase 6G default-backend test matrix: SASE_CORE_BACKEND unset routes
  # every shipped operation through the Rust binding (Phase 6F default).
  # Coverage is collected from the 3.12 leg as before.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just install
      - name: Run tests (default backend = Rust)
        run: just test-cov
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Phase 6G explicit-Python escape-hatch matrix. Covers the
  # `SASE_CORE_BACKEND=python` path that stays supported through Phase 7.
  # Running on the supported oldest and newest Python versions keeps cost
  # bounded; the full default-backend matrix above carries 3.13.
  test-python-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      SASE_CORE_BACKEND: python
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just install
      - name: Run tests (explicit SASE_CORE_BACKEND=python)
        run: just test

  # Phase 6G dual-run parity gate. Exercises every shipped Rust binding
  # under `SASE_CORE_DUAL_RUN=1` against the committed golden corpus and
  # a sanitized synthetic ~/.sase/projects fixture, then fails if any
  # comparison record reports `match: false`. The JSONL log and JSON
  # summary are uploaded so a regression can be inspected post-hoc.
  parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Run dual-run parity gate
        run: |
          mkdir -p parity-artifacts
          .venv/bin/python tests/parity/dual_run_parity.py \
            --log-path parity-artifacts/core_dual_run.jsonl \
            --summary-path parity-artifacts/parity_summary.json
      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-artifacts
          path: parity-artifacts/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Build and verify package
        run: just build-check

  # Phase 7E regression floor (sase-1e.5). Runs the stable subset of
  # Phase 7B core-operation benchmarks against the recorded
  # tests/perf/baselines/phase7_regression_floor.json and fails on a
  # regression. Slow/manual end-to-end TUI/home-tree measurements stay
  # outside this gate (see plans/202604/rust_backend_phase7_phase7e_handoff.md).
  phase7-perf-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Run Phase 7E regression floor
        run: just phase7-perf-check
      - name: Upload floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-perf-floor-report
          path: plans/202604/perf_artifacts/rust_backend_phase7_floor_check.json

  # Phase 6B install-smoke scaffolding, tightened in Phase 6D to invoke the
  # `sase core health` command rather than open-coded import / binding
  # probes. Proves that a fresh `sase` install resolves the `sase-core-rs`
  # runtime dependency, the Rust extension is importable, the shipped
  # `parse_query` binding works, and the explicit Python escape hatch
  # (`SASE_CORE_BACKEND=python`) still functions.
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Default-backend health check (Rust extension loadable)
        run: .venv/bin/sase core health --json
      - name: Explicit Python-mode health check (escape hatch still works)
        env:
          SASE_CORE_BACKEND: python
        run: .venv/bin/sase core health --json
