name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      BD_NO_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Cache bd binary
        id: cache-bd
        uses: actions/cache@v4
        with:
          path: ~/go/bin/bd
          key: bd-linux-amd64-go-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install beads (bd)
        if: steps.cache-bd.outputs.cache-hit != 'true'
        run: CGO_ENABLED=0 go install github.com/steveyegge/beads/cmd/bd@latest
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Lint
        run: just lint
      - name: Pyvision (unused symbol check)
        run: just pyvision
      - name: Pylimit (file line count check)
        run: just pylimit

  fmt-md-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install prettier
        run: npm install -g prettier
      - name: Check Markdown formatting
        run: just fmt-md-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: just install
      - name: Run tests
        run: just test
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - uses: extractions/setup-just@v2
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: just install
      - name: Build and verify package
        run: just build-check
