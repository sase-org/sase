name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Explicit sase commit to check out. Empty preserves the caller default (PR merge-ref, Full CI SHA).
        type: string
        required: false
        default: ''
      core-source:
        description: "'source' builds from sase-core-revision.txt; 'published' uses the sealed manifest wheel."
        type: string
        required: false
        default: 'source'
      core-version:
        description: Expected sase-core-rs version. Required at runtime when core-source is published.
        type: string
        required: false
        default: ''
      manifest-artifact:
        description: Artifact holding the sealed candidate-manifest.json (published mode).
        type: string
        required: false
        default: 'candidate-build'
      caller-job:
        description: Reusable caller scope for qualification job identity (for example qualify-ci). Empty keeps inputless source callers on best-effort lookup.
        type: string
        required: false
        default: ''
      probe-core-version:
        description: Rehearse-only probe core version. Never qualifies the sealed pair.
        type: string
        required: false
        default: ''

# Qualification pins qualify-<sha> and never cancels in-flight attempts.
# Ordinary PR, release-please, scheduled Full CI, and other inputless callers
# keep the latest-wins ci-<ref> group.
concurrency:
  group: ${{ inputs.ref && format('qualify-{0}', inputs.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.ref }}

permissions:
  contents: read
  actions: read

# Every job carries a timeout-minutes ceiling; without one, a wedged job
# holds an org runner slot for GitHub's 6-hour default and starves every
# other workflow in the org, including release publishes.
jobs:
  # Fail closed on invalid source/version/manifest combinations before any
  # candidate tests. Source-default callers (PRs, Full CI) take the cheap
  # path: no manifest download. Published qualification reads the sealed
  # candidate artifact instead of trusting an unaccompanied version string.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core-source: ${{ steps.validate.outputs.core-source }}
      core-version: ${{ steps.validate.outputs.core-version }}
      manifest-artifact: ${{ steps.validate.outputs.manifest-artifact }}
      candidate-id: ${{ steps.bind.outputs.candidate-id || steps.validate.outputs.candidate-id }}
      generation: ${{ steps.bind.outputs.generation || steps.validate.outputs.generation }}
      inventory-digest: ${{ steps.validate.outputs.inventory-digest }}
      expected-core-version: ${{ steps.validate.outputs.expected-core-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate qualification inputs
        id: validate
        env:
          INPUT_CORE_SOURCE: ${{ inputs.core-source }}
          INPUT_CORE_VERSION: ${{ inputs.core-version }}
          INPUT_MANIFEST_ARTIFACT: ${{ inputs.manifest-artifact }}
          INPUT_PROBE_CORE_VERSION: ${{ inputs.probe-core-version }}
        run: |
          set -euo pipefail
          source="${INPUT_CORE_SOURCE:-source}"
          version="${INPUT_CORE_VERSION:-}"
          probe="${INPUT_PROBE_CORE_VERSION:-}"
          manifest="${INPUT_MANIFEST_ARTIFACT:-candidate-build}"
          case "$source" in
            source|published) ;;
            *)
              echo "::error::core-source must be 'source' or 'published', got '$source'"
              exit 1
              ;;
          esac
          if [ "$source" = "published" ] && [ -z "$version" ]; then
            echo "::error::core-version is required when core-source is published"
            exit 1
          fi
          if [ -n "$probe" ] && [ "$source" != "published" ]; then
            echo "::error::probe-core-version requires core-source 'published'"
            exit 1
          fi
          if [ "$source" = "source" ] && [ -n "$version" ]; then
            echo "::error::core-version is only valid when core-source is published"
            exit 1
          fi
          if [ "$source" = "source" ] && [ -n "${INPUT_MANIFEST_ARTIFACT:-}" ] && [ "$manifest" != "candidate-build" ]; then
            echo "::error::manifest-artifact is only valid when core-source is published"
            exit 1
          fi
          digest="$(python3 tools/write_qualification_evidence --print-inventory-digest)"
          expected="$version"
          if [ -n "$probe" ]; then
            expected="$probe"
          fi
          echo "core-source=$source" >> "$GITHUB_OUTPUT"
          echo "core-version=$version" >> "$GITHUB_OUTPUT"
          echo "manifest-artifact=$manifest" >> "$GITHUB_OUTPUT"
          echo "inventory-digest=$digest" >> "$GITHUB_OUTPUT"
          echo "expected-core-version=$expected" >> "$GITHUB_OUTPUT"
          echo "candidate-id=" >> "$GITHUB_OUTPUT"
          echo "generation=" >> "$GITHUB_OUTPUT"
          echo "Core mode=$source version=$version probe=$probe digest=$digest"
      - name: Download the sealed candidate manifest
        if: steps.validate.outputs.core-source == 'published'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.validate.outputs.manifest-artifact }}
          path: published-core/
      - name: Bind published identity from the sealed manifest
        id: bind
        if: steps.validate.outputs.core-source == 'published'
        env:
          EXPECTED_CORE_VERSION: ${{ steps.validate.outputs.core-version }}
        run: |
          set -euo pipefail
          manifest="$(find published-core -type f -name 'candidate-manifest.json' -print | sort | head -n 1)"
          if [ -z "$manifest" ]; then
            echo "::error::sealed candidate-manifest.json is missing from the manifest artifact"
            exit 1
          fi
          python3 tools/write_qualification_evidence \
            --bind-manifest "$manifest" \
            --expected-core-version "$EXPECTED_CORE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

  # Builds the shared Rust core wheel once through the reusable workflow so
  # ci.yml and telemetry.yml build the exact same artifact from the exact
  # same steps instead of drifting copies.
  build-core:
    needs: prepare
    uses: ./.github/workflows/build-core.yml
    with:
      ref: ${{ inputs.ref }}
      core-source: ${{ needs.prepare.outputs.core-source }}
      core-version: ${{ needs.prepare.outputs.core-version }}
      manifest-artifact: ${{ needs.prepare.outputs.manifest-artifact }}
      probe-core-version: ${{ inputs.probe-core-version }}

  lint:
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Published-core probe: the static bindings scan can run against the
      # exact wheel in a minimal venv before `just install-venv` refuses an
      # older complete core. Attribute the missing names to lint even when
      # subsequent setup cannot proceed. Source CI skips this and keeps the
      # post-install check below.
      - uses: astral-sh/setup-uv@v4
        if: needs.prepare.outputs.core-source == 'published'
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up preflight Python
        if: needs.prepare.outputs.core-source == 'published'
        run: uv python install 3.12
      - name: Download Rust core artifacts for bindings preflight
        if: needs.prepare.outputs.core-source == 'published'
        uses: actions/download-artifact@v4
        with:
          name: sase-core-wheel
          path: ${{ runner.temp }}/sase-core-wheel
      - name: Preflight core bindings
        id: preflight-bindings
        if: always() && needs.prepare.outputs.core-source == 'published'
        env:
          CORE_ARTIFACT_DIR: ${{ runner.temp }}/sase-core-wheel
          BINDINGS_REPORT: ${{ runner.temp }}/bindings-preflight.err
        run: |
          set +e
          mkdir -p "$(dirname "$BINDINGS_REPORT")"
          : > "$BINDINGS_REPORT"
          mapfile -t wheels < <(find "$CORE_ARTIFACT_DIR" -type f -name '*.whl' -print | sort)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "error: expected exactly one sase_core_rs wheel for bindings preflight, found ${#wheels[@]}" | tee -a "$BINDINGS_REPORT" >&2
            exit 1
          fi
          uv venv --python 3.12 "$RUNNER_TEMP/bindings-preflight"
          uv pip install --python "$RUNNER_TEMP/bindings-preflight/bin/python" "${wheels[0]}"
          # Record the actually installed preflight wheel version before the
          # bindings scan can fail, so lint evidence can name the tested
          # version even when dependency setup never creates .venv.
          "$RUNNER_TEMP/bindings-preflight/bin/python" -c 'import importlib.metadata as m; print(m.version("sase-core-rs"))' > "$RUNNER_TEMP/preflight-core-version.txt"
          "$RUNNER_TEMP/bindings-preflight/bin/python" tools/check_sase_core_rs_bindings \
            --remedy "published core is missing required bindings" \
            2> >(tee -a "$BINDINGS_REPORT" >&2)
          status=$?
          exit $status
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      # Fails loudly, by binding name, if the pinned sase-core-revision.txt
      # revision doesn't expose something sase's source now calls -- the
      # legible failure mode a source-revision pin needs.
      - name: Check pinned core bindings
        id: pinned-bindings
        run: >-
          ./.venv/bin/python tools/check_sase_core_rs_bindings
          --remedy "bump the pinned revision in sase-core-revision.txt once a
          sase-core release exposes it (see 'just ratchet-core-revision')"
      # Clones every sidecar declared in sase/sase.yml and writes
      # .sase/sdd-store.json from that same config. Hand-mirroring the sidecar
      # list here drifted every time the config changed (a missing beads
      # sidecar broke `sase validate` on every master run).
      - name: Bootstrap SDD sidecars
        env:
          SASE_RELEASE_TOKEN: ${{ secrets.SASE_RELEASE_TOKEN }}
        run: ./.venv/bin/python tools/ci_bootstrap_sidecars
      - name: Initialize SASE home
        # Home-only init runs outside the checkout so the committed project
        # instruction files are never rewritten before `just validate` checks
        # them as committed (E4 readable-projection drift gate).
        working-directory: ${{ runner.temp }}
        run: |
          $GITHUB_WORKSPACE/.venv/bin/sase init memory --no-commit
          $GITHUB_WORKSPACE/.venv/bin/sase skill init --force
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Cache Go binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          # Keyed on the pinned tool version, not this file's hash: hashing the
          # workflow made every unrelated ci.yml edit reinstall the tool, and a
          # cache eviction could silently change lint behavior.
          key: go-bin-keep-sorted-v0.8.0-linux-amd64
      - name: Install Go tools (keep-sorted)
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        # Must match keep_sorted_version in the Justfile; `just lint` links this
        # binary from PATH rather than installing its own.
        run: |
          CGO_ENABLED=0 go install github.com/google/keep-sorted@v0.8.0
      - name: Cache Prettier dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: prettier-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Check Markdown formatting
        run: just fmt-md-check
      - name: Check generated model docs
        run: just fmt-docs-check
      - name: Check shipped model policy
        run: just model-policy-check
      - name: Lint
        run: just lint
      - name: SASE validation
        run: just validate
      - name: Validate committed plans
        run: just validate-committed-plans
      - name: Build and verify package
        run: just build-check
      - name: Record installed core version
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -x .venv/bin/python ]; then
            .venv/bin/python -c 'import importlib.metadata as m; print(m.version("sase-core-rs"))' > "$RUNNER_TEMP/installed-core-version.txt"
          else
            : > "$RUNNER_TEMP/installed-core-version.txt"
          fi
      - name: Write qualification evidence
        if: always()
        env:
          SASE_QUALIFY_JOB_NAME: lint
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          installed="$(cat "$RUNNER_TEMP/installed-core-version.txt" 2>/dev/null || true)"
          if [ -z "$installed" ] && [ -f "$RUNNER_TEMP/preflight-core-version.txt" ]; then
            installed="$(cat "$RUNNER_TEMP/preflight-core-version.txt")"
          fi
          python3 tools/write_qualification_evidence \
            --kind command \
            --out "$RUNNER_TEMP/qualify-evidence/qualify-evidence-lint.json" \
            --inventory .github/release-qualification.json \
            --inventory-digest "${{ needs.prepare.outputs.inventory-digest }}" \
            --candidate-id "${{ needs.prepare.outputs.candidate-id }}" \
            --generation "${{ needs.prepare.outputs.generation }}" \
            --checked-out-sha "$sha" \
            --expected-core-version "${{ needs.prepare.outputs.expected-core-version }}" \
            --installed-core-version "$installed" \
            --job-name lint \
            --caller-job "${{ inputs.caller-job }}" \
            --bindings-report "$RUNNER_TEMP/bindings-preflight.err" \
            --step "Preflight core bindings=${{ steps.preflight-bindings.outcome }}" \
            --step "Check pinned core bindings=${{ steps.pinned-bindings.outcome }}"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualify-evidence-lint-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualify-evidence/qualify-evidence-lint.json
          if-no-files-found: error

  docs-build:
    # Master pushes build these same artifacts in docs-deploy.yml. PRs retain
    # the build-only signal, except for release-please's generated metadata PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Build docs
        run: |
          just docs-check
          just docs-pdf-check
          just docs-deploy-artifact-check

  # Test matrix runs every shipped operation through the Rust binding.
  # Coverage is collected from the 3.12 leg.
  test:
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    # 120, not 90: the 3.12 coverage leg already takes 74-79 of a 90-minute
    # ceiling, and it must not become the fourth permanent Full CI timeout.
    timeout-minutes: 120
    strategy:
      # One flaky leg must not cancel its siblings: the default fail-fast has
      # been observed erasing the 3.12 coverage gate over a 3.14-only failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      SASE_QUALIFY_EVIDENCE_PATH: ${{ runner.temp }}/qualify-session.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: ${{ matrix.python-version }}
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      - name: Run tests (coverage leg)
        if: matrix.python-version == '3.12'
        env:
          PYTEST_ADDOPTS: -p tests._pytest_qualify_evidence
        run: just test-cov
      - name: Run tests
        if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
        env:
          PYTEST_ADDOPTS: -p tests._pytest_qualify_evidence
        run: just test
      - name: Build shard timings table
        if: always() && matrix.python-version == '3.14' && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shard-timings"
          ./.venv/bin/python tools/refresh_shard_timings \
            --output "$RUNNER_TEMP/shard-timings/shard_timings.json"
      - name: Upload shard timings
        if: always() && matrix.python-version == '3.14' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-timings
          path: ${{ runner.temp }}/shard-timings/shard_timings.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Record installed core version
        if: always()
        continue-on-error: true
        run: |
          set +e
          if [ -x .venv/bin/python ]; then
            .venv/bin/python -c 'import importlib.metadata as m; print(m.version("sase-core-rs"))' > "$RUNNER_TEMP/installed-core-version.txt"
          else
            : > "$RUNNER_TEMP/installed-core-version.txt"
          fi
      - name: Write qualification evidence
        if: always()
        env:
          SASE_QUALIFY_JOB_NAME: test (${{ matrix.python-version }})
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          python3 tools/write_qualification_evidence \
            --kind pytest \
            --out "$RUNNER_TEMP/qualify-evidence/qualify-evidence-test-${{ matrix.python-version }}.json" \
            --session-report "$RUNNER_TEMP/qualify-session.json" \
            --inventory .github/release-qualification.json \
            --inventory-digest "${{ needs.prepare.outputs.inventory-digest }}" \
            --candidate-id "${{ needs.prepare.outputs.candidate-id }}" \
            --generation "${{ needs.prepare.outputs.generation }}" \
            --checked-out-sha "$sha" \
            --expected-core-version "${{ needs.prepare.outputs.expected-core-version }}" \
            --installed-core-version "$(cat "$RUNNER_TEMP/installed-core-version.txt" 2>/dev/null || true)" \
            --job-name "test (${{ matrix.python-version }})" \
            --caller-job "${{ inputs.caller-job }}"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualify-evidence-test-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualify-evidence/qualify-evidence-test-${{ matrix.python-version }}.json
          if-no-files-found: error

  visual-test:
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install visual dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          install-recipe: install-venv-visual
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      - name: Check TUI screenshots
        env:
          # Full CI 38944787812 visual-test "Check TUI screenshots" ran 30m7s
          # (first pass, no recapture) at SHA 6a26d90945. The job timeout is
          # 45 minutes. 600s of recapture budget leaves headroom after a
          # 33-minute worst first pass, checkout/install, and report upload.
          SASE_VISUAL_RECAPTURE_BUDGET_SECONDS: "600"
        run: just fix-tui-screenshots --check
      - name: Locate visual report
        if: always()
        id: visual_report
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pointer = Path(".pytest_cache/sase-visual/latest-report.json")
          status = "missing"
          manifest = ""
          unstable_count = 0
          if pointer.is_file():
              data = json.loads(pointer.read_text(encoding="utf-8"))
              status = str(data.get("status") or "unknown")
              manifest = str(data.get("manifest") or "")
              if manifest:
                  try:
                      payload = json.loads(
                          Path(manifest).read_text(encoding="utf-8")
                      )
                  except (OSError, json.JSONDecodeError):
                      payload = {}
                  unstable = payload.get("unstable") or []
                  if isinstance(unstable, list):
                      unstable_count = len(unstable)
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"manifest={manifest}\n")
              handle.write(f"unstable_count={unstable_count}\n")
          print(f"SASE_VISUAL_REPORT_STATUS={status}", flush=True)
          print(f"SASE_VISUAL_UNSTABLE_COUNT={unstable_count}", flush=True)
          PY
      - name: Build visual report
        if: failure() && steps.visual_report.outputs.manifest != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VISUAL_MANIFEST: ${{ steps.visual_report.outputs.manifest }}
          VISUAL_STATUS: ${{ steps.visual_report.outputs.status }}
        run: |
          printf 'SASE_VISUAL_REPORT_STATUS=%s\n' "$VISUAL_STATUS"
          if [ "$VISUAL_STATUS" != "drift" ]; then
            printf 'Visual screenshot check failed with status=%s (not golden drift). Inspect logs and partial captures; do not accept goldens from this run.\n' "$VISUAL_STATUS"
          fi
          tools/render_visual_snapshot_failure_report \
            --manifest "$VISUAL_MANIFEST" \
            --output-dir .pytest_cache/sase-visual-report \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA"
      - name: Upload visual report
        id: visual_failure_report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ace-visual-failure-report
          path: .pytest_cache/sase-visual-report/visual-failure-report.html
          archive: false
          if-no-files-found: ignore
      - name: Publish visual report
        if: failure() && steps.visual_report.outputs.manifest != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VISUAL_REPORT_URL: ${{ steps.visual_failure_report.outputs.artifact-url }}
          VISUAL_MANIFEST: ${{ steps.visual_report.outputs.manifest }}
          VISUAL_STATUS: ${{ steps.visual_report.outputs.status }}
        run: |
          printf 'SASE_VISUAL_REPORT_STATUS=%s\n' "$VISUAL_STATUS"
          if [ "$VISUAL_STATUS" != "drift" ]; then
            printf 'Visual screenshot check failed with status=%s (not golden drift). Inspect logs and partial captures; do not accept goldens from this run.\n' "$VISUAL_STATUS" >> "$GITHUB_STEP_SUMMARY"
          fi
          tools/render_visual_snapshot_failure_report \
            --manifest "$VISUAL_MANIFEST" \
            --output-dir .pytest_cache/sase-visual-report \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --report-url "$VISUAL_REPORT_URL"
          cat .pytest_cache/sase-visual-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          bash .pytest_cache/sase-visual-report/annotations.sh
      - name: Publish unstable recapture summary
        if: success() && steps.visual_report.outputs.unstable_count != '0' && steps.visual_report.outputs.manifest != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VISUAL_MANIFEST: ${{ steps.visual_report.outputs.manifest }}
        run: |
          tools/render_visual_snapshot_failure_report \
            --manifest "$VISUAL_MANIFEST" \
            --output-dir .pytest_cache/sase-visual-report \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA"
          cat .pytest_cache/sase-visual-report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload first-attempt diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-visual-first-attempt-diffs
          path: .pytest_cache/sase-visual/runs/*/first-attempt-diffs
          if-no-files-found: ignore
      - name: Upload visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ace-visual-artifacts
          path: .pytest_cache/sase-visual
          if-no-files-found: ignore

  ace-page-group-isolation:
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install visual dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          install-recipe: install-venv-visual
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      - name: Run ACE shared-page isolation lane
        run: just test-ace-page-group-isolated

  # Share one runner setup across the latency floors and bead benchmark smoke.
  # Every floor step uses `always()` so an earlier regression cannot erase the
  # remaining signals; any failed command still leaves the job failed.
  perf-floors:
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      - name: Health check (Rust extension loadable)
        run: .venv/bin/sase core health --json
      - name: Run slow tests
        if: always()
        run: just test-slow
      - name: Run Phase 7E regression floor
        if: always()
        run: just phase7-perf-check
      - name: Upload Phase 7E floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-perf-floor-report
          path: sdd/plans/202604/perf_artifacts/rust_backend_phase7_floor_check.json
      - name: Run launch regression floor
        if: always()
        run: just launch-perf-check
      - name: Upload launch floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-perf-floor-report
          path: sdd/plans/202605/perf_artifacts/agent_launch_regression_check.json
      - name: Run view-hints regression floor
        if: always()
        run: just view-hints-perf-check
      - name: Upload view-hints floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-hints-perf-floor-report
          path: sdd/plans/202607/perf_artifacts/view_hints_regression_check.json
      - name: Run agents disk-load operation-count floor
        if: always()
        run: just agent-disk-load-ops-check
      - name: Upload agents disk-load floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-disk-load-ops-floor-report
          path: sdd/plans/202608/perf_artifacts/agent_disk_load_ops_regression_check.json
      - name: Run plugins catalog-scale regression floor
        if: always()
        run: just plugin-catalog-scale-check
      - name: Upload plugins catalog-scale floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-catalog-scale-floor-report
          path: sdd/plans/202608/perf_artifacts/plugin_catalog_scale_regression_check.json
      - name: Run bead performance smoke
        if: always()
        run: just bead-perf-smoke
      - name: Upload bead performance smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bead-perf-smoke
          path: sdd/plans/202605/perf_artifacts/bead_perf_smoke.json
      - name: Run bead scaled-corpus benchmark (record-only 4x)
        if: always()
        run: just bead-perf-scale-record
      - name: Upload bead scaled-corpus benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bead-perf-scale4
          path: sdd/plans/202605/perf_artifacts/bead_perf_scale4.json
      - name: Run bead history-independence gate (1x+4x)
        if: always()
        run: just bead-perf-scale-gate
      - name: Upload bead history-independence gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bead-perf-gate4
          path: sdd/plans/202605/perf_artifacts/bead_perf_gate4.json

  # Scheduled Full CI lane for the Get started tutorials: runs every
  # marked shell block in docs/start/ against fakey in a temporary HOME.
  # ci.yml runs on pull_request and as full.yml's reusable lane; full.yml
  # only fires on its schedule (or manually), so gating on non-PR events
  # keeps this job on the scheduled lane whatever event name the reusable
  # call carries. The slow marker keeps the same tests out of fast lanes.
  tutorial-tests:
    # Ordinary PRs skip this slow lane. Qualification (explicit ref) and
    # scheduled Full CI still run it so all four advisory jobs report.
    if: github.event_name != 'pull_request' || inputs.ref
    needs: [prepare, build-core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          expected-core-version: ${{ needs.prepare.outputs.expected-core-version }}
      - name: Run tutorial tests
        run: just test-tutorials

  # The release-please branch carries the package metadata that will be
  # published. Test it against the exact published core pin, not the
  # source-built core artifact used by feature and master source lanes.
  # Job name stays release-core-floor-smoke: consumers parse it.
  release-core-floor-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install just
        run: |
          curl --retry 5 --retry-all-errors -fsSL \
            https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Install SASE with the pinned published core
        run: |
          set -euo pipefail
          core_minimum="$(python3 tools/smoke_sase_core_rs_telemetry --print-minimum pyproject.toml)"
          echo "CORE_MINIMUM=$core_minimum" >> "$GITHUB_ENV"
          uv venv --python 3.12 /tmp/release-core-floor
          uv pip install --python /tmp/release-core-floor/bin/python -e '.[dev]' "sase-core-rs==${core_minimum}"
      - name: Assert pinned core is installed
        run: |
          /tmp/release-core-floor/bin/python - <<'PY'
          import importlib.metadata
          import os
          import sys

          expected = os.environ["CORE_MINIMUM"]
          actual = importlib.metadata.version("sase-core-rs")
          if actual != expected:
              print(f"expected sase-core-rs=={expected}, got {actual}", file=sys.stderr)
              sys.exit(1)
          print(f"sase-core-rs pin confirmed: {actual}")
          PY
      - name: Check required bindings and core contracts
        run: |
          set -euo pipefail
          /tmp/release-core-floor/bin/python tools/check_sase_core_rs_bindings
          /tmp/release-core-floor/bin/python tools/validate_sase_core_rs
      - name: Smoke Rust core public probes
        run: |
          set -euo pipefail
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_telemetry
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_at_reference_file_gate
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_bead_resolution
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_feature_flag_state
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_plan_header
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_glossary_line_break
          /tmp/release-core-floor/bin/python tools/smoke_sase_core_rs_tool_runs
      - name: Run contract set
        run: |
          set -euo pipefail
          mapfile -t contract_files < tests/contract_manifest.txt
          /tmp/release-core-floor/bin/python -m pytest -m contract "${contract_files[@]}"
