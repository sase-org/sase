name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Latest-wins per ref for PRs: a newer push supersedes queued/in-flight CI for
# the same PR ref so high push volume cannot grow the org-wide runner queue
# without bound (the starvation that stalled the sase-core v0.6.0 wheel
# publish). Master is exempt: cancelling in-flight master runs meant no master
# run ever reached a terminal conclusion, so CI produced no signal at all.
# Concurrency grouping still bounds master to one running + one pending run
# (a newer push replaces the pending slot), so the queue stays bounded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

# Every job carries a timeout-minutes ceiling; without one, a wedged job
# holds an org runner slot for GitHub's 6-hour default and starves every
# other workflow in the org, including release publishes.
jobs:
  build-core:
    # All source-based lanes depend on this root job, so the release-please
    # exclusion propagates without repeating the condition on every consumer.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out Rust core
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase-core
          path: sase-core
      - name: Record Rust core revision
        id: core-sha
        run: |
          core_sha="$(git -C sase-core rev-parse HEAD)"
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "Building sase-core commit $core_sha"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "sase-core/**/pyproject.toml"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sase-core -> target
          shared-key: sase-core-${{ steps.core-sha.outputs.sha }}
      - name: Build abi3 Rust core wheel
        working-directory: sase-core/crates/sase_core_py
        run: uvx maturin build --release --out "$GITHUB_WORKSPACE/dist"
      - name: Record wheel provenance
        run: echo "${{ steps.core-sha.outputs.sha }}" > dist/sase-core-sha.txt
      - name: Upload Rust core wheel
        uses: actions/upload-artifact@v4
        with:
          name: sase-core-wheel
          path: dist/
          if-no-files-found: error

  lint:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out plans sidecar
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase--plans
          path: sase/repos/plans
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Check out beads sidecar
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase--beads
          path: sase/repos/beads
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Check out research sidecar
        uses: actions/checkout@v4
        with:
          repository: sase-org/sase--research
          path: sase/repos/research
          token: ${{ secrets.SASE_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Record split SDD sidecar store
        run: |
          mkdir -p .sase
          cat > .sase/sdd-store.json <<'JSON'
          {
            "schema_version": 2,
            "storage": "sidecar_repos",
            "host": "github.com",
            "provider": "github",
            "discovery": "found",
            "sidecars": {
              "plans": {
                "repo": "sase-org/sase--plans",
                "remote_url": "git@github.com:sase-org/sase--plans.git"
              },
              "beads": {
                "repo": "sase-org/sase--beads",
                "remote_url": "git@github.com:sase-org/sase--beads.git"
              },
              "research": {
                "repo": "sase-org/sase--research",
                "remote_url": "git@github.com:sase-org/sase--research.git"
              }
            }
          }
          JSON
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Initialize SASE home
        run: |
          ./.venv/bin/sase init memory --no-commit
          ./.venv/bin/sase skill init --force
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Cache Go binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          # Keyed on the pinned tool version, not this file's hash: hashing the
          # workflow made every unrelated ci.yml edit reinstall the tool, and a
          # cache eviction could silently change lint behavior.
          key: go-bin-keep-sorted-v0.8.0-linux-amd64
      - name: Install Go tools (keep-sorted)
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        # Must match keep_sorted_version in the Justfile; `just lint` links this
        # binary from PATH rather than installing its own.
        run: |
          CGO_ENABLED=0 go install github.com/google/keep-sorted@v0.8.0
      - name: Check Python formatting
        run: just fmt-py-check
      - name: Lint
        run: just lint
      - name: SASE validation
        run: just validate
      - name: Validate committed plans
        run: just validate-committed-plans

  fmt-md-check:
    # The release-please PR branch only ever carries version/changelog bumps and
    # its merge triggers a full master-push run, so its CI is pure runner burn.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Check Markdown formatting
        run: just fmt-md-check

  docs-build:
    # The release-please PR branch only ever carries version/changelog bumps and
    # its merge triggers a full master-push run, so its CI is pure runner burn.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Set up Python
        run: uv python install 3.12
      - name: Build docs
        run: |
          just docs-check
          just docs-pdf-check
          just docs-deploy-artifact-check

  # Test matrix runs every shipped operation through the Rust binding.
  # Coverage is collected from the 3.12 leg.
  test:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One flaky leg must not cancel its siblings: the default fail-fast has
      # been observed erasing the 3.12 coverage gate over a 3.14-only failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        # Python 3.12 owns visual coverage in the matrix; the dedicated
        # visual-test job remains the canonical, focused renderer signal.
        env:
          SASE_PYTEST_EXCLUDE_VISUAL: ${{ matrix.python-version != '3.12' }}
        run: just test-cov
      - name: Upload visual failure artifacts
        if: failure() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ace-visual-artifacts-test-matrix
          path: .pytest_cache/sase-visual
          if-no-files-found: ignore
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  visual-test:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install visual dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
          install-recipe: install-visual
      - name: Run visual tests
        run: just test-visual
      - name: Build visual failure report
        if: failure()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          tools/render_visual_snapshot_failure_report \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA"
      - name: Upload visual failure report
        id: visual_failure_report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ace-visual-failure-report
          path: .pytest_cache/sase-visual-report/visual-failure-report.html
          archive: false
          if-no-files-found: ignore
      - name: Publish visual failure report
        if: failure()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VISUAL_REPORT_URL: ${{ steps.visual_failure_report.outputs.artifact-url }}
        run: |
          tools/render_visual_snapshot_failure_report \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --report-url "$VISUAL_REPORT_URL"
          cat .pytest_cache/sase-visual-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          bash .pytest_cache/sase-visual-report/annotations.sh
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ace-visual-artifacts
          path: .pytest_cache/sase-visual
          if-no-files-found: ignore

  build:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Build and verify package
        run: just build-check

  # Bead backend gate for the `sase bead` Rust migration. The Rust repository
  # owns its cargo fmt/clippy/test gate; this lane keeps the focused Python
  # contracts and benchmark smoke against the shared wheel.
  bead-backend:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Run Python bead parity and CLI tests
        run: |
          .venv/bin/pytest \
            tests/test_bead \
            tests/test_core_facade/test_bead_read.py \
            tests/test_core_facade/test_bead_mutation.py
      - name: Run bead performance smoke
        run: just bead-perf-smoke
      - name: Upload bead performance smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bead-perf-smoke
          path: sdd/plans/202605/perf_artifacts/bead_perf_smoke.json

  # Phase 7E regression floor (sase-1e.5). Runs the stable subset of
  # Phase 7B core-operation benchmarks against the recorded
  # tests/perf/baselines/phase7_regression_floor.json and fails on a
  # regression. Slow/manual end-to-end TUI/home-tree measurements stay
  # outside this gate (see sdd/plans/202604/rust_backend_phase7_phase7e_handoff.md).
  phase7-perf-floor:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Run Phase 7E regression floor
        run: just phase7-perf-check
      - name: Upload floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-perf-floor-report
          path: sdd/plans/202604/perf_artifacts/rust_backend_phase7_floor_check.json

  # Phase 9 launch regression floor (sase-1r.9). Keeps the Rust-backed
  # launch path from drifting back toward the Phase 1 parent-side sleep
  # baseline while still using fake subprocesses/no LLM CLIs.
  launch-perf-floor:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Run launch regression floor
        run: just launch-perf-check
      - name: Upload launch floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-perf-floor-report
          path: sdd/plans/202605/perf_artifacts/agent_launch_regression_check.json

  # Agents-tab view-hints regression floor (sase-a5.6). Keeps the `v`
  # keypress-to-hint-bar path and the cached repeat/refresh paths below the
  # committed synchronous-render baseline.
  view-hints-perf-floor:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Run view-hints regression floor
        run: just view-hints-perf-check
      - name: Upload view-hints floor-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-hints-perf-floor-report
          path: sdd/plans/202607/perf_artifacts/view_hints_regression_check.json

  # Install smoke verifies that a fresh `sase` install resolves the
  # required `sase-core-rs` runtime dependency and that representative parser
  # and launch bindings work. Calls `sase core health` so the smoke matches
  # the CLI a user would run.
  install-smoke:
    needs: build-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup-sase
        with:
          python-version: '3.12'
      - name: Health check (Rust extension loadable)
        run: .venv/bin/sase core health --json

  # The editable install smoke above intentionally follows the run's shared
  # wheel. This separate lane installs the exact minimum accepted by SASE from
  # the package index, with no source checkout or dependency override.
  published-core-minimum-smoke:
    # The release-please PR branch only ever carries version/changelog bumps and
    # its merge triggers a full master-push run, so its CI is pure runner burn.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install exact published core minimum
        run: |
          core_minimum="$(python3 tools/smoke_sase_core_rs_telemetry --print-minimum pyproject.toml)"
          uv venv --python 3.12 /tmp/published-core-smoke
          uv pip install --python /tmp/published-core-smoke/bin/python "sase-core-rs==${core_minimum}"
      - name: Smoke all telemetry bindings
        run: /tmp/published-core-smoke/bin/python tools/smoke_sase_core_rs_telemetry
      - name: Check every required binding exists in the published minimum
        run: /tmp/published-core-smoke/bin/python tools/check_sase_core_rs_bindings
      - name: Smoke typed bead resolution round trip
        run: /tmp/published-core-smoke/bin/python tools/smoke_sase_core_rs_bead_resolution
      - name: Smoke plan-header binding round trip
        run: /tmp/published-core-smoke/bin/python tools/smoke_sase_core_rs_plan_header
