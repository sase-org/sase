name: Set up SASE
description: Install Python, just, and SASE with the run's prebuilt Rust core wheel.

inputs:
  python-version:
    description: Python version to install.
    required: true
  install-recipe:
    description: Just recipe used to install SASE dependencies.
    required: false
    default: install

runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      run: |
        curl --retry 5 --retry-all-errors -fsSL \
          https://github.com/casey/just/releases/download/1.50.0/just-1.50.0-x86_64-unknown-linux-musl.tar.gz \
          -o /tmp/just.tar.gz
        echo "27e011cd6328fadd632e59233d2cf5f18460b8a8c4269acd324c1a8669f34db0  /tmp/just.tar.gz" | sha256sum -c -
        tar -xzf /tmp/just.tar.gz -C /tmp just
        sudo install -m 0755 /tmp/just /usr/local/bin/just
        just --version
    - uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "**/pyproject.toml"
    - name: Set up Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv python install "$PYTHON_VERSION"
    - name: Download Rust core wheel
      uses: actions/download-artifact@v4
      with:
        name: sase-core-wheel
        path: ${{ runner.temp }}/sase-core-wheel
    - name: Install dependencies
      shell: bash
      env:
        CORE_ARTIFACT_DIR: ${{ runner.temp }}/sase-core-wheel
        INSTALL_RECIPE: ${{ inputs.install-recipe }}
      run: |
        mapfile -t wheels < <(find "$CORE_ARTIFACT_DIR" -type f -name '*.whl' -print)
        if [[ ${#wheels[@]} -ne 1 ]]; then
          echo "error: expected exactly one sase_core_rs wheel, found ${#wheels[@]}" >&2
          exit 1
        fi
        case "$INSTALL_RECIPE" in
          install|install-visual) ;;
          *)
            echo "error: unsupported install recipe: $INSTALL_RECIPE" >&2
            exit 2
            ;;
        esac
        echo "Using sase-core commit $(<"$CORE_ARTIFACT_DIR/sase-core-sha.txt")"
        # Export the wheel for the whole job, not just this step. Every later
        # step runs another `just` recipe, and every recipe re-enters `_setup`.
        # Without SASE_CORE_WHEEL set there, `_core-overrides-arg` emits no
        # overrides file and the editable install silently re-resolves
        # sase-core-rs back inside the published pyproject window, discarding
        # the wheel build-core built from sase-core master.
        echo "SASE_CORE_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
        SASE_CORE_WHEEL="${wheels[0]}" just "$INSTALL_RECIPE"
