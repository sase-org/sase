steps:
  - name: research
    parallel:
      - name: gemini_search
        agent: |
          %model:#pro
          <task>
          Find recent (2024-2026), medium-to-long articles or research papers that would help
          someone continue developing an AI agent orchestration toolkit called "sase" (Structured
          Agentic Software Engineering). This is a Python CLI tool for building, running, and
          orchestrating AI coding agents with features like workflow DSLs, multi-provider LLM
          support, TUI interfaces, and structured output parsing.

          Focus on topics like:
          - AI agent architectures and orchestration patterns
          - Multi-agent collaboration and coordination
          - LLM-powered developer tools and coding assistants
          - Structured output from LLMs
          - Agent evaluation and benchmarking
          - Prompt engineering for code generation

          For each recommendation, provide: title, author(s), URL, publication date, estimated
          reading time, and a 2-3 sentence summary of why it's relevant.
          </task>

      - name: claude_search
        agent: |
          %model:opus
          <task>
          Find recent (2024-2026), medium-to-long articles or research papers that would help
          someone continue developing an AI agent orchestration toolkit called "sase" (Structured
          Agentic Software Engineering). This is a Python CLI tool for building, running, and
          orchestrating AI coding agents with features like workflow DSLs, multi-provider LLM
          support, TUI interfaces, and structured output parsing.

          Focus on topics like:
          - AI agent architectures and orchestration patterns
          - Multi-agent collaboration and coordination
          - LLM-powered developer tools and coding assistants
          - Structured output from LLMs
          - Agent evaluation and benchmarking
          - Prompt engineering for code generation

          For each recommendation, provide: title, author(s), URL, publication date, estimated
          reading time, and a 2-3 sentence summary of why it's relevant.
          </task>

      - name: codex_search
        agent: |
          %model:#codex
          <task>
          Find recent (2024-2026), medium-to-long articles or research papers that would help
          someone continue developing an AI agent orchestration toolkit called "sase" (Structured
          Agentic Software Engineering). This is a Python CLI tool for building, running, and
          orchestrating AI coding agents with features like workflow DSLs, multi-provider LLM
          support, TUI interfaces, and structured output parsing.

          Focus on topics like:
          - AI agent architectures and orchestration patterns
          - Multi-agent collaboration and coordination
          - LLM-powered developer tools and coding assistants
          - Structured output from LLMs
          - Agent evaluation and benchmarking
          - Prompt engineering for code generation

          For each recommendation, provide: title, author(s), URL, publication date, estimated
          reading time, and a 2-3 sentence summary of why it's relevant.
          </task>

  - name: consolidate
    agent: |
      %model:opus
      You received reading recommendations from three different AI agents. Consolidate them into
      a single, de-duplicated list ranked by relevance.

      ## Gemini's recommendations:
      {{ research.gemini_search }}

      ## Claude's recommendations:
      {{ research.claude_search }}

      ## Codex's recommendations:
      {{ research.codex_search }}

      ## Instructions:
      1. Remove any duplicates (same article found by multiple agents).
      2. Rank the remaining articles by relevance to building an AI agent orchestration toolkit.
      3. For each article, note which agent(s) recommended it.
      4. At the end, select a single **"Best Next Read"** — the one article you'd recommend
         reading first, with a brief justification for why it's the most valuable starting point.
