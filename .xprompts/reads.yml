steps:
  - name: search
    parallel:
      - name: gemini
        agent: |
          %model:gemini-2.5-pro
          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase (Structured Agentic Software Engineering) — a Python toolkit for
          building and orchestrating AI agents.

          Focus areas: AI agent orchestration, LLM tool-use patterns, multi-agent workflows,
          prompt engineering for agentic systems, developer tooling for AI, TUI frameworks,
          and related topics.

          For each recommendation provide:
          - Title
          - Author(s)
          - URL (if available)
          - Publication date (or approximate)
          - A 1-2 sentence summary of why it's relevant

          List at least 5 recommendations, ordered by relevance.

      - name: claude
        agent: |
          %model:sonnet
          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase (Structured Agentic Software Engineering) — a Python toolkit for
          building and orchestrating AI agents.

          Focus areas: AI agent orchestration, LLM tool-use patterns, multi-agent workflows,
          prompt engineering for agentic systems, developer tooling for AI, TUI frameworks,
          and related topics.

          For each recommendation provide:
          - Title
          - Author(s)
          - URL (if available)
          - Publication date (or approximate)
          - A 1-2 sentence summary of why it's relevant

          List at least 5 recommendations, ordered by relevance.

      - name: codex
        agent: |
          %model:o3
          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase (Structured Agentic Software Engineering) — a Python toolkit for
          building and orchestrating AI agents.

          Focus areas: AI agent orchestration, LLM tool-use patterns, multi-agent workflows,
          prompt engineering for agentic systems, developer tooling for AI, TUI frameworks,
          and related topics.

          For each recommendation provide:
          - Title
          - Author(s)
          - URL (if available)
          - Publication date (or approximate)
          - A 1-2 sentence summary of why it's relevant

          List at least 5 recommendations, ordered by relevance.

  - name: consolidate
    agent: |
      Below are three lists of article/paper recommendations from different AI agents.
      Consolidate and de-duplicate them into a single list, then provide a single "best next
      read" recommendation with a brief justification.

      ## Gemini's recommendations

      {{ search.gemini._raw }}

      ## Claude's recommendations

      {{ search.claude._raw }}

      ## Codex's recommendations

      {{ search.codex._raw }}

      ## Instructions

      1. Merge all recommendations into one de-duplicated list, noting which agents recommended
         each item (if multiple did)
      2. Order by relevance to developing an AI agent orchestration toolkit
      3. At the end, provide a clearly marked "Best Next Read" section with your single top
         recommendation and a paragraph explaining why it should be read first
