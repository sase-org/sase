steps:
  - name: research
    parallel:
      - name: gemini_agent
        agent: |
          %model:#pro
          You are a research assistant helping a developer find valuable reading material.

          The project "sase" (Structured Agentic Software Engineering) is a Python toolkit for
          building and orchestrating AI agents. It features:
          - An xprompt workflow system (YAML-defined multi-step agent workflows with parallel execution)
          - A TUI (terminal UI) built with Textual for managing agents
          - LLM provider abstraction (Claude, Gemini, GPT/Codex)
          - VCS integration (git, mercurial)
          - A beads-based issue tracking system
          - Plugin architecture for extensibility

          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase. Focus on:
          - AI agent orchestration and multi-agent systems
          - Developer tooling and CLI/TUI design
          - LLM-powered code generation and software engineering
          - Workflow engines and task automation
          - Prompt engineering and prompt chaining

          For each article/paper, provide:
          - Title
          - Author(s)
          - URL or DOI
          - Publication date (or approximate)
          - A 2-3 sentence summary of why it's relevant to sase development

          Aim for 5-10 high-quality recommendations. Prefer recent publications (2024-2026).

      - name: claude_agent
        agent: |
          %model:sonnet
          You are a research assistant helping a developer find valuable reading material.

          The project "sase" (Structured Agentic Software Engineering) is a Python toolkit for
          building and orchestrating AI agents. It features:
          - An xprompt workflow system (YAML-defined multi-step agent workflows with parallel execution)
          - A TUI (terminal UI) built with Textual for managing agents
          - LLM provider abstraction (Claude, Gemini, GPT/Codex)
          - VCS integration (git, mercurial)
          - A beads-based issue tracking system
          - Plugin architecture for extensibility

          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase. Focus on:
          - AI agent orchestration and multi-agent systems
          - Developer tooling and CLI/TUI design
          - LLM-powered code generation and software engineering
          - Workflow engines and task automation
          - Prompt engineering and prompt chaining

          For each article/paper, provide:
          - Title
          - Author(s)
          - URL or DOI
          - Publication date (or approximate)
          - A 2-3 sentence summary of why it's relevant to sase development

          Aim for 5-10 high-quality recommendations. Prefer recent publications (2024-2026).

      - name: codex_agent
        agent: |
          %model:#gpt
          You are a research assistant helping a developer find valuable reading material.

          The project "sase" (Structured Agentic Software Engineering) is a Python toolkit for
          building and orchestrating AI agents. It features:
          - An xprompt workflow system (YAML-defined multi-step agent workflows with parallel execution)
          - A TUI (terminal UI) built with Textual for managing agents
          - LLM provider abstraction (Claude, Gemini, GPT/Codex)
          - VCS integration (git, mercurial)
          - A beads-based issue tracking system
          - Plugin architecture for extensibility

          Find recent, medium-to-long articles or research papers that will help me continue
          developing sase. Focus on:
          - AI agent orchestration and multi-agent systems
          - Developer tooling and CLI/TUI design
          - LLM-powered code generation and software engineering
          - Workflow engines and task automation
          - Prompt engineering and prompt chaining

          For each article/paper, provide:
          - Title
          - Author(s)
          - URL or DOI
          - Publication date (or approximate)
          - A 2-3 sentence summary of why it's relevant to sase development

          Aim for 5-10 high-quality recommendations. Prefer recent publications (2024-2026).

  - name: consolidate
    agent: |
      You are a research curator. Three different AI agents have independently searched for
      articles and research papers relevant to the "sase" project (a Python toolkit for building
      and orchestrating AI agents).

      Below are the three agents' findings. Your job is to:

      1. **Merge and de-duplicate**: Combine all recommendations, removing duplicates (same paper
         cited by multiple agents). When the same paper appears multiple times, merge the best
         parts of each description.

      2. **Rank by relevance**: Order the final list from most to least relevant to sase
         development.

      3. **Provide a single "Best Next Read" recommendation**: Pick the ONE article/paper from
         the consolidated list that would provide the most immediate, actionable value for
         continuing sase development. Explain why in 2-3 sentences.

      ---

      ## Gemini Agent Findings

      {{ research.gemini_agent._raw }}

      ---

      ## Claude Agent Findings

      {{ research.claude_agent._raw }}

      ---

      ## Codex Agent Findings

      {{ research.codex_agent._raw }}

      ---

      Format your response as:

      ## Best Next Read
      [Your single top recommendation with explanation]

      ## Consolidated Reading List
      [Numbered list of all unique articles/papers, ranked by relevance, with title, authors,
      URL/DOI, date, and summary for each]
