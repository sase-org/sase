wraps_all: true

input:
  - name: cl_name
    type: word
  - name: n
    type: int
    default: null
  - name: release
    type: bool
    default: null

steps:
  - name: setup
    python: |
      from sase.ace.changespec import find_all_changespecs
      from sase.running_field import (
          get_first_available_axe_workspace,
          get_workspace_directory_for_num,
          claim_workspace,
      )
      import os

      cl_name = {{ cl_name | tojson }}
      cs_match = None
      for cs in find_all_changespecs():
          if cs.name == cl_name:
              cs_match = cs
              break

      if cs_match:
          project_name = cs_match.project_basename
          project_file = cs_match.file_path
      else:
          # Fallback: project shorthand
          candidate = os.path.expanduser(f"~/.sase/projects/{cl_name}/{cl_name}.gp")
          if os.path.isfile(candidate):
              project_name = cl_name
              project_file = candidate
          else:
              raise RuntimeError(
                  f"'{cl_name}' not found as a ChangeSpec name or project"
              )

      n_input = {{ n | tojson }}
      if n_input is not None:
          workspace_num = n_input
      else:
          workspace_num = get_first_available_axe_workspace(project_file)

      release_input = {{ release | tojson }}
      if release_input is not None:
          should_release = release_input
      elif n_input is not None:
          should_release = False
      else:
          should_release = True

      workspace_dir, _ = get_workspace_directory_for_num(workspace_num, project_name)

      pid = os.getpid()
      workflow_name = f"hg-{cl_name}"
      claim_workspace(project_file, workspace_num, workflow_name, pid, cl_name, pinned=not should_release)

      print(f"project_name={project_name}")
      print(f"project_file={project_file}")
      print(f"workspace_dir={workspace_dir}")
      print(f"workspace_num={workspace_num}")
      print(f"_chdir={workspace_dir}")
      print(f"meta_workspace={workspace_num}")
      checkout_target = cl_name if cs_match else "p4head"

      if cs_match:
          print(f"meta_changespec={cl_name}")
      else:
          print(f"meta_project={cl_name}")
      print(f"checkout_target={checkout_target}")
      print(f"should_release={'true' if should_release else 'false'}")
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      should_release: bool

  - name: prepare
    bash: |
      sase_hg_clean "{{ cl_name }}-hg"
      sase_hg_update "{{ setup.checkout_target }}"
      echo "success=true"
    output: { success: bool }

  - name: inject
    prompt_part: ""

  - name: release
    if: "{{ setup.should_release }}"
    python: |
      from sase.running_field import release_workspace
      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"hg-{{ cl_name }}",
          {{ cl_name | tojson }},
      )
      print("released=true")
    output: { released: bool }
