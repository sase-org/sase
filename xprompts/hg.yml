wraps_all: true

input:
  - name: cl_name
    type: word
  - name: n
    type: int
    default: null
  - name: release
    type: bool
    default: true

steps:
  - name: setup
    python: |
      from sase.scripts.hg_setup import main
      main(
          cl_name={{ cl_name | tojson }},
          n={{ n | tojson }},
          release={{ release | tojson }},
      )
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      should_release: bool

  - name: prepare
    bash: |
      sase_hg_clean "{{ cl_name }}-hg"
      sase_hg_update "{{ setup.checkout_target }}"
      echo "success=true"
    output: { success: bool }

  - name: inject
    prompt_part: ""

  - name: release
    if: "{{ setup.should_release }}"
    python: |
      from sase.running_field import release_workspace
      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"hg-{{ cl_name }}",
          {{ cl_name | tojson }},
      )
      print("released=true")
    output: { released: bool }
