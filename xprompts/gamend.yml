input:
  - name: who
    type: line
    default: "man"
  - name: note
    type: line
    default: ""

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a git commit.

  - name: check_changes
    hidden: true
    python: |
      import os
      import sys
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))
      from sase.vcs_provider import get_vcs_provider
      provider = get_vcs_provider(os.getcwd())
      ok, changes = provider.has_local_changes(os.getcwd())
      has_changes = ok and changes is not None and len(changes) > 0
      print(f"has_changes={'true' if has_changes else 'false'}")
    output: { has_changes: bool }

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_amend_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: amend
    if: "{{ check_changes.has_changes }}"
    bash: |
      # Save diff before amending
      DIFF_FILE=$(mktemp /tmp/sase-gamend-XXXXXX.diff)
      git diff HEAD > "$DIFF_FILE" 2>/dev/null
      git ls-files --others --exclude-standard -z 2>/dev/null \
        | while IFS= read -r -d '' f; do
            git diff --no-index /dev/null "$f" 2>/dev/null
          done >> "$DIFF_FILE"

      # Stage all changes
      git add -A

      # Amend the previous commit
      NOTE="{{ note }}"
      if [ -n "$NOTE" ]; then
        git commit --amend -m "[{{ who }}] $NOTE" 2>&1
      else
        git commit --amend --no-edit 2>&1
      fi

      if [ $? -ne 0 ]; then
        echo "success=false"
        echo "error=git commit --amend failed"
        rm -f "$DIFF_FILE"
        exit 0
      fi

      # Force push with lease for safety
      for attempt in 1 2 3; do
        if git push --force-with-lease origin HEAD 2>&1; then
          break
        fi
        git pull --rebase --quiet 2>&1
      done

      SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "")
      echo "success=true"
      echo "short_sha=$SHA"
      if [ -s "$DIFF_FILE" ]; then
        echo "diff_path=$DIFF_FILE"
      else
        rm -f "$DIFF_FILE"
        echo "diff_path="
      fi
    output: { success: bool, short_sha: word, diff_path: path, error: text }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=amended"
      echo "message=Amended commit ({{ amend.short_sha | default('') }})"
      echo "meta_new_commit={{ amend.short_sha | default('') }}"
      echo "diff_path={{ amend.diff_path | default('') }}"
    output: { status: word, message: text, meta_new_commit: word, diff_path: path }
