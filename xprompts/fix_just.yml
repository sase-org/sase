description: Run just checks and launch targeted fixer agents for failing gates.

steps:
  - name: _just_install
    hidden: true
    bash: |
      just install

  - name: _just_fmt_check
    hidden: true
    bash: |
      if just fmt-check; then
        echo "success=true"
      else
        echo "success=false"
      fi
    output: { success: bool }

  - name: _just_lint
    hidden: true
    bash: |
      if just lint; then
        echo "success=true"
      elif just lint; then
        echo "success=true"
      else
        echo "success=false"
      fi
    output: { success: bool }

  - name: _just_test
    hidden: true
    bash: |
      if just test; then
        echo "success=true"
      elif just test; then
        echo "success=true"
      else
        echo "success=false"
      fi
    output: { success: bool }

  - name: decide_fixers
    hidden: true
    python: |
      fmt_success = {{ _just_fmt_check.success | tojson }}
      lint_success = {{ _just_lint.success | tojson }}
      test_success = {{ _just_test.success | tojson }}
      print(f"fmt_success={str(fmt_success).lower()}")
      print(f"lint_success={str(lint_success).lower()}")
      print(f"test_success={str(test_success).lower()}")
      print(f"launch_fmt={str(not fmt_success).lower()}")
      print(f"launch_linters={str(not lint_success).lower()}")
      print(f"launch_tests={str(not test_success).lower()}")
      branches = []
      if not fmt_success:
          branches.append("fix_fmt")
      if not lint_success:
          branches.append("fix_linters")
      if not test_success:
          branches.append("fix_tests")
      print(f"branches={', '.join(branches) if branches else '-'}")
      if not branches:
          print("reason=all_just_checks_passed")
    output:
      fmt_success: bool
      lint_success: bool
      test_success: bool
      launch_fmt: bool
      launch_linters: bool
      launch_tests: bool

  - name: fix_fmt
    if: "{{ decide_fixers.launch_fmt }}"
    bash: |
      just fmt
      git add -A
      if ! git diff --cached --quiet; then
        git commit -m "chore: run \`just fmt\`"
        git pull --rebase
        git push
      fi
      echo "fix_fmt=done"

  - name: fix_linters
    if: "{{ decide_fixers.launch_linters }}"
    agent: |
      #gh:sase #pr(fix_just_linters) Can you help me fix the `just lint` command?

  - name: fix_tests
    if: "{{ decide_fixers.launch_tests }}"
    agent: |
      #gh:sase #pr(fix_just_tests) Can you help me fix the `just test` command?
