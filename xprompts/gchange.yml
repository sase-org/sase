input:
  - name: name
    type: word
  - name: who
    type: line
    default: "man"
  - name: note
    type: line
    default: ""
  - name: wip
    type: bool
    default: true

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create a git branch, commit, or pull request.

  - name: check_changes
    hidden: true
    python: |
      import os
      import sys
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))
      from sase.vcs_provider import get_vcs_provider
      provider = get_vcs_provider(os.getcwd())
      ok, changes = provider.has_local_changes(os.getcwd())
      has_changes = ok and changes is not None and len(changes) > 0
      print(f"has_changes={'true' if has_changes else 'false'}")
    output: { has_changes: bool }

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_change_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: create_branch
    if: "{{ check_changes.has_changes }}"
    bash: |
      BRANCH_NAME="{{ name }}"

      CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
      if [ "$CURRENT_BRANCH" = "$BRANCH_NAME" ]; then
        echo "success=true"
        echo "branch=$BRANCH_NAME"
        exit 0
      fi

      # Create and switch to new branch
      if git checkout -b "$BRANCH_NAME" 2>&1; then
        echo "success=true"
        echo "branch=$BRANCH_NAME"
      else
        echo "success=false"
        echo "error=Failed to create branch $BRANCH_NAME"
      fi
    output: { success: bool, branch: word, error: text }

  - name: commit
    if: "{{ check_changes.has_changes and create_branch.success | default(false) }}"
    bash: |
      sase_commit_workflow \
        --who "{{ who }}" \
        --note "{{ note }}" \
        --data-file "{{ save_response.data_file }}"
    output: { success: bool, entry_id: word, cl_name: word, diff_path: path, error: text }

  - name: create_changespec
    if: "{{ check_changes.has_changes and commit.success | default(false) }}"
    python: |
      import json
      import os
      import subprocess
      import sys
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))

      from sase.vcs_provider import get_vcs_provider
      from sase.workspace_changespec import create_changespec_for_workflow
      from sase.workflow_utils import get_project_file_path

      # Get project name
      provider = get_vcs_provider(os.getcwd())
      ok, project_name = provider.get_workspace_name(os.getcwd())
      if not ok or not project_name:
          print("success=false")
          print("error=Could not determine project name")
          sys.exit(0)

      project_file = get_project_file_path(project_name)

      # Load prompt/response from saved data file
      data_file = {{ save_response.data_file | tojson }}
      with open(data_file, 'r') as f:
          data = json.load(f)

      branch_name = {{ create_branch.branch | tojson }}

      # Get the default branch as checkout target
      default_branch = "master"
      try:
          result = subprocess.run(
              ["git", "symbolic-ref", "refs/remotes/origin/HEAD"],
              capture_output=True, text=True, check=False,
          )
          if result.returncode == 0:
              default_branch = result.stdout.strip().rsplit("/", 1)[-1]
      except Exception:
          pass

      checkout_target = f"origin/{default_branch}"

      # Derive cl_name from project + branch
      cl_name = f"{project_name}_{branch_name.replace('-', '_')}"

      {% if wip %}
      status = "WIP"
      {% else %}
      status = "Draft"
      {% endif %}

      cs_name = create_changespec_for_workflow(
          project_name=project_name,
          project_file=project_file,
          checkout_target=checkout_target,
          branch_name=branch_name,
          prompt=data["prompt"],
          response=data["response"],
          workflow_name="gchange",
          cl_url=None,
          cl_name=cl_name,
          status=status,
      )

      if cs_name:
          print(f"success=true")
          print(f"changespec_name={cs_name}")
      else:
          print("success=false")
          print("error=Failed to create ChangeSpec")
    output: { success: bool, changespec_name: word, error: text }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=created"
      echo "message=Created change on branch {{ create_branch.branch | default('') }}{{ ' — ChangeSpec: ' ~ create_changespec.changespec_name if create_changespec.changespec_name else '' }}"
      echo "meta_new_change={{ create_branch.branch | default('') }}"
      echo "diff_path={{ commit.diff_path | default('') }}"
    output: { status: word, message: text, meta_new_change: line, diff_path: path }
