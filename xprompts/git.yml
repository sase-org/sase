wraps_all: true

input:
  - name: git_ref
    type: word
  - name: n
    type: int
    default: null
  - name: release
    type: bool
    default: true

steps:
  - name: setup
    python: |
      from sase.git_workspace import resolve_git_ref
      from sase.gh_workspace import ensure_git_clone
      from sase.running_field import (
          get_first_available_axe_workspace,
          claim_workspace,
      )
      import os

      git_ref = {{ git_ref | tojson }}
      resolved = resolve_git_ref(git_ref)

      project_name = resolved.project_name
      project_file = resolved.project_file

      n_input = {{ n | tojson }}

      # Check if workspace was pre-allocated by the TUI
      if os.environ.get("SASE_GIT_PRE_ALLOCATED") == "1":
          workspace_num = int(os.environ["SASE_GIT_WORKSPACE_NUM"])
          workspace_dir = os.environ["SASE_GIT_WORKSPACE_DIR"]
      elif n_input is not None:
          workspace_num = n_input
          workspace_dir = ensure_git_clone(resolved.primary_workspace_dir, workspace_num)
      else:
          workspace_num = get_first_available_axe_workspace(project_file)
          workspace_dir = ensure_git_clone(resolved.primary_workspace_dir, workspace_num)

      should_release = {{ release | tojson }}

      pid = os.getpid()
      workflow_name = f"git-{git_ref}"
      claim_workspace(project_file, workspace_num, workflow_name, pid, resolved.branch_name, pinned=not should_release)

      print(f"project_name={project_name}")
      print(f"project_file={project_file}")
      print(f"workspace_dir={workspace_dir}")
      print(f"workspace_num={workspace_num}")
      print(f"checkout_target={resolved.checkout_target}")
      print(f"primary_workspace_dir={resolved.primary_workspace_dir}")
      should_create_branch = resolved.branch_name is None
      branch_name = resolved.branch_name or ""
      print(f"should_create_branch={'true' if should_create_branch else 'false'}")
      print(f"branch_name={branch_name}")
      print(f"should_release={'true' if should_release else 'false'}")
      print(f"_chdir={workspace_dir}")
      print(f"meta_workspace={workspace_num}")
      print(f"meta_changespec={branch_name}")
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      primary_workspace_dir: path
      should_create_branch: bool
      branch_name: word
      should_release: bool

  - name: prepare
    bash: |
      # Save diff backup if workspace is dirty
      if ! git diff --quiet HEAD 2>/dev/null; then
        git diff HEAD > "/tmp/git-workspace-backup-$(date +%s).patch"
      fi
      git checkout . && git clean -fd
      git fetch --quiet

      if [ "{{ setup.should_create_branch }}" = "true" ]; then
        BRANCH_NAME="{{ setup.branch_name }}"
        CHECKOUT_TARGET="{{ setup.checkout_target }}"

        if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME" 2>/dev/null; then
          git checkout "$BRANCH_NAME" --quiet
        elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME" 2>/dev/null; then
          git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME" --quiet
        else
          # New branch — create from checkout target, push to set upstream
          git checkout -b "$BRANCH_NAME" "$CHECKOUT_TARGET" --quiet
          git push -u origin "$BRANCH_NAME" --quiet
          echo "success=true"
          exit 0
        fi

        # Sync existing branch with master
        if ! git merge "$CHECKOUT_TARGET" --no-edit --quiet 2>&1; then
          git merge --abort
          echo '{"notes": ["Merge conflict syncing {{ setup.branch_name }} with {{ setup.checkout_target }} in workspace #{{ setup.workspace_num }}"]}' \
            | sase notify --sender git-workflow
          echo "success=false"
          exit 1
        fi

        # Push to ensure upstream is set (for ccommit's `git push`)
        git push -u origin "$BRANCH_NAME" --quiet 2>/dev/null || git push --set-upstream origin "$BRANCH_NAME" --quiet
      else
        git checkout --detach {{ setup.checkout_target }} --quiet
      fi

      echo "success=true"
    output: { success: bool }

  - name: inject
    prompt_part: ""

  - name: create_changespec
    if: "{{ setup.should_create_branch }}"
    hidden: true
    python: |
      from sase.workspace_changespec import create_changespec_for_workflow

      # Build CL name from branch name (e.g., "calm-elm" -> "sase_calm_elm")
      cl_name = None
      if {{ setup.should_create_branch | tojson }}:
          safe = {{ setup.branch_name | tojson }}.replace("-", "_")
          cl_name = f"{{ setup.project_name }}_{safe}"

      result = create_changespec_for_workflow(
          project_name={{ setup.project_name | tojson }},
          project_file={{ setup.project_file | tojson }},
          checkout_target={{ setup.checkout_target | tojson }},
          branch_name={{ setup.branch_name | tojson }},
          prompt={{ _prompt | tojson }},
          response={{ _response | tojson }},
          workflow_name="git-{{ git_ref }}",
          cl_name=cl_name,
      )

      if result:
          print(f"changespec_name={result}")
          print(f"meta_changespec={result}")
      else:
          print("changespec_name=")
    output: { changespec_name: word }

  - name: release
    if: "{{ setup.should_release }}"
    python: |
      from sase.running_field import release_workspace

      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"git-{{ git_ref }}",
          {{ git_ref | tojson }} if "/" not in {{ git_ref | tojson }} else None,
      )
      print("released=true")
    output: { released: bool }
