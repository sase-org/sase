wraps_all: true

input:
  - name: git_ref
    type: word
  - name: n
    type: int
    default: null
  - name: release
    type: bool
    default: true

steps:
  - name: setup
    python: |
      from sase.scripts.git_setup import main
      main(
          git_ref={{ git_ref | tojson }},
          n={{ n | tojson }},
          release={{ release | tojson }},
      )
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      primary_workspace_dir: path
      should_release: bool

  - name: prepare
    bash: |
      # Save diff backup if workspace is dirty
      if ! git diff --quiet HEAD 2>/dev/null; then
        git diff HEAD > "/tmp/git-workspace-backup-$(date +%s).patch"
      fi
      git checkout . && git clean -fd
      git fetch --quiet
      git pull --rebase --quiet 2>&1 || true
      echo "head_before=$(git rev-parse HEAD)"
      echo "success=true"
    output: { success: bool, head_before: word }

  - name: inject
    prompt_part: ""

  - name: release
    if: "{{ setup.should_release }}"
    python: |
      from sase.running_field import release_workspace

      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"git-{{ git_ref }}",
          {{ git_ref | tojson }} if "/" not in {{ git_ref | tojson }} else None,
      )
      print("released=true")
    output: { released: bool }

  - name: diff
    bash: |
      head_before="{{ prepare.head_before }}"
      if [ -z "$head_before" ]; then
        exit 0
      fi
      head_now=$(git rev-parse HEAD)
      diff_file=$(mktemp /tmp/sase-git-XXXXXX.diff)
      if [ "$head_now" != "$head_before" ]; then
        # Commits were made — show only the last commit's diff
        git diff HEAD~1 HEAD > "$diff_file" 2>/dev/null
      else
        # No commits — show uncommitted changes
        git diff HEAD > "$diff_file" 2>/dev/null
      fi
      if [ -s "$diff_file" ]; then
        echo "diff_path=$diff_file"
      else
        rm -f "$diff_file"
      fi
    output: { diff_path: path }
