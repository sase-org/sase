input:
  limits: { type: text, default: "1000 850 700" }
steps:
  - name: launch_split_agents
    hidden: true
    python: |
      import subprocess
      from pathlib import Path

      from sase.agent.launcher import launch_agent_from_cwd
      from sase.agent.multi_prompt import build_wait_chained_multi_prompt
      from sase.agent.names import is_name_reserved

      limits = "{{ limits }}".split()

      files: list[str] = []
      for tree in ("src", "tests"):
          result = subprocess.run(
              ["tools/pylimit_files-260227", tree, *limits],
              capture_output=True,
              text=True,
              check=False,
          )
          files.extend(line.strip() for line in result.stdout.splitlines() if line.strip())

      unique_files = list(dict.fromkeys(files))

      if not unique_files:
          print("launched=0")
      else:
          claimed: set[str] = set()
          per_file_prompts: list[str] = []
          for path in unique_files:
              base = f"pysplit.{Path(path).stem}"
              candidate = base
              n = 1
              while candidate in claimed or is_name_reserved(candidate):
                  n += 1
                  candidate = f"{base}-{n}"
              claimed.add(candidate)
              per_file_prompts.append(
                  f"%name:{candidate}\n#gh:sase %group:chop %approve #sase/pysplit:{path}"
              )
          multi_prompt = build_wait_chained_multi_prompt(per_file_prompts)
          launch_agent_from_cwd(multi_prompt)
          print(f"launched={len(unique_files)}")
    output: { launched: int }
