description: Launch split agents for Python files that exceed line-count limits.
hidden: true

input:
  limits:
    type: text
    default: "1000 850 700"
    description: Space-separated line-count thresholds passed to the Python file scanner.
steps:
  - name: launch_split_agents
    hidden: true
    python: |
      import subprocess
      import sys
      from pathlib import Path

      from sase.agent.launcher import launch_agent_from_cwd
      from sase.agent.names import is_name_reserved

      limits = "{{ limits }}".split()
      print(f"limits={' '.join(limits)}")

      def _build_wait_chained_multi_prompt(prompts: list[str]) -> str:
          cleaned = [p.strip() for p in prompts if p and p.strip()]
          if not cleaned:
              return ""
          segments = [cleaned[0]] + [f"%wait\n{p}" for p in cleaned[1:]]
          return "\n---\n".join(segments)

      files: list[str] = []
      toolong = Path(sys.executable).parent / "toolong"
      for tree in ("src", "tests"):
          result = subprocess.run(
              [str(toolong), "--files-only", tree, *limits],
              capture_output=True,
              text=True,
              check=False,
          )
          files.extend(line.strip() for line in result.stdout.splitlines() if line.strip())

      unique_files = list(dict.fromkeys(files))
      print("scanned_trees=src,tests")
      print(f"file_count={len(unique_files)}")
      print(f"sample_files={', '.join(unique_files[:5]) if unique_files else '-'}")

      if not unique_files:
          print("launched=0")
          print("reason=no_files_over_limits")
      else:
          claimed: set[str] = set()
          per_file_prompts: list[str] = []
          launched_names: list[str] = []
          for path in unique_files:
              base = f"split_file.{Path(path).stem}"
              candidate = base
              n = 1
              while candidate in claimed or is_name_reserved(candidate):
                  n += 1
                  candidate = f"{base}_{n}"
              claimed.add(candidate)
              launched_names.append(candidate)
              per_file_prompts.append(
                  f"%name:{candidate}\n#m_codex\n#gh:sase %group:chop %auto #split_file:{path}"
              )
          multi_prompt = _build_wait_chained_multi_prompt(per_file_prompts)
          launch_agent_from_cwd(multi_prompt)
          print(f"launched={len(unique_files)}")
          print(f"launched_names={', '.join(launched_names[:8])}")
    output:
      launched: int
      file_count: int
