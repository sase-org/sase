input:
  - name: path
    type: path

steps:
  - name: load_history
    hidden: true
    python: |
      import json
      from sase.chat_history import load_chat_history
      history = load_chat_history({{ path | tojson }}, increment_headings=True)
      print(json.dumps({"previous_history": history}))
    output: { previous_history: text }

  - name: inject
    prompt_part: |
      # Previous Conversation

      {{ load_history.previous_history }}

      ---

      # New Query

