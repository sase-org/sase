input:
  - name: name
    type: word
  - name: bug_id
    type: int
    default: 0
  - name: wip
    type: bool
    default: false

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create/amend a CL.

  - name: check_changes
    hidden: true
    python: |
      import os
      import sys
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))
      from sase.vcs_provider import get_vcs_provider
      provider = get_vcs_provider(os.getcwd())
      ok, changes = provider.has_local_changes(os.getcwd())
      has_changes = ok and changes is not None and len(changes) > 0
      print(f"has_changes={'true' if has_changes else 'false'}")
    output: { has_changes: bool }

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_commit_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: check_sase_new_cl_desc
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import sys, os
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))
      try:
          from xprompt.loader import get_all_xprompts
          has = 'sase_new_cl_desc' in get_all_xprompts()
      except Exception:
          has = False
      print(f"has_sase_new_cl_desc={'true' if has else 'false'}")
    output: { has_sase_new_cl_desc: bool }

  - name: gen_cl_desc
    if: "{{ check_changes.has_changes and check_sase_new_cl_desc.has_sase_new_cl_desc }}"
    prompt: "#sase_new_cl_desc #file:new_cl_desc"
    output: { desc_file: path }

  - name: create_cl
    if: "{{ check_changes.has_changes }}"
    bash: |
      sase_cl_workflow --create \
        --name "{{ name }}" \
        --bug-id "{{ bug_id }}" \
        {% if wip %}--wip{% endif %} \
        --data-file "{{ save_response.data_file }}" \
        --generated-desc-file "{{ gen_cl_desc.desc_file | default('') }}"
    output: { success: bool, cl_url: line, full_cl_name: word, diff_path: path, error: text }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=created"
      echo "message=Created CL {{ create_cl.full_cl_name | default('') }}: {{ create_cl.cl_url | default('') }}"
      echo "meta_new_cl={{ create_cl.full_cl_name | default('') }} ({{ create_cl.cl_url | default('') }})"
      echo "diff_path={{ create_cl.diff_path | default('') }}"
    output: { status: word, message: text, meta_new_cl: line, diff_path: path }
