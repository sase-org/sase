input:
  - name: who
    type: line
    default: "man"
  - name: note
    type: line
    default: ""

steps:
  - name: inject
    prompt_part: |
      ---
      IMPORTANT: You should make the necessary file changes, but should NOT create/amend a CL. #cldd

  - name: check_changes
    hidden: true
    python: |
      import os
      import sys
      sys.path.insert(0, os.path.join(os.path.expanduser('~'), 'lib', 'sase', 'src'))
      from sase.vcs_provider import get_vcs_provider
      provider = get_vcs_provider(os.getcwd())
      ok, changes = provider.has_local_changes(os.getcwd())
      has_changes = ok and changes is not None and len(changes) > 0
      print(f"has_changes={'true' if has_changes else 'false'}")
    output: { has_changes: bool }

  - name: detect_branch
    if: "{{ check_changes.has_changes }}"
    hidden: true
    python: |
      import subprocess
      result = subprocess.run(
          ["git", "rev-parse", "--abbrev-ref", "HEAD"],
          capture_output=True, text=True, check=False
      )
      branch = result.stdout.strip() if result.returncode == 0 else "master"
      is_pr_branch = branch not in ("master", "main", "HEAD")
      print(f"branch={branch}")
      print(f"is_pr_branch={'true' if is_pr_branch else 'false'}")
    output: { branch: word, is_pr_branch: bool }

  - name: save_response
    hidden: true
    if: "{{ check_changes.has_changes }}"
    python: |
      import tempfile
      import json
      prompt = {{ _prompt | tojson }}
      response = {{ _response | tojson }}
      with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='sase_amend_', delete=False) as f:
          json.dump({"prompt": prompt, "response": response}, f)
          print(f"data_file={f.name}")
    output: { data_file: path }

  - name: amend
    if: "{{ check_changes.has_changes }}"
    bash: |
      sase_commit_workflow \
        --who "{{ who }}" \
        --note "{{ note }}" \
        --data-file "{{ save_response.data_file }}"
    output: { success: bool, entry_id: word, cl_name: word, diff_path: path, error: text }

  - name: update_pr
    if: |
      {{ check_changes.has_changes and amend.success | default(false) and detect_branch.is_pr_branch | default(false) }}
    hidden: true
    bash: |
      PR_NUMBER=$(gh pr view --json number --jq '.number' 2>/dev/null || echo "")
      if [ -z "$PR_NUMBER" ]; then
        echo "updated=false"
        exit 0
      fi
      CURRENT_BODY=$(gh pr view --json body --jq '.body' 2>/dev/null || echo "")
      COMMIT_NOTE="{{ amend.entry_id | default('?') }}: {{ who }} - $(date '+%Y-%m-%d %H:%M')"
      NEW_BODY="${CURRENT_BODY}

      ---
      **Update (${COMMIT_NOTE})**"
      gh pr edit "$PR_NUMBER" --body "$NEW_BODY" 2>/dev/null && echo "updated=true" || echo "updated=false"
    output: { updated: bool }

  - name: report
    if: "{{ check_changes.has_changes }}"
    hidden: true
    bash: |
      echo "status=amended"
      if [ -n "{{ amend.cl_name | default('') }}" ]; then
        echo "message=Amended CL {{ amend.cl_name }} with COMMITS entry ({{ amend.entry_id | default('') }})"
      else
        echo "message=Committed to master ({{ amend.entry_id | default('') }})"
      fi
      echo "meta_new_commit={{ amend.entry_id | default('') }}"
      echo "diff_path={{ amend.diff_path | default('') }}"
    output: { status: word, message: text, meta_new_commit: word, diff_path: path }
