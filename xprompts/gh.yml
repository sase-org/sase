wraps_all: true

input:
  - name: gh_ref
    type: word
  - name: n
    type: int
    default: null
  - name: release
    type: bool
    default: true

steps:
  - name: setup
    python: |
      from sase.gh_workspace import resolve_gh_ref, ensure_git_clone
      from sase.running_field import (
          get_first_available_axe_workspace,
          claim_workspace,
      )
      import os

      gh_ref = {{ gh_ref | tojson }}
      resolved = resolve_gh_ref(gh_ref)

      project_name = resolved.project_name
      project_file = resolved.project_file

      n_input = {{ n | tojson }}

      # Check if workspace was pre-allocated by the TUI
      if os.environ.get("SASE_GH_PRE_ALLOCATED") == "1":
          workspace_num = int(os.environ["SASE_GH_WORKSPACE_NUM"])
          workspace_dir = os.environ["SASE_GH_WORKSPACE_DIR"]
      elif n_input is not None:
          workspace_num = n_input
          workspace_dir = ensure_git_clone(resolved.primary_workspace_dir, workspace_num)
      else:
          workspace_num = get_first_available_axe_workspace(project_file)
          workspace_dir = ensure_git_clone(resolved.primary_workspace_dir, workspace_num)

      should_release = {{ release | tojson }}

      pid = os.getpid()
      workflow_name = f"gh-{gh_ref}"
      claim_workspace(project_file, workspace_num, workflow_name, pid, None, pinned=not should_release)

      print(f"project_name={project_name}")
      print(f"project_file={project_file}")
      print(f"workspace_dir={workspace_dir}")
      print(f"workspace_num={workspace_num}")
      print(f"checkout_target={resolved.checkout_target}")
      print(f"primary_workspace_dir={resolved.primary_workspace_dir}")
      print(f"should_release={'true' if should_release else 'false'}")
      print(f"_chdir={workspace_dir}")
      print(f"meta_workspace={workspace_num}")
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      primary_workspace_dir: path
      should_release: bool

  - name: prepare
    bash: |
      # Save diff backup if workspace is dirty
      if ! git diff --quiet HEAD 2>/dev/null; then
        git diff HEAD > "/tmp/gh-workspace-backup-$(date +%s).patch"
      fi
      git checkout . && git clean -fd
      git fetch --quiet
      git pull --rebase --quiet 2>&1 || true
      echo "head_before=$(git rev-parse HEAD)"
      echo "success=true"
    output: { success: bool, head_before: word }

  - name: inject
    prompt_part: ""

  - name: release
    if: "{{ setup.should_release }}"
    python: |
      from sase.running_field import release_workspace

      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"gh-{{ gh_ref }}",
          {{ gh_ref | tojson }} if "/" not in {{ gh_ref | tojson }} else None,
      )
      print("released=true")
    output: { released: bool }

  - name: diff
    bash: |
      head_before="{{ prepare.head_before }}"
      if [ -z "$head_before" ]; then
        exit 0
      fi
      head_now=$(git rev-parse HEAD)
      diff_file=$(mktemp /tmp/sase-gh-XXXXXX.diff)
      if [ "$head_now" != "$head_before" ]; then
        # Commits were made — show only the last commit's diff
        git diff HEAD~1 HEAD > "$diff_file" 2>/dev/null
      else
        # No commits — show uncommitted changes
        git diff HEAD > "$diff_file" 2>/dev/null
      fi
      if [ -s "$diff_file" ]; then
        echo "diff_path=$diff_file"
      else
        rm -f "$diff_file"
      fi
    output: { diff_path: path }
