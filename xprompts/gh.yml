wraps_all: true

input:
  - name: gh_ref
    type: word

steps:
  - name: setup
    python: |
      from sase.gh_workspace import resolve_gh_ref, ensure_git_worktree
      from sase.running_field import (
          get_first_available_axe_workspace,
          claim_workspace,
      )
      import os

      gh_ref = {{ gh_ref | tojson }}
      resolved = resolve_gh_ref(gh_ref)

      project_name = resolved.project_name
      project_file = resolved.project_file

      # Check if workspace was pre-allocated by the TUI
      if os.environ.get("SASE_GH_PRE_ALLOCATED") == "1":
          workspace_num = int(os.environ["SASE_GH_WORKSPACE_NUM"])
          workspace_dir = os.environ["SASE_GH_WORKSPACE_DIR"]
      else:
          workspace_num = get_first_available_axe_workspace(project_file)
          workspace_dir = ensure_git_worktree(resolved.primary_workspace_dir, workspace_num)

      pid = os.getpid()
      workflow_name = f"gh-{gh_ref}"
      claim_workspace(project_file, workspace_num, workflow_name, pid, resolved.branch_name)

      print(f"project_name={project_name}")
      print(f"project_file={project_file}")
      print(f"workspace_dir={workspace_dir}")
      print(f"workspace_num={workspace_num}")
      print(f"checkout_target={resolved.checkout_target}")
      print(f"primary_workspace_dir={resolved.primary_workspace_dir}")
      should_create_branch = resolved.branch_name is None
      print(f"should_create_branch={'true' if should_create_branch else 'false'}")
      print(f"_chdir={workspace_dir}")
      print(f"meta_workspace={workspace_num}")
      print(f"meta_changespec={resolved.branch_name}")
    output:
      project_name: word
      project_file: path
      workspace_dir: path
      workspace_num: int
      checkout_target: word
      primary_workspace_dir: path
      should_create_branch: bool

  - name: prepare
    bash: |
      # Save diff backup if workspace is dirty
      if ! git diff --quiet HEAD 2>/dev/null; then
        git diff HEAD > "/tmp/gh-workspace-backup-$(date +%s).patch"
      fi
      git checkout . && git clean -fd
      git fetch --quiet

      if [ "{{ setup.should_create_branch }}" = "true" ]; then
        BRANCH_NAME="agent_{{ setup.workspace_num }}"
        CHECKOUT_TARGET="{{ setup.checkout_target }}"

        if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME" 2>/dev/null; then
          git checkout "$BRANCH_NAME" --quiet
        elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME" 2>/dev/null; then
          git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME" --quiet
        else
          # New branch — create from checkout target, push to set upstream
          git checkout -b "$BRANCH_NAME" "$CHECKOUT_TARGET" --quiet
          git push -u origin "$BRANCH_NAME" --quiet
          echo "success=true"
          exit 0
        fi

        # Sync existing branch with master
        if ! git merge "$CHECKOUT_TARGET" --no-edit --quiet 2>&1; then
          git merge --abort
          echo '{"notes": ["Merge conflict syncing agent_{{ setup.workspace_num }} with {{ setup.checkout_target }} in workspace #{{ setup.workspace_num }}"]}' \
            | sase notify --sender gh-workflow
          echo "success=false"
          exit 1
        fi

        # Push to ensure upstream is set (for ccommit's `git push`)
        git push -u origin "$BRANCH_NAME" --quiet 2>/dev/null || git push --set-upstream origin "$BRANCH_NAME" --quiet
      else
        git checkout --detach {{ setup.checkout_target }} --quiet
      fi

      echo "success=true"
    output: { success: bool }

  - name: inject
    prompt_part: ""

  - name: create_pr
    bash: |
      if [ "{{ setup.should_create_branch }}" != "true" ]; then
        echo "pr_url=skipped"
        exit 0
      fi

      BRANCH_NAME="agent_{{ setup.workspace_num }}"
      CHECKOUT_TARGET="{{ setup.checkout_target }}"
      DEFAULT_BRANCH="${CHECKOUT_TARGET#origin/}"

      # Check if there are commits ahead of the default branch
      AHEAD=$(git rev-list --count "origin/$DEFAULT_BRANCH".."$BRANCH_NAME" 2>/dev/null || echo "0")
      if [ "$AHEAD" = "0" ]; then
        echo "pr_url=no_changes"
        exit 0
      fi

      # Check if PR already exists for this branch
      EXISTING_PR=$(gh pr view "$BRANCH_NAME" --json url --jq '.url' 2>/dev/null || echo "")
      if [ -n "$EXISTING_PR" ]; then
        echo "pr_url=$EXISTING_PR"
        exit 0
      fi

      # Use first commit message as PR title
      PR_TITLE=$(git log --format='%s' "origin/$DEFAULT_BRANCH".."$BRANCH_NAME" | tail -1)
      if [ -z "$PR_TITLE" ]; then
        PR_TITLE="Agent changes from workspace #{{ setup.workspace_num }}"
      fi

      PR_URL=$(gh pr create \
        --base "$DEFAULT_BRANCH" \
        --head "$BRANCH_NAME" \
        --title "$PR_TITLE" \
        --body "Automated PR from sase ace agent run." 2>&1) || true
      echo "pr_url=${PR_URL:-failed}"
    output: { pr_url: line }

  - name: create_changespec
    if: "{{ setup.should_create_branch }}"
    hidden: true
    python: |
      from sase.workspace_changespec import create_changespec_for_workflow

      pr_url = {{ create_pr.pr_url | tojson }}
      cl_url = pr_url if pr_url.startswith("http") else None

      result = create_changespec_for_workflow(
          project_name={{ setup.project_name | tojson }},
          project_file={{ setup.project_file | tojson }},
          checkout_target={{ setup.checkout_target | tojson }},
          workspace_num={{ setup.workspace_num }},
          prompt={{ _prompt | tojson }},
          response={{ _response | tojson }},
          workflow_name="gh-{{ gh_ref }}",
          cl_url=cl_url,
      )

      if result:
          print(f"changespec_name={result}")
          print(f"meta_changespec={result}")
      else:
          print("changespec_name=")
    output: { changespec_name: word }

  - name: release
    python: |
      from sase.running_field import release_workspace

      release_workspace(
          {{ setup.project_file | tojson }},
          {{ setup.workspace_num }},
          f"gh-{{ gh_ref }}",
          {{ gh_ref | tojson }} if "/" not in {{ gh_ref | tojson }} else None,
      )
      print("released=true")
    output: { released: bool }
