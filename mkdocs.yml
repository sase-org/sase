site_name: SASE
site_description: Structured Agentic Software Engineering
site_url: https://sase.sh/
site_author: SASE contributors
repo_url: https://github.com/sase-org/sase
repo_name: sase-org/sase
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

nav:
  - Home: index.md
  - The Basics:
      - Initialization: init.md
      - ACE TUI: ace.md
      - AXE Automation: axe.md
      - Spec-Driven Development: sdd.md
      - XPrompts: xprompt.md
  - Beyond the Basics:
      - Architecture: architecture.md
      - ChangeSpecs: change_spec.md
      - Beads: beads.md
      - Workflows: workflow_spec.md
      - Workspaces: workspace.md
      - Mentors: mentors.md
  - The Nitty Gritty:
      - Commit Workflows: commit_workflows.md
      - Notifications: notifications.md
      - Mobile Gateway: mobile_gateway.md
      - Mobile MVP Runbook: mobile_mvp_runbook.md
      - Performance Runbook: perf_runbook.md
      - Telemetry: telemetry.md
      - Agent Revival Log: troubleshooting/agent-revival.md
  - Integrations:
      - Editor Integration: editor.md
      - Integration APIs: integrations.md
      - Plugins: plugins.md
      - LLM Providers: llms.md
      - VCS Providers: vcs.md
      - Rust Backend: rust_backend.md
  - Reference:
      - CLI Reference: cli.md
      - Development: development.md
      - Configuration: configuration.md
      - Query Language: query_language.md
      - ProjectSpec: project_spec.md
      - Agent Attachments: agent_images.md
      - Acknowledgements: acknowledgements.md
  - Blog:
      - Blog Home: blog/index.md
      - SASE Blog Series: series/agentic-software-engineering.md
      - "[00] Origin Story — Where SASE Came From": blog/posts/origin-story.md
      - "[01] Why Coding Agents Need Orchestration": blog/posts/why-coding-agents-need-orchestration.md
      - "[02] Hello, SASE — Your First 15 Minutes Orchestrating Coding Agents": blog/posts/hello-sase-your-first-15-minutes.md
      - "[03] XPrompts in Depth — From One File to Full Workflows": blog/posts/xprompts-in-depth.md
      - "[04] AXE — The Background Daemon That Keeps Agent Work Moving": blog/posts/axe-background-daemon.md
      - "[05] Beads and SDD — Planning Multi-Agent Work That Actually Lands": blog/posts/beads-and-sdd.md
      - "[06] Commit Workflows — The Pluggable Path From Diff to PR": blog/posts/commit-workflows-plugins.md
      - "[07] ChangeSpecs in Practice — Review State Outside the Chat": blog/posts/changespecs-in-practice.md
      - "[08] Driving SASE From Your Phone — Telegram as the Mobile Control Surface": blog/posts/telegram-mobile-agents.md
      - "[09] Where You Type — The Prompt Input Widget and sase-nvim": blog/posts/prompt-widget-and-nvim.md
      - "[10] What's Next — Shared Memory, Mobile, and the Web Surface": blog/posts/whats-next-memory-mobile-web.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sase-org/sase
      name: SASE on GitHub

copyright: Copyright &copy; 2026 SASE contributors

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - blog:
      post_url_format: "posts/{slug}"
      archive: false
      categories: false
  - rss:
      match_path: blog/posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
      categories:
        - categories
      image: https://sase.sh/images/sase_overview.png

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
