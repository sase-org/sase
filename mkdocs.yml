site_name: SASE
site_description: Structured Agentic Software Engineering
site_url: https://sase.sh/
repo_url: https://github.com/sase-org/sase
repo_name: sase-org/sase
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - blog:
      post_url_format: "{slug}"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

