site_name: SASE
site_description: Structured Agentic Software Engineering
site_url: https://sase.sh/
site_author: SASE contributors
repo_url: https://github.com/sase-org/sase
repo_name: sase-org/sase
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

nav:
  - Home: index.md
  - Getting Started:
      - Your First 15 Minutes: getting_started.md
      - Initialization: init.md
      - Content Layout Migration: content_layout.md
      - Agent Providers: agent_providers.md
  - The Basics:
      - Memory: memory.md
      - ACE TUI: ace.md
      - AXE Automation: axe.md
      - Spec-Driven Development: sdd.md
      - SDD Storage: sdd_storage.md
      - XPrompts: xprompt.md
      - Artifact References: artifact_references.md
      - Prompt History: prompt.md
  - Beyond the Basics:
      - Architecture: architecture.md
      - Patches: change_spec.md
      - Beads: beads.md
      - Workflows: workflow_spec.md
      - Agent Families: agent_families.md
      - Workspaces: workspace.md
      - Mentors: mentors.md
  - The Nitty Gritty:
      - Commit Workflows: commit_workflows.md
      - Notifications: notifications.md
      - Mobile Gateway: mobile_gateway.md
      - Mobile MVP Runbook: mobile_mvp_runbook.md
      - Performance Runbook: perf_runbook.md
      - Telemetry: telemetry.md
      - Agent Revival Log: troubleshooting/agent-revival.md
      - Runner Slot Waits: troubleshooting/runner-slots.md
  - Integrations:
      - Editor Integration: editor.md
      - Integration APIs: integrations.md
      - Plugins: plugins.md
      - Fakey Testing Provider: fakey.md
      - LLM Providers: llms.md
      - VCS Providers: vcs.md
      - Rust Backend: rust_backend.md
  - Reference:
      - CLI Reference: cli.md
      - Development: development.md
      - Configuration: configuration.md
      - Query Language: query_language.md
      - ProjectSpec: project_spec.md
      - Agent Attachments: agent_images.md
      - Acknowledgements: acknowledgements.md
  - Blog:
      - Blog Home: blog/index.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sase-org/sase
      name: SASE on GitHub

copyright: Copyright &copy; 2026 SASE contributors

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - blog:
      post_url_format: "posts/{slug}"
      archive: false
      categories: false
  - rss:
      match_path: blog/posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
      categories:
        - categories
      image: https://sase.sh/images/sase_overview.png

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
