site_name: SASE
site_description: One developer. A team of coding agents. Tracked, reviewable, repeatable work.
site_url: https://sase.sh/
site_author: SASE contributors
repo_url: https://github.com/sase-org/sase
repo_name: sase-org/sase
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

nav:
  - Home: index.md
  - Get started:
      - Your first 15 minutes: getting_started.md
      - Initialize SASE: init.md
      - Shell completion: completion.md
  - Guides:
      - Fix problems:
          - Restart an agent automatically: agent_auto_restart.md
          - Recover an interrupted agent: troubleshooting/agent-revival.md
          - Unstick a queued agent: troubleshooting/runner-slots.md
  - Concepts:
      - How SASE works: architecture.md
      - Spec-driven development: sdd.md
  - Reference:
      - TUI:
          - sase's TUI: ace.md
          - SASE Pager: pager.md
      - CLI:
          - CLI reference: cli.md
          - Query language: query_language.md
          - Named tools: tool.md
      - Configuration:
          - Configuration: configuration.md
          - ProjectSpec: project_spec.md
      - Macros and workflows:
          - Macros: macros.md
          - Workflows: workflow_spec.md
      - Work units:
          - Patches: change_spec.md
          - Beads: beads.md
          - Goals: goals.md
      - Agents and workspaces:
          - Agent providers: agent_providers.md
          - Agent sessions: agent_sessions.md
          - Agent hood synchronization: agents_sidecar.md
          - Agent attachments: agent_images.md
          - Instruction bundles: instruction_bundles.md
          - Mentors: mentors.md
          - Remote dispatch: remote_dispatch.md
          - Workspaces: workspace.md
      - Automation:
          - Scheduler and service host: axe.md
          - Monitors: monitors.md
          - Notifications: notifications.md
          - Sudo requests: sudo.md
      - Providers:
          - LLM providers: llms.md
          - VCS providers: vcs.md
      - Memory:
          - Memory: memory.md
          - Memory history: memory_history.md
      - Prompts and artifacts:
          - Prompt history: prompt.md
          - Artifact references: artifact_references.md
          - Artifact links: artifact_links.md
      - Integrations:
          - Editor integration: editor.md
          - Integration APIs: integrations.md
          - Plugins: plugins.md
          - Mobile gateway: mobile_gateway.md
      - Migration:
          - Content layout migration: content_layout.md
  - Contribute:
      - Development: development.md
      - Rust backend: rust_backend.md
      - Fakey testing provider: fakey.md
      - Telemetry: telemetry.md
      - Performance runbook: perf_runbook.md
      - Mobile MVP runbook: mobile_mvp_runbook.md
      - Commit workflows: commit_workflows.md
      - Instruction inventory: instruction_inventory.md
      - SDD storage: sdd_storage.md
      - Artifacts pane contract: artifacts_pane_contract.md
      - Artifacts visual grammar: artifacts_pane_visual_grammar.md
      - Acknowledgements: acknowledgements.md
  - Blog:
      - Blog Home: blog/index.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  analytics:
    provider: cloudflare
    token: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sase-org/sase
      name: SASE on GitHub

copyright: Copyright &copy; 2026 SASE contributors

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      redirect_maps:
        'xprompt.md': 'macros.md'
  - blog:
      post_url_format: "posts/{slug}"
      archive: false
      categories: false
  - rss:
      match_path: blog/posts/.*
      use_git: false
      date_from_meta:
        as_creation: date
      categories:
        - categories
      image: https://sase.sh/images/sase_social_card.png

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
