site_name: SASE
site_description: One developer. A team of coding agents. Tracked, reviewable, repeatable work.
site_url: https://sase.sh/
site_author: SASE contributors
repo_url: https://github.com/sase-org/sase
repo_name: sase-org/sase
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

exclude_docs: |
  images/**/*.prompt.md
  images/**/*.critique.md
  images/infographic-style-brief.md
  _templates/
  _meta/
  _includes/
  README.md

